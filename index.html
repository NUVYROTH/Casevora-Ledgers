<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記帳幫手</title>
<style>
:root{
  --bg:#fff8f0; --card:#ffffff; --ink:#4a3b3b; --muted:#8b7878; --line:#f2ddd2;
  --brand:#ff8a7a; --brand-d:#e9695a; --brand-soft:#ffe3dc; --accent:#ffb88c;
  --ok:#3f9d71; --ok-soft:#e5f5ec; --bad:#d9534f; --bad-soft:#fdecea; --info:#8a6bd1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.6;background-attachment:fixed;background-size:cover;background-position:center}
body.bgpage{background-image:linear-gradient(rgba(255,248,240,.82),rgba(255,248,240,.82)),var(--bgimg)}
body.bgboth{background-image:linear-gradient(rgba(255,248,240,.5),rgba(255,248,240,.5)),var(--bgimg)}
header{position:relative;overflow:hidden;min-height:150px;background:linear-gradient(135deg,#ffb4a2,#ffd6a5);border-radius:0 0 28px 28px;box-shadow:0 4px 14px rgba(233,105,90,.18)}
header.custom{background-size:cover;background-position:center}
header svg{position:absolute;inset:0;width:100%;height:100%}
header.custom svg{display:none}
header .t{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:26px 20px 22px}
header .t .tt{display:inline-block;border-radius:18px;padding:2px 2px}
header.custom .t .tt{background:rgba(255,255,255,.75);padding:8px 14px}
header h1{margin:0;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(233,105,90,.5);letter-spacing:1px}
header.custom h1{color:var(--brand-d);text-shadow:none}
header .sub{font-size:13px;color:#fff;opacity:.95;text-shadow:0 1px 0 rgba(233,105,90,.45)}
header .sub .lead{font-size:16px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 0 rgba(200,80,65,.75),0 0 6px rgba(200,80,65,.45)}
header .sub .note{display:inline-block;margin-top:6px;background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;font-weight:700;border-radius:999px;padding:2px 12px;box-shadow:0 1px 4px rgba(233,105,90,.2)}
header.custom .sub{color:var(--ink);text-shadow:none}
main{max-width:760px;margin:0 auto;padding:6px 16px 90px}
nav{display:flex;gap:8px;overflow-x:auto;margin:0;padding:4px 0 6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(233,105,90,.07)}
.card h2{margin:0 0 10px;font-size:17px}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px}
button:hover{background:#fff3ee}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.primary:hover{background:var(--brand-d)}
button.danger{color:var(--bad);border-color:#efb9b5}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.muted{color:var(--muted)} .small{font-size:13px}
.quick{display:flex;gap:8px}
.quick input{font-size:18px;padding:13px 16px;border-radius:16px}
.quick button{padding:0 22px;font-size:17px;border-radius:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:18px;padding:12px 8px;text-align:center;background:var(--brand-soft)}
.stat .n{font-size:clamp(14px,4.6vw,22px);font-weight:800;line-height:1.2;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:13px;font-weight:700;color:var(--muted)}
.stat.in .n{color:var(--ok)} .stat.out .n{color:var(--bad)}
.stat.in{background:var(--ok-soft)} .stat.out{background:var(--bad-soft)}
.rec{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.rec:last-child{border-bottom:0}
.rec .ic{font-size:26px;width:38px;text-align:center;flex:none}
.rec .mid{flex:1;min-width:0}
.rec .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .sb{font-size:12px;color:var(--muted)}
.rec .am{font-weight:800;white-space:nowrap}
.rec .am.in{color:var(--ok)} .rec .am.out{color:var(--bad)} .rec .am.mv{color:var(--info)}
.paysel{display:flex;gap:8px;align-items:center;margin-top:8px}
.paysel select{width:auto;max-width:60%;padding:6px 10px}
.acc{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.acc:last-child{border-bottom:0}
.acc .ic{font-size:26px;width:38px;text-align:center;flex:none}
.acc .mid{flex:1;min-width:120px}
.acc .bal{font-weight:800;font-size:18px;white-space:nowrap}
.acc .ops{display:flex;gap:6px;width:100%;justify-content:flex-end}
.acc .ops button{padding:4px 10px;font-size:13px}
.total{text-align:center;padding:6px 0}
.total .n{font-size:clamp(22px,7vw,30px);font-weight:800}
.cmp{display:block;font-size:11px;font-weight:700;margin-top:2px}
.bs{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.bs.sum{font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand-d);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700;margin-left:4px}
.ask{border:2px dashed var(--brand);background:#fff7f4}
.empty{text-align:center;padding:26px;color:var(--muted)}
.bar{display:grid;grid-template-columns:90px 1fr 76px;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.bar .b{background:var(--brand-soft);border-radius:999px;height:14px}
.bar .b i{display:block;height:14px;background:var(--brand);border-radius:999px;min-width:3px}
.bar .v{text-align:right;font-weight:700}
.dayh{display:flex;justify-content:space-between;font-weight:800;margin:10px 0 2px;color:var(--brand-d)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 16px}
.savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 首頁儀表板：手機照原本順序一欄；電腦兩欄 */
.dash{display:flex;flex-direction:column}
.dash .col{display:contents}
.dash>.kpis{margin-bottom:14px}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}
.desk{display:none}
.card h2 .sub{font-size:12px;font-weight:700;color:var(--muted);margin-left:6px}
@media (min-width:900px){
  .dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 18px;align-items:start}
  .dash .col{display:block}
  .dash>.kpis{grid-column:1/-1;order:0}
  .desk{display:block}
  .stat{padding:16px 8px}
  .stat .n{font-size:clamp(16px,1.6vw,22px)}
  .savebar .in{max-width:1180px}
}
.dirty{color:#b45309;font-weight:700;font-size:14px}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:50vh;overflow:auto}
.icgrid button{font-size:24px;padding:4px}
.modal{position:fixed;inset:0;background:rgba(74,59,59,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:22px;padding:18px;max-width:440px;width:100%}
.tabs button{border-radius:999px;padding:4px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{color:var(--muted)}
.notice{border-radius:14px;padding:10px 14px;font-size:14px;margin:8px 0;background:#fff3e0;color:#7a3d06}
details summary{cursor:pointer;font-weight:700}

/* ===== 版面：左側滿版工具列（參考衛生追蹤），配色維持原本 ===== */
#side{max-width:760px;margin:0 auto;padding:12px 16px 0}
#side .brand,#side .ws,#side .foot{display:none}
nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
.phead{display:flex;align-items:flex-start;gap:12px;margin:8px 0 12px}
.phead h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
.phead .en{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--brand-d)}
.phead .en:before{content:"";width:22px;height:2px;background:var(--brand)}
.phead .desc{font-size:13px;color:var(--muted);margin-top:2px}
.phead .badge{margin-left:auto;flex:none;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:800;border-radius:999px;padding:3px 12px;white-space:nowrap}
.nbar{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{position:relative;background:var(--card);border:2px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(233,105,90,.06);min-width:0}
.kpi .t{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:clamp(18px,5vw,26px);font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .i{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--cs)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{border-radius:999px;padding:4px 14px;font-weight:700}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.brow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"n n n a" "s d f f" "x x x x";gap:6px 10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.bhead{display:none}
.brow .cn{grid-area:n;min-width:0}.brow .ca{grid-area:a;font-weight:800;text-align:right;white-space:nowrap}.brow .cs{grid-area:s}.brow .cd{grid-area:d;white-space:nowrap}.brow .cf{grid-area:f;min-width:0}.brow .cx{grid-area:x;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.brow .cn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .cn .sb{font-size:12px;color:var(--muted)}
.brow .cx button{padding:4px 12px;font-size:13px}
button.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
button.dark:hover{background:#2f2424}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}.pill.late{background:var(--bad-soft);color:var(--bad)}.pill.wait{background:#eef0f6;color:#5b6478}.pill.today,.pill.moved{background:#fff3e0;color:#b45309}.pill.skip{background:#f1eeee;color:var(--muted)}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle;margin:0 4px 0 0;background:#fffaf6}
.attbtn{padding:2px 10px!important;font-size:12px!important;border-style:dashed!important}
.psgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ps{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;min-width:0}
.ps.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ps .ims{display:flex;gap:6px;flex-wrap:wrap;min-height:96px;align-items:center;justify-content:center;background:#fffaf6;border:2px dashed var(--line);border-radius:12px;margin:8px 0;padding:6px;text-align:center}
.ps .ims img{height:86px;max-width:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.pastebox{border:2px dashed var(--brand);background:#fff7f4;border-radius:14px;padding:16px;text-align:center;margin:8px 0}
.viewer img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:10px}
.tscroll{overflow-x:auto;max-width:100%}
.ottb th,.ottb td{padding:7px 4px}
@media (max-width:600px){.ottb .hm{display:none}}
.prog{height:10px;border-radius:999px;background:var(--brand-soft);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ok)}
@media (min-width:900px){
  header#hd{display:none}
  #side{position:fixed;top:0;left:0;bottom:0;width:240px;max-width:none;margin:0;padding:0;background:var(--card);border-right:2px solid var(--line);display:flex;flex-direction:column;z-index:20;overflow-y:auto;box-shadow:4px 0 14px rgba(233,105,90,.06)}
  #side .brand{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#ffb4a2,#ffd6a5);padding:22px 16px}
  #side .brand svg{width:46px;height:58px;flex:none}
  #side .bn{font-size:21px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(233,105,90,.5);letter-spacing:1px}
  #side .bs2{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(200,80,65,.7)}
  #side .ws{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;padding:18px 20px 6px}
  nav{flex-direction:column;overflow:visible;padding:0 12px;gap:4px;flex:1}
  nav button{text-align:left;padding:11px 14px;border-radius:14px;border-color:transparent;font-size:15px;background:transparent}
  nav button:not(.on):hover{background:var(--brand-soft)}
  #side .foot{display:block;margin:12px;padding:12px 8px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}
  main{margin-left:240px;max-width:none;padding:26px 32px 60px}
  .phead{margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .phead h1{font-size:28px}
  .nbar{display:flex;align-items:center;gap:12px;background:var(--bad-soft);border:2px solid #f3c2bd;border-left:5px solid var(--bad);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-weight:700;color:#9b2c25;font-size:14px}
  .nbar .lab{background:#a1302a;color:#fff;border-radius:6px;padding:1px 10px;font-size:13px;flex:none}
  .nbar button{margin-left:auto;flex:none;font-size:13px;padding:4px 12px;color:#9b2c25;border-color:#efb9b5}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .kpi{padding:14px 16px}
  .brow{grid-template-columns:minmax(0,2fr) 100px 140px 64px minmax(0,1fr) auto;grid-template-areas:"n a s d f x";gap:6px 14px;padding:12px 6px}
  .brow .ca{text-align:left}
  .brow.bhead{display:grid;font-size:13px;font-weight:700;color:var(--muted);padding:6px}
  .savebar{left:240px}
}

.gcard summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none;font-size:16px;flex-wrap:wrap}
.gcard summary::-webkit-details-marker{display:none}.gcard summary::before{content:'▸';color:var(--brand-d)}.gcard details[open] summary::before{content:'▾'}
.mg-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.mg-step{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card)}
.mg-h{font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.mg-h .no{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;align-items:center;justify-content:center;font-size:12px;flex:none}
.mg-txt p{margin:0 0 6px;font-size:14px}.mg-txt ul{margin:0 0 6px;padding-left:18px;font-size:14px}
.gx{background:#fff1e8;border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;font-size:12px;max-width:340px}
.gx-c{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px}
.gx-t{font-weight:700;font-size:12px}
.gx-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gx-b{display:inline-flex;align-items:center;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11.5px;white-space:nowrap;color:var(--ink)}
.gx-b.dk{background:var(--ink);color:#fff;border-color:var(--ink)}.gx-b.pr{background:var(--brand);color:#fff;border-color:var(--brand)}.gx-b.rd{color:var(--bad);border-color:#efb9b5}
.gx-b.hl,.gx-in.hl{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.gx-bn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.gx-n{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;flex:none;vertical-align:middle;margin:0 1px}
.gx-in{background:#fffaf6;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);flex:1;min-width:70px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-s{font-size:11px;color:var(--muted)}
.gx-ph{display:inline-block;width:34px;height:26px;border-radius:4px;background:#ffe3dc;border:1px solid var(--line)}
.gx-dash{border:2px dashed var(--brand);background:#fff7f4;color:var(--brand-d);border-radius:8px;padding:5px;text-align:center;font-size:11px}
.gx-k{display:inline-flex;flex-direction:column;flex:1;min-width:90px;padding:4px 8px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;font-weight:800;font-size:14px;background:#fff}.gx-k small{font-weight:700;font-size:10px;color:var(--muted)}
.gx-key{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:#fff;padding:2px 8px;font-weight:800;font-size:12px}
.fsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fstep{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.fstep .fno{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--brand-d);margin-bottom:4px}
.fstep b{font-size:14.5px}.fstep p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.helpbtn{display:none}
@media (min-width:700px){.mg-step{grid-template-columns:260px minmax(0,1fr)}}
@media (min-width:1300px){.mg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.helpbtn{display:flex;align-items:center;gap:10px;margin:0 12px 4px;padding:10px 14px;border-radius:14px;border-color:transparent;background:transparent;font-weight:700;text-align:left}
  .helpbtn span{display:inline-flex;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);align-items:center;justify-content:center;font-size:12px}
  .helpbtn:hover{background:var(--brand-soft)}}

.addph{padding:5px 12px;font-size:13px;border-radius:999px;border-style:dashed;white-space:nowrap}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;background:#fff7f4;overflow:hidden}
.chip button{border:0;background:transparent;padding:3px 4px 3px 12px;font-size:13px;font-weight:700;border-radius:0;color:var(--brand-d)}
.chip button:hover{background:var(--brand-soft)}
.chip a{color:var(--muted);text-decoration:none;padding:3px 10px 3px 4px;font-weight:700}
.chip a:hover{color:var(--bad)}
.paysel{flex-wrap:wrap}
.gx-chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;background:#fff7f4;color:var(--brand-d);font-weight:700}

<script>
const KEY_R='casevoraXiaozhang_v1', KEY_S='casevoraXiaozhang_v1_settings';
const OT_KIND={wd:'平日加班',rest:'休息日加班',hol:'國定假日／例假加班',lv_personal:'事假',lv_sick:'病假',lv_men:'生理假',lv_typhoon:'颱風假'};
const EXP=['餐飲','交通','生活用品','房租','娛樂','醫療','帳單','其他'];
const INC=['薪資','兼職','其他收入'];
const DEF_ICON={餐飲:'🍙',交通:'🚌',生活用品:'🧻',房租:'🏠',娛樂:'🎮',醫療:'💊',帳單:'🧾',其他:'🧸',薪資:'💰',兼職:'🐥',其他收入:'🎁'};
const DEF_ACCTS=[{id:'cash',name:'現金',icon:'💵',init:0},{id:'linepay',name:'LINE Pay',icon:'💚',init:0},{id:'applepay',name:'Apple Pay',icon:'🍎',init:0},{id:'jko',name:'街口支付',icon:'🧡',init:0},{id:'easycard',name:'悠遊卡',icon:'🎫',init:0}];
const ACCT_TYPES={cash:'💵 現金',bank:'🏦 銀行帳戶',epay:'📱 電子支付',card:'💳 信用卡',other:'🗂️ 其他帳戶'};
function defType(id){return id==='cash'?'cash':['linepay','applepay','jko','easycard'].includes(id)?'epay':'other';}
function typeOpts(sel){return Object.entries(ACCT_TYPES).map(([k,n])=>`<option value="${k}" ${k===sel?'selected':''}>${n}</option>`).join('');}
const ACCT_ALIAS={cash:['現金'],linepay:['line\\s*pay'],applepay:['apple\\s*pay','蘋果\\s*pay'],jko:['街口支付','街口'],easycard:['悠遊卡']};
const ICONS='🍙 🍜 🍱 🍰 🍩 🍦 🧋 ☕ 🍎 🍓 🥐 🍕 🍔 🍟 🍣 🥗 🍪 🍫 🍉 🍇 🚌 🚇 🚗 🚲 🛵 ⛽ 🚕 ✈️ 🚆 🛴 🧻 🧴 🧼 🛒 🛍️ 🧺 🪥 🧽 🏠 💡 💧 🔥 🎮 🎬 🎤 🎧 🎁 🎈 🎀 🌸 🧸 📚 🎨 ⚽ 💊 🏥 🩹 🦷 🩺 🧾 💳 📱 🌐 🔌 🔑 💰 💵 🪙 🐷 🌟 ✨ 🍀 🐱 🐶 🐰 🐻 🐼 🦊 🐥 🐣 🐸 🦄 🌈 ☁️ 🌙 ⭐ 💖 🎀'.split(' ');
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const p2=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function addDays(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());}
function validYMD(y,m,d){const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;}
function fmtMD(s){const [,m,d]=s.split('-');return `${+m}/${+d}`;}
function fmtFull(s){const [y,m,d]=s.split('-');return `${y}/${+m}/${+d}`;}
function money(n){return '$'+(Math.round(Number(n)*100)/100).toLocaleString('en-US');}
function bm(n){return n<0?'-'+money(-n):money(n);}
/* 小格子用：太長就改成「萬」，完整金額放在 title */
function bmS(n){ const a=Math.abs(n); if(a<100000) return bm(n); const w=Math.round(a/1000)/10; return (n<0?'-$':'$')+(w>=1000?Math.round(w).toLocaleString('en-US'):w)+'萬'; }
function flash(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#e9695a;color:#fff;padding:9px 20px;border-radius:999px;z-index:99;box-shadow:0 3px 10px rgba(0,0,0,.2);font-weight:700;max-width:92vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ---------- 資料 ---------- */
let R=loadR(), S=loadS();
function defaultS(){return {rules:[],people:[],catIcons:{},bg:{url:'',mode:'both'},recentN:10,accounts:JSON.parse(JSON.stringify(DEF_ACCTS)),acctInitDone:false,debts:[],goals:[],recurring:[],recurDone:{},recurMove:{},att:{},payslips:{},ot:{bases:[],days:[],paid:{},bonus:{cert:0,fest:0,from:''}},phrases:['平日加班2H'],lastBackup:''};}
function fixS(s){ if(!Array.isArray(s.accounts)) s.accounts=JSON.parse(JSON.stringify(DEF_ACCTS));
  s.accounts=s.accounts.filter(a=>a&&/^[\w-]{1,40}$/.test(String(a.id))&&String(a.name||'').trim()).map(a=>({id:String(a.id),name:String(a.name).trim().slice(0,20),icon:typeof a.icon==='string'?a.icon.slice(0,8):'💳',init:Number.isFinite(Number(a.init))?Number(a.init):0,dueDay:dayOk(a.dueDay),atype:ACCT_TYPES[a.atype]?a.atype:defType(a.id)})); if(!s.accounts.some(a=>a&&a.id==='cash')) s.accounts.unshift({id:'cash',name:'現金',icon:'💵',init:0,dueDay:0});
  if(!Array.isArray(s.debts)) s.debts=[];
  s.debts=s.debts.filter(d=>d&&/^[\w-]{1,40}$/.test(String(d.id))&&String(d.name||'').trim()&&['loan','person'].includes(d.kind)).map(d=>({id:String(d.id),name:String(d.name).trim().slice(0,20),kind:d.kind,
    init:Number.isFinite(Number(d.init))?Number(d.init):0,monthly:Number(d.monthly)>0?Number(d.monthly):0,dueDay:dayOk(d.dueDay),payAcct:/^[\w-]{1,40}$/.test(String(d.payAcct||''))?String(d.payAcct):'',created:/^\d{4}-\d{2}-\d{2}$/.test(String(d.created||''))?d.created:'',sub:['loan','inst','other'].includes(d.sub)?d.sub:'loan',orig:Number(d.orig)>0?Number(d.orig):0,end:/^\d{4}-\d{2}-\d{2}$/.test(String(d.end||''))?d.end:''}));
  if(!Array.isArray(s.recurring)) s.recurring=[];
  s.recurring=s.recurring.filter(x=>x&&/^[\w-]{1,40}$/.test(String(x.id))&&String(x.name||'').trim()&&Number(x.amount)>0&&/^\d{4}-\d{2}$/.test(String(x.start||''))).map(x=>({id:String(x.id),name:String(x.name).trim().slice(0,20),kind:['income','expense','debt'].includes(x.kind)?x.kind:'expense',amount:Math.round(Number(x.amount)*100)/100,day:dayOk(x.day)||1,start:x.start,end:/^\d{4}-\d{2}$/.test(String(x.end||''))?x.end:'',acct:/^[\w-]{1,40}$/.test(String(x.acct||''))?String(x.acct):'',debt:/^[\w-]{1,40}$/.test(String(x.debt||''))?String(x.debt):''}));
  if(!s.recurDone||typeof s.recurDone!=='object'||Array.isArray(s.recurDone)) s.recurDone={};
  const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o), KEYRE=/^[\w-]{1,40}\|\d{4}-\d{2}$/, YMRE=/^\d{4}-\d{2}$/, phList=a=>Array.isArray(a)?a.filter(i=>/^[\w-]{1,60}$/.test(String(i))).map(String).slice(0,20):[];
  const mv={}; if(isObj(s.recurMove)) Object.entries(s.recurMove).forEach(([k,v])=>{ if(KEYRE.test(k)&&YMRE.test(String(v))) mv[k]=String(v); }); s.recurMove=mv;
  const at={}; if(isObj(s.att)) Object.entries(s.att).forEach(([k,v])=>{ const l=phList(v); if(KEYRE.test(k)&&l.length) at[k]=l; }); s.att=at;
  const ot=isObj(s.ot)?s.ot:{}, DRE=/^\d{4}-\d{2}-\d{2}$/, half=v=>Math.round(Number(v)*2)/2;
  s.ot={bases:(Array.isArray(ot.bases)?ot.bases:[]).filter(b=>b&&DRE.test(String(b.from))&&Number(b.amt)>0).map(b=>({from:String(b.from),amt:Math.round(Number(b.amt))})).sort((a,b)=>a.from.localeCompare(b.from)),
    days:(Array.isArray(ot.days)?ot.days:[]).filter(d=>d&&/^[\w-]{1,40}$/.test(String(d.id))&&DRE.test(String(d.date))&&OT_KIND[d.kind]&&half(d.hrs)>0).map(d=>({id:String(d.id),date:String(d.date),kind:d.kind,hrs:Math.min(24,half(d.hrs)),appr:Number.isFinite(Number(d.appr))&&String(d.appr)!==''&&d.appr!==null?Math.max(0,Math.min(24,half(d.appr))):null,note:String(d.note||'').slice(0,40)})),
    paid:{},bonus:{cert:Number(ot.bonus&&ot.bonus.cert)>0?Math.round(ot.bonus.cert):0,fest:Number(ot.bonus&&ot.bonus.fest)>0?Math.round(ot.bonus.fest):0,from:ot.bonus&&/^\d{4}-\d{2}$/.test(String(ot.bonus.from))?String(ot.bonus.from):''}}; if(isObj(ot.paid)) Object.entries(ot.paid).forEach(([k,v])=>{ if(/^\d{4}-\d{2}$/.test(k)&&Number(v)>=0&&String(v)!=='') s.ot.paid[k]=Math.round(Number(v)); });
  if(!Array.isArray(s.phrases)) s.phrases=['平日加班2H']; s.phrases=[...new Set(s.phrases.map(x=>String(x??'').trim().slice(0,30)).filter(Boolean))].slice(0,40);
  s.lastBackup=/^\d{4}-\d{2}-\d{2}$/.test(String(s.lastBackup||''))?s.lastBackup:'';
  const ps={}; if(isObj(s.payslips)) Object.entries(s.payslips).forEach(([k,v])=>{ if(!YMRE.test(k)||!isObj(v)) return; const l=phList(v.ph), note=String(v.note||'').slice(0,80); if(l.length||note) ps[k]={ph:l,note}; }); s.payslips=ps;
  if(!Array.isArray(s.goals)) s.goals=[];
  s.goals=s.goals.filter(g=>g&&/^[\w-]{1,40}$/.test(String(g.id))&&String(g.name||'').trim()).map(g=>({id:String(g.id),name:String(g.name).trim().slice(0,20),target:Number(g.target)>0?Number(g.target):0,
    mode:g.mode==='acct'?'acct':'manual',acct:/^[\w-]{1,40}$/.test(String(g.acct||''))?String(g.acct):'',deadline:/^\d{4}-\d{2}-\d{2}$/.test(String(g.deadline||''))?g.deadline:'',done:g.done===true,doneAt:/^\d{4}-\d{2}-\d{2}$/.test(String(g.doneAt||''))?g.doneAt:''}));
  return s; }
function dayOk(v){const n=Math.floor(Number(v));return n>=1&&n<=31?n:0;}
function loadR(){try{const a=JSON.parse(localStorage.getItem(KEY_R));return Array.isArray(a)?a:[];}catch(e){return [];}}
function loadS(){try{return fixS(Object.assign(defaultS(),JSON.parse(localStorage.getItem(KEY_S))||{}));}catch(e){return defaultS();}}
function persist(){try{localStorage.setItem(KEY_R,JSON.stringify(R));localStorage.setItem(KEY_S,JSON.stringify(S));
  const used=(localStorage.getItem(KEY_R)||'').length+(localStorage.getItem(KEY_S)||'').length;
  if(used>4000000&&!window.__w){window.__w=true;alert('提醒：本機儲存空間已用約 80% 以上。請盡快「下載備份」，並考慮換成較小的背景圖。');}
  return true;}catch(e){alert('儲存失敗！瀏覽器的儲存空間可能已滿。請先「下載備份」，再刪除部分紀錄或背景圖。');return false;}}
const live=()=>R.filter(r=>!r.deleted);
function iconOf(cat){return S.catIcons[cat]||DEF_ICON[cat]||'🧸';}
function recIcon(r){return r.icon||iconOf(r.category);}
function sortRecs(a){return a.slice().sort((x,y)=>y.date.localeCompare(x.date)||(y.createdAt||'').localeCompare(x.createdAt||''));}
function newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- 帳戶 ---------- */
function acctById(id){return S.accounts.find(a=>a.id===id);}
function okAcct(id){return acctById(id)?id:'cash';}
function acctName(id){const a=acctById(okAcct(id));return a?a.name:'現金';}
function acctIcon(id){const a=acctById(okAcct(id));return (a&&a.icon)||'💳';}
function acctOpts(sel){return S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.icon||'💳'} ${esc(a.name)}</option>`).join('');}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function findAccts(t){
  const hits=[];
  S.accounts.forEach(a=>{ [...(ACCT_ALIAS[a.id]||[]), reEsc(a.name).replace(/\s+/g,'\\s*')].forEach(p=>{
    const re=new RegExp(p,'ig'); let m; while((m=re.exec(t))){ if(!m[0].length){re.lastIndex++;continue;} hits.push({id:a.id,idx:m.index,len:m[0].length}); } }); });
  hits.sort((a,b)=>b.len-a.len||a.idx-b.idx); const taken=[], out=[];
  for(const h of hits){ if(taken.some(([s,e])=>h.idx<e&&h.idx+h.len>s)) continue; taken.push([h.idx,h.idx+h.len]); out.push(h); }
  return out.sort((a,b)=>a.idx-b.idx);
}
function cutSpans(t,hs){ hs.slice().sort((a,b)=>b.idx-a.idx).forEach(h=>{t=t.slice(0,h.idx)+' '+t.slice(h.idx+h.len);}); return t; }
function balances(upto){
  const b={}; S.accounts.forEach(a=>b[a.id]=Number(a.init)||0);
  live().forEach(r=>{ const g=okAcct; if(upto&&r.date>upto) return;
    if(r.type==='income') b[g(r.acct)]+=r.amount;
    else if(r.type==='expense') b[g(r.acct)]-=r.amount;
    else if(r.type==='transfer'){ b[g(r.from)]-=r.amount; b[g(r.to)]+=r.amount; }
    else if(r.type==='adjust') b[g(r.acct)]+=(r.sign<0?-1:1)*r.amount;
    else if(r.type==='debt') b[g(r.acct)]+=(r.op==='borrow'||r.op==='collect'?1:-1)*r.amount; });
  Object.keys(b).forEach(k=>b[k]=Math.round(b[k]*100)/100); return b;
}
function isExp(r){return r.type==='expense'||(r.type==='debt'&&r.exp===true);}

/* ---------- 儲蓄目標 ---------- */
function goalById(id){return S.goals.find(g=>g.id===id);}
function goalSaved(g,b){ if(g.mode==='acct') return acctById(g.acct)?Math.max((b||balances())[g.acct],0):0;
  return Math.round(live().filter(r=>r.type==='save'&&r.goal===g.id).reduce((a,r)=>a+r.amount,0)*100)/100; }
/* 「旅遊基金存5000」：文字裡有『自己標記』目標的名稱＋「存」 */
function findGoal(tt){ if(!/存/.test(tt)) return null; const lt=tt.toLowerCase();
  return S.goals.filter(g=>g.mode==='manual').sort((a,b)=>(a.done-b.done)).sort((a,b)=>b.name.length-a.name.length).find(g=>lt.includes(g.name.toLowerCase()))||null; }

/* ---------- 負債 ---------- */
const DEBT_OP={pay:-1,borrow:1,lend:-1,collect:1};
function debtById(id){return S.debts.find(d=>d.id===id);}
/* 貸款：正數 = 還欠多少。朋友：正數 = 我欠對方，負數 = 對方欠我 */
function debtBal(upto){
  const d={}; S.debts.forEach(x=>d[x.id]=(upto&&x.created&&x.created>upto)?0:(Number(x.init)||0));
  live().forEach(r=>{ if(upto&&r.date>upto) return; if(r.type==='debt'&&r.debt in d) d[r.debt]+=DEBT_OP[r.op]*r.amount; });
  Object.keys(d).forEach(k=>d[k]=Math.round(d[k]*100)/100); return d;
}
/* 資產負債：帳戶正數＋別人欠我 = 資產；帳戶負數（信用卡）＋貸款＋我欠別人 = 負債 */
function netWorth(upto){
  const b=balances(upto), d=debtBal(upto), r2=n=>Math.round(n*100)/100; let A=0,L=0; const assets=[], liabs=[];
  S.accounts.forEach(a=>{ const v=b[a.id]; if(v>0){A+=v;assets.push([`${a.icon||'💳'} ${a.name}`,v]);} else if(v<0){L+=-v;liabs.push([`${a.icon||'💳'} ${a.name}`,-v]);} });
  S.debts.forEach(x=>{ const v=d[x.id]; if(x.kind==='loan'){ if(v>0){L+=v;liabs.push([`🏦 ${x.name}`,v]);} }
    else if(v>0){L+=v;liabs.push([`📤 欠${x.name}`,v]);} else if(v<0){A+=-v;assets.push([`📥 ${x.name}欠我`,-v]);} });
  return {assets:r2(A),liab:r2(L),net:r2(A-L),assetList:assets,liabList:liabs};
}
function monthEnd(ym){const [y,m]=ym.split('-').map(Number);return `${ym}-${p2(new Date(y,m,0).getDate())}`;}
function prevYM(ym){const [y,m]=ym.split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${p2(m-1)}`;}
function cmpLine(cur,prev,goodUp,lab){ lab=lab||'上月'; const d=Math.round((cur-prev)*100)/100; if(!prev&&!cur) return `<span class="cmp">${lab}也是 $0</span>`;
  if(d===0) return `<span class="cmp">跟${lab}一樣</span>`;
  const up=d>0, pct=prev?Math.round(Math.abs(d)/Math.abs(prev)*100):null, good=up===goodUp;
  return `<span class="cmp" style="color:${good?'var(--ok)':'var(--bad)'}">比${lab} ${up?'▲':'▼'}${money(Math.abs(d))}${pct!==null?`（${pct}%）`:''}</span>`; }
function nwChart(n){
  const end=today().slice(0,7), firstRec=live().reduce((m,r)=>r.date<m?r.date:m,today()).slice(0,7); let ym=end; const months=[ym];
  while(months.length<n&&ym>firstRec){ ym=prevYM(ym); months.unshift(ym); }
  const vals=months.map(m=>netWorth(m===end?today():monthEnd(m)).net), hi=Math.max(0,...vals), lo=Math.min(0,...vals), span=Math.max(1,hi-lo);
  const W=320, H=140, bw=W/months.length, base=8+(hi/span)*(H-16), sc=(H-16)/span;
  return `<svg viewBox="0 0 ${W} ${H+34}" style="width:100%;height:auto;max-height:200px" role="img" aria-label="每月淨資產變化">
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>
    ${vals.map((v,i)=>{const h=Math.max(2,Math.abs(v)*sc), x=i*bw+bw*0.2, w=Math.min(bw*0.6,46), y=v>=0?base-h:base;
      return `<rect x="${x+(bw*0.6-w)/2}" y="${y}" width="${w}" height="${h}" rx="3" fill="${v>=0?'var(--ok)':'var(--bad)'}"><title>${months[i]}：${bm(v)}</title></rect>
      <text x="${i*bw+bw/2}" y="${H+14}" font-size="10" text-anchor="middle" fill="var(--muted)">${+months[i].slice(5)}月</text>`;}).join('')}
    <text x="${W}" y="${H+30}" font-size="10" text-anchor="end" fill="var(--muted)">最新：${bm(vals[vals.length-1])}</text></svg>`;
}

  let s=mk(y,m); if(s<t){ s=m===12?mk(y+1,1):mk(y,m+1); } return {date:s,days:daysBetween(t,s)}; }
function debtLabel(op,name){return {pay:`還${name}`,borrow:`跟${name}借錢`,lend:`借給${name}`,collect:`${name}還錢`}[op]||name;}
/* 從文字判斷是不是借還錢（在找「對象」之前判斷，才分得出「還小明」跟「小明還」） */
function findDebt(tt){
  const lt=tt.toLowerCase();
  const loan=S.debts.filter(d=>d.kind==='loan').sort((a,b)=>b.name.length-a.name.length).find(d=>lt.includes(d.name.toLowerCase()));
  if(loan) return {id:loan.id,op:'pay',kind:'loan',name:loan.name};
  const pats=[[/^(?:跟|向)(.{1,10}?)借錢?$/,'borrow'],[/^還錢?(.{1,10}?)錢?$/,'pay'],[/^借錢?(?:給)?(.{1,10}?)錢?$/,'lend'],[/^(.{1,10}?)還錢?$/,'collect'],[/^(.{1,10}?)借錢?$/,'lend']];
  for(const [re,op] of pats){ const m=tt.match(re); if(!m) continue; const nm=m[1].trim();
    if(!nm||/\d/.test(nm)||/借|還|跟|向/.test(nm)||/^(錢|款|貸款?|卡費?|書|車|錢包|給)$/.test(nm)) return null;
    const ex=S.debts.find(d=>d.kind==='person'&&d.name===nm); return {id:ex?ex.id:'',op,kind:'person',name:nm}; }
  return null;
}

const INC_KW=[['薪資',['薪水','薪資','月薪','工資','發薪','加班費','節金','年終','證書加給']],['兼職',['兼職','打工','外快','家教']],['其他收入',['收入','獎金','紅包','利息','退款','收到','中獎']]];

function classify(item){
  const t=item.toLowerCase();
  const rules=S.rules.slice().sort((a,b)=>b.word.length-a.word.length);
  for(const r of rules){ if(t.includes(r.word.toLowerCase())) return {type:INC.includes(r.category)?'income':'expense',category:r.category,who:r.who||'',learned:true}; }
  for(const [c,ks] of INC_KW) if(ks.some(k=>t.includes(k))) return {type:'income',category:c,who:'',learned:false};
  for(const [c,ks] of EXP_KW) if(ks.some(k=>t.includes(k))) return {type:'expense',category:c,who:'',learned:false};
  return {type:'expense',category:'其他',who:'',learned:false};
}
function parseInput(raw){
  let t=String(raw||'').trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').replace(/／/g,'/').replace(/＄/g,'$');
  if(!t) return {empty:true};
  /* 帳戶與轉帳：先把帳戶名稱找出來、從文字中拿掉，避免影響金額與項目判斷 */
  const hitsAll=findAccts(t), tk=t.match(/領|轉|加值|\+值/);
  let transfer=null, acct='';
  const bare=!hitsAll.filter(h=>h.id!=='cash').length && /(領|加值|\+值)\s*\d/.test(t);
  if(tk && (hitsAll.length||bare) && !/薪|獎金|紅包|利息|退款|收入/.test(t) && !/轉帳?給/.test(t)){
    const k=tk.index, kw=tk[0], bef=hitsAll.filter(h=>h.idx<k), aft=hitsAll.filter(h=>h.idx>k), nc=hitsAll.filter(h=>h.id!=='cash');
    let from='', to='';
    if(kw==='領'){ if(nc.length){ from=(bef.find(h=>h.id!=='cash')||nc[0]).id; const o=aft.find(h=>h.id!==from); to=o?o.id:'cash'; } else if(bare){ from=''; to='cash'; } }
    else if(kw==='轉'){ if(nc.length||(bef.length&&aft.length)){ from=bef.length?bef[bef.length-1].id:''; to=aft.length?aft[0].id:''; } }
    else { if(bef.length&&aft.length){from=bef[bef.length-1].id;to=aft[0].id;} else if(bef.length){to=bef[bef.length-1].id;from='cash';} else if(aft.length){to=aft[0].id;from='cash';} else {from='cash';to='';} }
    if(from||to){ transfer={from,to}; t=cutSpans(t,hitsAll).replace(/領|轉|加值|\+值/,' '); }
  }
  if(!transfer){ const hs=hitsAll.filter(h=>h.id!=='easycard'); if(hs.length){ acct=hs[0].id; t=cutSpans(t,hs); } }
  let date=today(), dateBad=false;
  if(/前天/.test(t)){date=addDays(today(),-2);t=t.replace('前天',' ');}
  else if(/昨天/.test(t)){date=addDays(today(),-1);t=t.replace('昨天',' ');}
  else if(/今天/.test(t)){t=t.replace('今天',' ');}
  else {
    let m=t.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
    if(m){const y=+m[1],mo=+m[2],d=+m[3]; if(validYMD(y,mo,d)){date=`${y}-${p2(mo)}-${p2(d)}`;} else dateBad=true; t=t.replace(m[0],' ');}
    else{ m=t.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日號]?/)||t.match(/(?<![\d.])(\d{1,2})[\/.](\d{1,2})(?![\d.\/])/);
      if(m){const y=+today().slice(0,4),mo=+m[1],d=+m[2]; if(validYMD(y,mo,d)){date=`${y}-${p2(mo)}-${p2(d)}`;} else dateBad=true; t=t.replace(m[0],' ');} }
  }
  if(dateBad) return {badDate:true};
  t=t.replace(/(\d),(?=\d{3})/g,'$1').replace(/[$元塊圓]/g,' ');
  let amount=null; const nums=[...t.matchAll(/\d+(?:\.\d+)?/g)];
  if(nums.length){const last=nums[nums.length-1]; amount=Number(last[0]); t=t.slice(0,last.index)+' '+t.slice(last.index+last[0].length);}
  const goal=transfer?null:findGoal(t.replace(/\s+/g,''));
  const debt=(transfer||goal)?null:findDebt(t.replace(/\s+/g,'').replace(/^買/,''));
  let who=''; for(const p of S.people.slice().sort((a,b)=>b.length-a.length)){ if(p&&t.includes(p)){who=p;t=t.replace(p,' ');break;} }
  let item=t.replace(/\s+/g,' ').trim().replace(/^買/,'').trim();
  if(!who){ const m=item.match(/^([還借])\s*(\S+)$/); if(m){ const c=S.people.filter(x=>x.startsWith(m[2])); if(c.length===1){ who=c[0]; item=m[1]; } } }
  if(who&&(item==='還'||item==='借')) item=item+'錢';
  if(transfer) return {date,amount,item:item.replace(/^(現金|錢)$/,''),who:'',acct:'',transfer};
  return {date,amount,item,who,acct,transfer:null,debt,goal};
}
const WHO_KW=['還錢','借','欠','轉帳','請客','代墊','分攤'];

  const ps=$('#paySel'); p.sel=ps?ps.value:'cash'; p.selTouched=!!(ps&&ps.dataset.t==='1');

}
function commitAdd(rec,onFail,msg){
  R.push(rec); if(!persist()){R.pop();if(onFail)onFail();return;}
  pending=null; if($('#qin')) $('#qin').value=''; hideAsk(); renderHome(); flash(msg);
}
function continueAdd(){
  const p=pending;
  if(!(p.amount>0)){ showAsk('amount',`「${esc(p.transfer?'這筆轉帳':(p.item||'這筆'))}」是多少錢呢？`); return; }
  if(p.transfer){
    const t=p.transfer;
    if(!t.from||!t.to){ showAskTransfer(); return; }
    if(t.from===t.to){ alert('轉出和轉入是同一個帳戶，請再選一次。'); t.to=''; showAskTransfer(); return; }
    const rec={id:newId(),type:'transfer',amount:p.amount,item:p.item||'',category:'轉帳',date:p.date,who:'',icon:'',from:t.from,to:t.to,createdAt:new Date().toISOString()};
    commitAdd(rec,null,`已記好 ✦ ${fmtMD(rec.date)} 轉帳 ${acctName(t.from)} → ${acctName(t.to)} ${money(rec.amount)}`); return;
  }
  if(p.goal){
    const g=goalById(p.goal.id); if(!g){ pending.goal=null; continueAdd(); return; }
    if(g.done){ if(!confirm(`「${g.name}」已經標記完成了。\n要把它移回「進行中」並記這筆嗎？`)){ cancelAsk(); return; } g.done=false; g.doneAt=''; }
    const acct=p.acct||(p.selTouched?p.sel:'')||'';
    const rec={id:newId(),type:'save',goal:g.id,goalName:g.name,amount:p.amount,item:`${g.name}存錢`,category:'儲蓄',date:p.date,who:'',icon:'',acct:acct&&acctById(acct)?acct:'',createdAt:new Date().toISOString()};
    commitAdd(rec,null,`已記好 ✦ ${g.name} +${money(rec.amount)}${rec.acct?`（放在${acctName(rec.acct)}）`:''}・帳戶餘額不變、不算支出`);
    return;
  }
  if(p.debt){
    const d=p.debt;
    if(!d.id&&!p.debtOk){ showAskDebt(); return; }
    let acct=p.acct||(p.selTouched?p.sel:'');
    if(!acct&&d.kind==='loan'){ const L=debtById(d.id); if(L&&L.payAcct&&acctById(L.payAcct)) acct=L.payAcct; }
    acct=okAcct(acct||'cash');
    const oS=JSON.stringify(S); let id=d.id;
    if(!id){ id=newId(); S.debts.push({id,name:d.name,kind:'person',init:0,monthly:0,dueDay:0,payAcct:''}); }
    const isLoanPay=d.kind==='loan'&&d.op==='pay';
    const rec={id:newId(),type:'debt',op:d.op,debt:id,debtName:d.name,debtKind:d.kind,exp:isLoanPay,amount:p.amount,item:debtLabel(d.op,d.name),
      category:d.kind==='loan'?'還款':'借還',date:p.date,who:'',icon:'',acct,createdAt:new Date().toISOString()};
    const io=d.op==='borrow'||d.op==='collect';
    commitAdd(rec,()=>{S=JSON.parse(oS);},`已記好 ✦ ${fmtMD(rec.date)} ${rec.item} ${io?'+':'-'}${money(rec.amount)} · ${acctName(acct)}${isLoanPay?'（算支出）':'（不算收支）'}`);
    return;
  }
  if(!p.item){ showAsk('item',`${money(p.amount)} 是花在什麼地方呢？`); return; }
  const c=classify(p.item);
  if(!p.who&&!p.whoAsked&&((c.learned&&c.who)||WHO_KW.some(k=>p.item.includes(k))||(/^還/.test(p.item)&&!/^還[款貸]/.test(p.item)))){ showAskWho(c.who||''); return; }
  const who=p.whoAsked?p.who:(p.who||c.who);
  let acct=p.acct||(p.selTouched?p.sel:'')||p.acctPick||'';
  if(!acct){ if(c.type==='income'){ showAskAcct(); return; } acct='cash'; }
  const rec={id:newId(),type:c.type,amount:p.amount,item:p.item,category:c.category,date:p.date,who,icon:'',acct:okAcct(acct),createdAt:new Date().toISOString()};
  const oldRules=JSON.stringify(S.rules);
  if(p.whoAsked&&who){ const ex=S.rules.find(x=>x.word===p.item); if(ex){ex.who=who;} else S.rules.push({word:p.item,category:c.category,who}); }
  commitAdd(rec,()=>{S.rules=JSON.parse(oldRules);},`已記好 ✦ ${fmtMD(rec.date)} ${rec.category} ${rec.item} ${rec.type==='income'?'+':'-'}${money(rec.amount)} · ${acctName(rec.acct)}`);
}

const CAT_COLOR={餐飲:'#2a78d6',交通:'#eb6834',生活用品:'#1baf7a',房租:'#eda100',娛樂:'#e87ba4',醫療:'#008300',帳單:'#6250d6',還款:'#e34948'};
const C_IN='#1baf7a', C_OUT='#eb6834';
function catColor(c){return CAT_COLOR[c]||'#9a9590';}
function yearsWithData(){return [...new Set([today().slice(0,4),...live().map(r=>r.date.slice(0,4))])].sort().reverse();}
function catTotals(rs){ const t={}; rs.filter(isExp).forEach(r=>t[r.category]=(t[r.category]||0)+r.amount); return Object.entries(t).sort((a,b)=>b[1]-a[1]); }

/* 甜甜圈圖：最多 6 塊，其餘併成「其他」；旁邊一定列出金額和百分比 */
function donut(list){
  const sum=list.reduce((a,x)=>a+x[1],0); if(!sum) return '<div class="empty">這個月沒有支出</div>';
  let top=list.slice(0,6); const rest=list.slice(6).reduce((a,x)=>a+x[1],0); if(rest) top=top.concat([['其他（合併）',rest]]);
  const R=54, r=34, cx=70, cy=70; let a0=-Math.PI/2; const gap=top.length>1?0.025:0;
  const arcs=top.map(([c,v])=>{ const a1=a0+v/sum*Math.PI*2; const s0=a0+gap/2, s1=Math.max(s0+0.001,a1-gap/2), lg=(s1-s0)>Math.PI?1:0;
    const P=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)].map(n=>n.toFixed(2)).join(' ');
    const d=top.length===1?`M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} L ${cx-0.01} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z`
      :`M ${P(R,s0)} A ${R} ${R} 0 ${lg} 1 ${P(R,s1)} L ${P(r,s1)} A ${r} ${r} 0 ${lg} 0 ${P(r,s0)} Z`;
    a0=a1; return `<path d="${d}" fill="${catColor(c)}"><title>${esc(c)}：${money(v)}（${Math.round(v/sum*100)}%）</title></path>`; }).join('');
  return `<div class="row" style="align-items:center;gap:14px;flex-wrap:nowrap"><svg viewBox="0 0 140 140" style="width:42%;max-width:170px;flex:none" role="img" aria-label="消費分類比例">${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="10" fill="var(--muted)">支出</text><text x="70" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${bmS(sum)}</text></svg>
    <div style="flex:1;min-width:0">${top.map(([c,v])=>`<div class="bs" style="font-size:13px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${catColor(c)};margin-right:5px"></i>${esc(c)}</span><span>${money(v)}・${Math.round(v/sum*100)}%</span></div>`).join('')}</div></div>`;
}
/* 每日支出趨勢：單一系列折線，y 軸從 0 開始 */
function dayTrend(ym,daily){
  const [y,m]=ym.split('-').map(Number), last=new Date(y,m,0).getDate(), lim=ym===today().slice(0,7)?+today().slice(8,10):last;
  const vals=[...Array(last)].map((_,i)=>i<lim?(daily[i+1]?daily[i+1].o:0):null), mx=Math.max(1,...vals.filter(v=>v!==null));
  const W=320,H=120,L=4,pad=14, X=i=>L+i*(W-L-4)/(last-1), Y=v=>H-pad-(v/mx)*(H-pad*2);
  const pts=vals.map((v,i)=>v===null?null:[X(i),Y(v),v,i+1]).filter(Boolean);
  return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto" role="img" aria-label="每日支出趨勢">
    <line x1="${L}" y1="${H-pad}" x2="${W}" y2="${H-pad}" stroke="var(--line)"/><line x1="${L}" y1="${pad}" x2="${W}" y2="${pad}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${W}" y="${pad-4}" font-size="10" text-anchor="end" fill="var(--muted)">最高 ${money(mx)}</text>
    <polyline fill="none" stroke="${C_OUT}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>
    ${pts.filter(p=>p[2]>0).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${C_OUT}" stroke="#fff" stroke-width="2"><title>${m}/${p[3]}：${money(p[2])}</title></circle>`).join('')}
    ${[1,10,20,last].map(d=>`<text x="${X(d-1)}" y="${H+12}" font-size="10" text-anchor="${d===1?'start':d===last?'end':'middle'}" fill="var(--muted)">${d}日</text>`).join('')}</svg>`;
}
/* 每月收支長條圖：收入、支出並排，共用一個 y 軸 */
function monthBars(rows){
  const mx=Math.max(1,...rows.flatMap(r=>[r.i,r.o])), W=320,H=130,pad=10, bw=W/12, w=Math.min(bw*0.34,12);
  return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto" role="img" aria-label="每月收支">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/><text x="${W}" y="${pad}" font-size="10" text-anchor="end" fill="var(--muted)">最高 ${money(mx)}</text>
    ${rows.map((r,k)=>{const cx=k*bw+bw/2, hi=r.i/mx*(H-pad*2), ho=r.o/mx*(H-pad*2);
      return `${r.i?`<rect x="${cx-w-1}" y="${H-hi}" width="${w}" height="${hi}" rx="2" fill="${C_IN}"><title>${k+1}月收入 ${money(r.i)}</title></rect>`:''}
        ${r.o?`<rect x="${cx+1}" y="${H-ho}" width="${w}" height="${ho}" rx="2" fill="${C_OUT}"><title>${k+1}月支出 ${money(r.o)}</title></rect>`:''}
        <text x="${cx}" y="${H+13}" font-size="9" text-anchor="middle" fill="var(--muted)">${k+1}</text>`;}).join('')}</svg>`;
}
function catBars(list){ const mx=list.length?list[0][1]:1, sum=list.reduce((a,x)=>a+x[1],0);
  return list.length?list.map(([c,a])=>`<div class="bar" style="cursor:default"><div><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${catColor(c)};margin-right:4px"></i>${esc(c)}</div><div class="b"><i style="width:${Math.round(a/mx*100)}%;background:${catColor(c)}"></i></div><div class="v">${money(a)}<div class="small muted" style="font-weight:400">${Math.round(a/sum*100)}%</div></div></div>`).join(''):'<div class="empty">沒有支出</div>'; }

    <div class="dayh" style="margin-top:12px"><span>🧾 消費紀錄明細</span><span>${money(t.o)}</span></div>

function yearRows(y){ return [...Array(12)].map((_,k)=>monthTotals(`${y}-${p2(k+1)}`)); }
function renderYearReport(){
  const y=mg.year, rows=yearRows(y), prow=yearRows(String(+y-1)), sum=a=>a.reduce((s,r)=>({i:s.i+r.i,o:s.o+r.o,b:s.b+r.b}),{i:0,o:0,b:0});
  const T=sum(rows), P=sum(prow), rs=live().filter(r=>r.date.startsWith(y+'-'));
  const nMon=y===today().slice(0,4)?+today().slice(5,7):(y<today().slice(0,4)?12:0), avg=nMon?T.o/nMon:0;
  const maxM=rows.reduce((b,r,k)=>r.o>b.o?{o:r.o,k}:b,{o:0,k:-1});
  const ys=yearsWithData(); if(!ys.includes(y)) ys.unshift(y);
  const cmpRow=(n,a,b,goodUp)=>`<tr><td>${n}</td><td style="text-align:right">${bm(a)}</td><td style="text-align:right">${bm(b)}</td><td style="text-align:right;color:${a===b?'var(--muted)':((a>b)===goodUp?'var(--ok)':'var(--bad)')}">${a===b?'—':(a>b?'▲':'▼')+money(Math.abs(a-b))}</td></tr>`;

      <div><div class="small muted">每月平均支出</div><div style="font-weight:800">${money(Math.round(avg))}</div></div>
      <div><div class="small muted">最高支出月份</div><div style="font-weight:800">${maxM.k>=0?`${maxM.k+1}月・${bmS(maxM.o)}`:'—'}</div></div>
      <div><div class="small muted">全年儲蓄率</div><div style="font-weight:800">${rateTxt(T.i,T.o)}</div></div></div>
    <div class="dayh" style="margin-top:14px"><span>📊 每月收支</span></div>${legend([[C_IN,'收入'],[C_OUT,'支出']])}${monthBars(rows)}
    <div class="dayh" style="margin-top:10px"><span>💹 每月儲蓄率</span></div>
    <table><thead><tr><th>月</th><th style="text-align:right">收入</th><th style="text-align:right">支出</th><th style="text-align:right">結餘</th><th style="text-align:right">儲蓄率</th></tr></thead>
      <tbody>${rows.map((r,k)=>(r.i||r.o)?`<tr><td>${k+1}月</td><td style="text-align:right">${money(r.i)}</td><td style="text-align:right">${money(r.o)}</td><td style="text-align:right;color:${r.b<0?'var(--bad)':'var(--ink)'}">${bm(r.b)}</td><td style="text-align:right">${rateTxt(r.i,r.o)}</td></tr>`:'').join('')||'<tr><td colspan="5" class="muted">這一年沒有收支</td></tr>'}</tbody></table>
    <div class="dayh" style="margin-top:12px"><span>🏷️ 各消費分類（全年）</span></div>${catBars(catTotals(rs))}
    <div class="dayh" style="margin-top:12px"><span>🔁 與 ${+y-1} 年比較</span></div>

mg.q=''; mg.ft=''; mg.from=''; mg.to='';

function renderSearch(){

const FIND_TY={'':'全部類型',income:'收入',expense:'支出',transfer:'轉帳',debt:'負債',save:'儲蓄',adjust:'校正'};
function updSearch(){ const el=$('#fres'); if(el) el.innerHTML=searchResults(); }
function clearSearch(){ mg.q='';mg.ft='';mg.from='';mg.to=''; renderManage(); }
function searchResults(){
  const q=mg.q.trim().toLowerCase(), words=q.split(/\s+/).filter(Boolean);
  const any=words.length||mg.ft||mg.from||mg.to;
  const rs=any?sortRecs(live().filter(r=>(!mg.ft||r.type===mg.ft)&&(!mg.from||r.date>=mg.from)&&(!mg.to||r.date<=mg.to)&&words.every(w=>recText(r).includes(w)))):[];
  const tot=rs.reduce((a,r)=>{ if(r.type==='income')a.i+=r.amount; else if(isExp(r))a.o+=r.amount; return a; },{i:0,o:0});
  return `${any?`<div class="muted small" style="margin:8px 0">找到 <b>${rs.length}</b> 筆・其中收入 ${money(tot.i)}・支出 ${money(tot.o)}${(mg.q||mg.ft||mg.from||mg.to)?` <a href="#" onclick="clearSearch();return false">清除條件</a>`:''}</div>
      ${rs.slice(0,200).map(recRow).join('')||'<div class="empty">找不到符合的紀錄</div>'}${rs.length>200?'<div class="muted small">只顯示前 200 筆，請加條件縮小範圍。</div>':''}`

function renderManage(){

  if(v==='mrep') body=renderMonthReport();

    rs.forEach(r=>{ if(r.date!==last){ last=r.date; const dr=rs.filter(x=>x.date===r.date), dt=dr.reduce((a,x)=>a+(x.type==='income'?x.amount:isExp(x)?-x.amount:0),0); h+=`<div class="dayh"><span>${fmtFull(r.date)}</span><span>${dt<0?'-':'+'}${money(Math.abs(dt))}</span></div>`; } h+=recRow(r); });

      ${list.length?list.map(([a,n])=>`<div class="bar" onclick="mg.acct=mg.acct==='${a}'?'':'${a}';renderManage()"><div>${acctIcon(a)} ${esc(acctName(a))}</div><div class="b"><i style="width:${Math.round(n/mx*100)}%"></i></div><div class="v">${money(n)}</div></div>`).join(''):'<div class="empty">這個月沒有支出</div>'}
      ${mg.acct?`<div class="dayh"><span>${acctIcon(mg.acct)} ${esc(acctName(mg.acct))} 明細</span></div>${sortRecs(rs.filter(r=>okAcct(r.acct)===mg.acct)).map(recRow).join('')}`:''}`;
  } else {
    const rs=live().filter(r=>r.date.startsWith(mg.month)&&isExp(r)), tot={}; rs.forEach(r=>tot[r.category]=(tot[r.category]||0)+r.amount);
    const list=Object.entries(tot).sort((a,b)=>b[1]-a[1]), mx=list.length?list[0][1]:1, sum=list.reduce((a,x)=>a+x[1],0);
    body=`<div class="row" style="margin-bottom:8px">${msel}<span class="muted small">本月支出 ${money(sum)}（點分類看明細）</span></div>
      ${list.length?list.map(([c,a])=>`<div class="bar" onclick="mg.cat=mg.cat==='${c}'?'':'${c}';renderManage()"><div>${iconOf(c)} ${esc(c)}</div><div class="b"><i style="width:${Math.round(a/mx*100)}%"></i></div><div class="v">${money(a)}</div></div>`).join(''):'<div class="empty">這個月沒有支出</div>'}
      ${mg.cat?`<div class="dayh"><span>${iconOf(mg.cat)} ${esc(mg.cat)} 明細</span></div>${sortRecs(rs.filter(r=>r.category===mg.cat)).map(recRow).join('')}`:''}`;
  }
  $('#app').innerHTML=`<div class="card"><div class="row tabs" style="margin-bottom:12px">${vt('mrep','📊 月報表')}${vt('yrep','📈 年報表')}${vt('day','每日')}${vt('month','每月')}${vt('cat','依分類看支出')}${vt('acct','依帳戶看支出')}${vt('find','🔍 搜尋')}</div>${body}</div>`;
  if(v==='find'){ const q=$('#fq'); if(q&&!q.value) q.focus(); }
}

function setEdit(f,v){
  cur[f]=v; dirty=true;
  if(f==='type'){ cur.category=v==='income'?'其他收入':'其他'; renderEdit(); return; }
  const dm=$('#dm'); if(dm) dm.innerHTML='<span class="dirty">● 有尚未儲存的修改</span>';
}
function leaveEdit(){ if(dirty&&!confirm('有尚未儲存的修改，確定要離開嗎？')) return; dirty=false; cur=null; go2(back); }
function go2(k){ page=k; ({home:renderHome,bills:renderBills,payslip:renderPayslip,ot:renderOT,opts:renderOpts,accounts:renderAccounts,debts:renderDebts,savings:renderSavings,manage:renderManage,settings:renderSettings}[k])(); window.scrollTo(0,0); }
function saveEdit(){
  const r=cur, amt=Number(r.amount);
  if(r.type==='save'){
    if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}
    const j=R.findIndex(x=>x.id===r.id), o=R[j];
    R[j]=Object.assign({},o,{amount:amt,date:r.date,acct:r.acct&&acctById(r.acct)?r.acct:''});
    if(!persist()){R[j]=o;return;} dirty=false; cur=null; go2(back); flash('已儲存 ✦'); return;
  }
  if(r.type==='debt'){
    if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}
    const j=R.findIndex(x=>x.id===r.id), o=R[j], d=debtById(r.debt), nm=d?d.name:(r.debtName||'');
    R[j]=Object.assign({},o,{op:r.op,amount:amt,date:r.date,acct:okAcct(r.acct),item:debtLabel(r.op,nm),exp:r.debtKind==='loan'&&r.op==='pay'});
    if(!persist()){R[j]=o;return;} dirty=false; cur=null; go2(back); flash('已儲存 ✦'); return;
  }
  if(r.type==='transfer'||r.type==='adjust'){
    if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}
    if(r.type==='transfer'&&okAcct(r.from)===okAcct(r.to)){alert('轉出和轉入不能是同一個帳戶');return;}
    const j=R.findIndex(x=>x.id===r.id), o=R[j];
    const c2=r.type==='transfer'
      ? {id:r.id,type:'transfer',amount:amt,item:String(r.item||'').trim(),category:'轉帳',date:r.date,who:'',icon:r.icon||'',from:okAcct(r.from),to:okAcct(r.to),createdAt:o.createdAt}
      : {id:r.id,type:'adjust',amount:amt,item:'餘額校正',category:'校正',date:r.date,who:'',icon:r.icon||'',acct:okAcct(r.acct),sign:Number(r.sign)<0?-1:1,createdAt:o.createdAt};
    R[j]=c2; if(!persist()){R[j]=o;return;}
    dirty=false; cur=null; go2(back); flash('已儲存 ✦'); return;
  }
  if(!r.item.trim()){alert('請先填寫：項目');return;} if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}
  const i=R.findIndex(x=>x.id===r.id), old=R[i];
  const copy={id:r.id,type:r.type,amount:amt,item:r.item.trim(),category:r.category,date:r.date,who:r.who||'',icon:r.icon||'',acct:okAcct(r.acct),createdAt:old.createdAt};
  const oldS=JSON.stringify(S);
  if((copy.category!==r._orig.category || copy.who!==r._orig.who)){
    const w=copy.item, ex=S.rules.find(x=>x.word===w); if(ex){ex.category=copy.category;ex.who=copy.who;} else S.rules.push({word:w,category:copy.category,who:copy.who});
  }
  R[i]=copy; if(!persist()){R[i]=old;S=JSON.parse(oldS);return;}
  dirty=false; cur=null; go2(back); flash('已儲存 ✦');
}
function delRecord(){
  if(!confirm('確定要刪除嗎？')) return;
  const r=R.find(x=>x.id===cur.id); if(!r) return; r.deleted=true; r.deletedAt=today();
  if(!persist()){r.deleted=false;delete r.deletedAt;return;}
  dirty=false; cur=null; go2(back); flash('已移到「最近刪除」');

function checkAcctName(name,selfId){
  if(!name){alert('請填寫帳戶名稱');return false;}
  if(/\d{6,}/.test(name.replace(/[\s-]/g,''))){alert('名稱看起來像帳號或卡號。為了安全，請只寫暱稱，例如「台新」或「中信信用卡」。');return false;}
  if(/領|轉|加值|\+值/.test(name)){alert('名稱裡不能有「領、轉、加值、+值」，這些字小帳會當成轉帳。');return false;}
  if(/^\d+$/.test(name)){alert('名稱不能只有數字');return false;}
  if(S.accounts.some(a=>a.id!==selfId&&a.name.toLowerCase()===name.toLowerCase())){alert('已經有同名的帳戶了');return false;}
  return true;
}

function acctDelta(r,id){ let d=0;
  if(r.type==='income'&&okAcct(r.acct)===id) d+=r.amount;
  if(r.type==='expense'&&okAcct(r.acct)===id) d-=r.amount;
  if(r.type==='transfer'){ if(okAcct(r.from)===id) d-=r.amount; if(okAcct(r.to)===id) d+=r.amount; }
  if(r.type==='adjust'&&okAcct(r.acct)===id) d+=(r.sign<0?-1:1)*r.amount;
  if(r.type==='debt'&&okAcct(r.acct)===id) d+=(r.op==='borrow'||r.op==='collect'?1:-1)*r.amount;
  return d; }
function acctHistory(id){
  const a=acctById(id); if(!a) return; let run=Number(a.init)||0;
  const rs=live().slice().sort((x,y)=>x.date.localeCompare(y.date)||(x.createdAt||'').localeCompare(y.createdAt||'')).map(r=>({r,d:acctDelta(r,id)})).filter(x=>x.d!==0).map(x=>{run=Math.round((run+x.d)*100)/100;return Object.assign(x,{bal:run});}).reverse();
  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)m.remove();};

  document.body.appendChild(m); m.querySelector('#ahX').onclick=()=>m.remove();
  m.querySelectorAll('.rec').forEach(el=>el.addEventListener('click',()=>{m.remove();openEdit(el.dataset.id);}));
}
function calibAcct(id){

  R.push({id:newId(),type:'adjust',amount:Math.abs(d),item:'餘額校正',category:'校正',date:today(),who:'',icon:'',acct:id,sign:d>0?1:-1,createdAt:new Date().toISOString()});

function delAcct(id){
  if(id==='cash') return; const a=acctById(id); if(!a) return;
  const refs=live().filter(r=>r.type!=='save'&&(r.acct===id||r.from===id||r.to===id));
  const finish=(apply,msg)=>{ const oR=JSON.stringify(R), oS=JSON.stringify(S); apply(); live().forEach(r=>{ if(r.type==='save'&&r.acct===id) r.acct=''; }); S.accounts=S.accounts.filter(x=>x.id!==id);
    if(!persist()){R=JSON.parse(oR);S=JSON.parse(oS);return false;} renderAccounts(); flash(msg); return true; };
  if(!refs.length){ if(confirm(`確定要刪除帳戶「${a.name}」嗎？`)) finish(()=>{},'已刪除帳戶'); return; }
  const others=S.accounts.filter(x=>x.id!==id);
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h2 style="margin:0 0 8px;font-size:17px">刪除帳戶「${esc(a.name)}」</h2>
    <div style="margin-bottom:10px">「${esc(a.name)}」還有 <b>${refs.length}</b> 筆紀錄，要怎麼處理？</div>
    <label class="row" style="gap:6px;margin-bottom:6px"><input type="radio" name="dm" value="move" checked style="width:auto"> 🔀 搬到其他帳戶：</label>
    <select id="daTo" style="margin-bottom:10px">${others.map(x=>`<option value="${x.id}">${x.icon||'💳'} ${esc(x.name)}</option>`).join('')}</select>
    <label class="row" style="gap:6px;margin-bottom:12px"><input type="radio" name="dm" value="del" style="width:auto"> 🗑️ 連紀錄全部刪除（先放進「最近刪除」，30 天內可救回）</label>
    <div class="row"><button class="danger" id="daOk">確定</button><button id="daNo">取消</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#daNo').onclick=()=>m.remove();
  m.querySelector('#daOk').onclick=()=>{
    const mode=m.querySelector('input[name=dm]:checked').value;
    if(mode==='move'){
      const to=m.querySelector('#daTo').value, tn=acctName(to);
      if(!confirm(`確定把 ${refs.length} 筆紀錄搬到「${tn}」，然後刪除「${a.name}」嗎？`)) return;
      let gone=0;
      if(finish(()=>{ refs.forEach(r=>{ if(r.acct===id) r.acct=to; if(r.from===id) r.from=to; if(r.to===id) r.to=to;
          if(r.type==='transfer'&&r.from===r.to){ r.deleted=true; r.deletedAt=today(); gone++; } }); },
        `已搬到「${tn}」並刪除帳戶`+(gone?`（${gone} 筆變成「自己轉給自己」的轉帳已移到最近刪除）`:''))) m.remove();
    } else {
      if(!confirm(`確定刪除「${a.name}」和它的 ${refs.length} 筆紀錄嗎？\n紀錄會先放進「最近刪除」，30 天內可以救回。`)) return;
      if(finish(()=>{ refs.forEach(r=>{ r.deleted=true; r.deletedAt=today(); }); },`已刪除帳戶，${refs.length} 筆紀錄移到「最近刪除」`)) m.remove();
    }
  };
}

const LOAN_SUB={loan:'🏦 貸款',inst:'📱 分期付款',other:'🗂️ 其他債務'};
function subOpts(sel){return Object.entries(LOAN_SUB).map(([k,n])=>`<option value="${k}" ${k===sel?'selected':''}>${n}</option>`).join('');}
function readLoanForm(pre){
  const g=s=>$(pre+s), name=g('Name').value.trim(), init=parseInit(g('Init').value), mon=parseInit(g('Mon').value), dv=g('Due').value.trim(), acct=g('Acct').value;
  if(!name){alert('請填寫名稱');return null;} if(/\d/.test(name)){alert('名稱裡不要有數字（會跟金額搞混），例如「車貸」「手機分期」');return null;}
  if(/領|轉|加值|\+值|借|還/.test(name)){alert('名稱裡不能有「領、轉、加值、借、還」這些字，小帳會判斷錯');return null;}
  if(Number.isNaN(init)||!(init>0)){alert('「目前還欠多少」要是大於 0 的數字');return null;}
  if(Number.isNaN(mon)||mon<0){alert('「每月還多少」要是數字或空白');return null;}
  if(dv&&!dayOk(dv)){alert('繳款日要是 1 到 31 的數字，或空白');return null;}
  return {name,init,monthly:mon,dueDay:dayOk(dv),payAcct:acct,sub:g('Sub').value};
}
function loanNameTaken(name,selfId){ return S.debts.some(d=>d.id!==selfId&&d.name.toLowerCase()===name.toLowerCase()); }
function addLoan(){
  const f=readLoanForm('#nl'); if(!f) return; if(loanNameTaken(f.name,null)){alert('已經有同名的負債了');return;}
  const o=JSON.stringify(S); S.debts.push(Object.assign({id:newId(),kind:'loan',created:today()},f)); if(!persist()){S=JSON.parse(o);return;} renderDebts(); flash(`已新增「${f.name}」✦`);
}

    <div class="muted small" style="margin:8px 0">「還欠多少」會用「建立時還欠多少」減掉之後每一筆還款自動算出來。</div>
    <div class="row"><button class="primary" id="elOk">儲存</button><button id="elNo">取消</button></div></div>`;

function debtDetail(id){
  const d=debtById(id); if(!d) return; const rs=sortRecs(live().filter(r=>r.type==='debt'&&r.debt===id));
  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)m.remove();};

function delDebt(id){
  const d=debtById(id); if(!d) return; const refs=live().filter(r=>r.type==='debt'&&r.debt===id);
  if(!confirm(refs.length?`確定刪除「${d.name}」嗎？\n它的 ${refs.length} 筆紀錄會一起放進「最近刪除」，30 天內可以救回。`:`確定刪除「${d.name}」嗎？`)) return;
  const oR=JSON.stringify(R), oS=JSON.stringify(S); refs.forEach(r=>{r.deleted=true;r.deletedAt=today();r.debtDef={name:d.name,kind:d.kind,init:d.init,monthly:d.monthly,dueDay:d.dueDay,payAcct:d.payAcct};}); S.debts=S.debts.filter(x=>x.id!==id);
  if(!persist()){R=JSON.parse(oR);S=JSON.parse(oS);return;} renderDebts(); flash(refs.length?`已刪除，${refs.length} 筆紀錄移到「最近刪除」`:'已刪除');
}

/* ---------- 儲蓄頁 ---------- */
function monthsUntil(ymd){ const t=today(); if(ymd<=t) return 0; const [y1,m1,d1]=t.split('-').map(Number),[y2,m2,d2]=ymd.split('-').map(Number);
  let m=(y2-y1)*12+(m2-m1); if(d2<d1) m--; return Math.max(m,1); }
function goalRow(g,b){
  const saved=goalSaved(g,b), tg=Number(g.target)||0, pct=tg>0?Math.min(Math.round(saved/tg*100),100):0, left=Math.max(tg-saved,0);
  const lost=g.mode==='acct'&&!acctById(g.acct);
  let plan='';
  if(!g.done&&left>0&&g.deadline){ const mo=monthsUntil(g.deadline); plan=mo>0?`・${fmtFull(g.deadline)} 前每月要存約 ${money(Math.ceil(left/mo))}`:'・已超過預定日期'; }
  return `<div class="acc"><div class="ic">${pct>=100?'🎉':'🎯'}</div><div class="mid"><div style="font-weight:700">${esc(g.name)}</div>
    <div class="small muted">${g.mode==='acct'?(lost?'⚠️ 綁定的帳戶已刪除，請按「修改」重新選':`綁定帳戶：${esc(acctName(g.acct))}`):'自己標記'}${g.done?`・${fmtFull(g.doneAt||today())} 完成`:(left>0?`・還差 ${money(left)}`:'・🎉 已達成！')}${plan}</div></div>
    <div class="bal">${money(saved)} <span class="small muted">/ ${money(tg)}</span></div>
    <div style="width:100%"><div class="bar" style="grid-template-columns:1fr 52px;cursor:default;margin:2px 0"><div class="b"><i style="width:${pct}%;background:${pct>=100?'var(--ok)':'var(--brand)'}"></i></div><div class="v small">${pct}%</div></div></div>
    <div class="ops">${g.mode==='manual'?`<button onclick="goalDetail('${g.id}')">明細</button>`:''}${g.done?`<button onclick="goalDone('${g.id}',false)">移回進行中</button>`:`<button onclick="editGoal('${g.id}')">修改</button><button onclick="goalDone('${g.id}',true)">完成</button>`}<button class="danger" onclick="delGoal('${g.id}')">刪除</button></div></div>`;
}
function goalFormHTML(pre,g){ g=g||{};
  return `<div class="grid"><div><label class="f">名稱</label><input type="text" id="${pre}Name" maxlength="20" value="${esc(g.name||'')}" placeholder="例如：旅遊基金"></div>
    <div><label class="f">目標金額</label><input type="number" id="${pre}Tg" inputmode="decimal" value="${g.target||''}" placeholder="例如：50000"></div>
    <div><label class="f">進度怎麼算</label><select id="${pre}Mode" onchange="$('#${pre}AcctW').style.display=this.value==='acct'?'':'none'">
      <option value="manual" ${g.mode!=='acct'?'selected':''}>自己標記（打「${esc(g.name||'旅遊基金')}存5000」）</option><option value="acct" ${g.mode==='acct'?'selected':''}>綁定帳戶（進度 = 帳戶餘額）</option></select></div>
    <div id="${pre}AcctW" style="${g.mode==='acct'?'':'display:none'}"><label class="f">綁定哪個帳戶</label><select id="${pre}Acct">${acctOpts(g.acct&&acctById(g.acct)?g.acct:'')}</select></div>
    <div><label class="f">希望哪天存到（選填）</label><input type="date" id="${pre}Dl" value="${esc(g.deadline||'')}"></div></div>`;
}
function readGoalForm(pre,selfId){
  const name=$('#'+pre+'Name').value.trim(), tg=parseInit($('#'+pre+'Tg').value), mode=$('#'+pre+'Mode').value, acct=$('#'+pre+'Acct').value, dl=$('#'+pre+'Dl').value;
  if(!name){alert('請填寫名稱');return null;} if(/\d/.test(name)){alert('名稱裡不要有數字（會跟金額搞混）');return null;}
  if(/領|轉|加值|\+值|借|還/.test(name)){alert('名稱裡不能有「領、轉、加值、借、還」這些字，小帳會判斷錯');return null;}
  if(S.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase())){alert('名稱不能跟帳戶一樣');return null;}
  if(S.goals.some(g=>g.id!==selfId&&g.name.toLowerCase()===name.toLowerCase())){alert('已經有同名的目標了');return null;}
  if(Number.isNaN(tg)||!(tg>0)){alert('目標金額要是大於 0 的數字');return null;}
  if(mode==='acct'&&!acctById(acct)){alert('請選擇要綁定的帳戶');return null;}
  return {name,target:tg,mode,acct:mode==='acct'?acct:'',deadline:dl||''};
}
function renderSavings(){
  page='savings'; nav(); const b=balances(), act=S.goals.filter(g=>!g.done), dn=S.goals.filter(g=>g.done);
  const total=act.reduce((s,g)=>s+goalSaved(g,b),0);
  $('#app').innerHTML=`<div class="card total"><div class="muted small" style="font-weight:700">進行中的目標，總共已存</div><div class="n">${money(total)}</div></div>
   <div class="card"><h2>🎯 儲蓄目標</h2>${act.length?act.map(g=>goalRow(g,b)).join(''):'<div class="muted small">還沒有目標。在下面新增一個吧 ✦</div>'}
    <details style="margin-top:10px"><summary>➕ 新增目標</summary><div style="margin-top:8px">${goalFormHTML('ng')}</div><button class="primary" style="margin-top:10px" onclick="addGoal()">新增</button></details>
    <div class="muted small" style="margin-top:8px">「自己標記」：在首頁打「旅遊基金存5000」或「旅遊基金存到台新5000」，進度會增加，但<b>帳戶餘額不變、不算支出</b>。花錢照平常記帳就好，不會扣目標。<br>「綁定帳戶」：用轉帳存錢，例如「台新轉儲蓄專戶5000」。</div></div>
   ${dn.length?`<div class="card"><details><summary>✅ 已完成（${dn.length}）</summary>${dn.map(g=>goalRow(g,b)).join('')}</details></div>`:''}`;
}

function goalDone(id,v){ const g=goalById(id); if(!g) return;

function delGoal(id){

  if(!confirm(refs.length?`確定刪除目標「${g.name}」嗎？\n它的 ${refs.length} 筆存錢紀錄會一起放進「最近刪除」，30 天內可以救回。`:`確定刪除目標「${g.name}」嗎？`)) return;

  if(!persist()){R=JSON.parse(oR);S=JSON.parse(oS);return;} renderSavings(); flash(refs.length?`已刪除，${refs.length} 筆紀錄移到「最近刪除」`:'已刪除');
}

/* ---------- 每月固定收支 ---------- */
const RC_KIND={income:'💰 收入',expense:'💸 支出',debt:'🏦 還負債'};
function recById(id){return S.recurring.find(x=>x.id===id);}
function ymAdd(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return `${y}-${p2(m)}`;}
function dueDate(ym,day){const [y,m]=ym.split('-').map(Number);return `${ym}-${p2(Math.min(day,new Date(y,m,0).getDate()))}`;}
/* 到期（日期 ≤ 今天）但還沒按「記好」或「略過」的項目，含之前沒處理的月份 */
function recurDue(){
  const out=[], t=today(), cur=t.slice(0,7);
  S.recurring.forEach(x=>{ if(x.kind!=='income') return; let ym=x.start, guard=0; while(ym<=cur&&guard++<240){ if(x.end&&ym>x.end) break; const d=dueDate(ym,x.day);
    if(d<=t&&!S.recurDone[x.id+'|'+ym]) out.push({x,ym,date:d}); ym=ymAdd(ym,1); } });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function recurCard(){
  const due=recurDue(); if(!due.length) return '';
  return `<div class="card" style="border-color:#8a6bd1;background:#f6f2ff"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">💰 收入到期（${due.length} 筆）</h2><span class="spacer"></span><button class="primary" onclick="recurDoAll()">全部記好</button></div>
    ${due.map((d,i)=>{const x=d.x;return `<div class="acc" style="flex-wrap:nowrap"><div class="mid"><div style="font-weight:700">${esc(x.name)} <span class="tag">${RC_KIND[x.kind].slice(2).trim()}</span></div>
      <div class="small muted">${fmtFull(d.date)}・${esc(acctName(x.acct))}${x.kind==='debt'&&debtById(x.debt)?'・'+esc(debtById(x.debt).name):''}</div></div>
      <input type="number" inputmode="decimal" id="rc${i}" value="${x.amount}" style="width:96px;padding:6px 8px" aria-label="金額">
      <div style="display:flex;flex-direction:column;gap:4px"><button class="primary" style="padding:4px 10px" onclick="recurDo(${i})">記好</button><button style="padding:4px 10px" onclick="recurSkip(${i})">略過</button></div></div>`;}).join('')}
    <div class="muted small" style="margin-top:6px">金額不一樣可以先改再按「記好」。 <a href="#" onclick="go('settings');return false">管理固定收支</a></div></div>`;
}
function recurRecord(x,ym,date,amt){
  const base={id:newId(),amount:amt,date,who:'',icon:'',acct:okAcct(x.acct),recur:x.id,recurMonth:ym,createdAt:new Date().toISOString()};
  if(x.kind==='debt'){ const d=debtById(x.debt); if(d){ const loan=d.kind==='loan';
      return Object.assign(base,{type:'debt',op:'pay',debt:d.id,debtName:d.name,debtKind:d.kind,exp:loan,item:debtLabel('pay',d.name),category:loan?'還款':'借還'}); } }
  const c=classify(x.name), inc=x.kind==='income';
  return Object.assign(base,{type:inc?'income':'expense',item:x.name,category:inc?(INC.includes(c.category)?c.category:'其他收入'):(EXP.includes(c.category)?c.category:'其他')});
}
function recurApply(list){ /* list: [{d, amt}] */
  const oR=R.length, oD=JSON.stringify(S.recurDone);
  for(const {d,amt} of list){ if(!(amt>0)){alert(`「${d.x.name}」的金額要大於 0`);R.length=oR;S.recurDone=JSON.parse(oD);return false;}
    R.push(recurRecord(d.x,d.ym,d.date,amt)); S.recurDone[d.x.id+'|'+d.ym]='done'; }
  if(!persist()){R.length=oR;S.recurDone=JSON.parse(oD);return false;} return true;
}
function recurDo(i){ const due=recurDue(), d=due[i]; if(!d) return; const amt=Math.round(Number($('#rc'+i).value)*100)/100;
  if(recurApply([{d,amt}])){ renderHome(); flash(`已記好 ✦ ${d.x.name} ${money(amt)}`); } }
function recurDoAll(){ const due=recurDue(); const list=due.map((d,i)=>({d,amt:Math.round(Number(($('#rc'+i)||{}).value)*100)/100}));
  if(!confirm(`要把這 ${list.length} 筆固定收支全部記好嗎？`)) return;
  if(recurApply(list)){ renderHome(); flash(`已記好 ${list.length} 筆 ✦`); } }
function recurSkip(i){ const d=recurDue()[i]; if(!d) return; if(!confirm(`這個月（${d.ym}）的「${d.x.name}」要略過、不記帳嗎？`)) return;
  const o=JSON.stringify(S.recurDone); S.recurDone[d.x.id+'|'+d.ym]='skip'; if(!persist()){S.recurDone=JSON.parse(o);return;} renderHome(); flash('已略過'); }
function recurListHTML(){
  if(!S.recurring.length) return '<div class="muted small">還沒有固定收支。可以在下面新增，或用「匯入 Excel」一次匯入。</div>';

    <div class="small muted">每月 ${x.day} 號・${esc(acctName(x.acct))}${x.kind==='debt'&&debtById(x.debt)?'・'+esc(debtById(x.debt).name):''}・${x.start.replace('-','/')} 起${x.end?'～'+x.end.replace('-','/'):''}</div></div>
    <div class="bal" style="color:${x.kind==='income'?'var(--ok)':'var(--bad)'}">${x.kind==='income'?'+':'-'}${money(x.amount)}</div>
    <div class="ops"><button onclick="editRecur('${x.id}')">修改</button><button class="danger" onclick="delRecur('${x.id}')">刪除</button></div></div>`).join('');
}

    <div id="${pre}DebtW" style="${x.kind==='debt'?'':'display:none'}"><label class="f">連到哪筆負債</label><select id="${pre}Debt">${debtOpts||'<option value="">（請先到「負債」新增）</option>'}</select></div>

    <div><label class="f">到哪個月結束（選填）</label><input type="month" id="${pre}End" value="${x.end||''}"></div></div>`;

/* ---------- 圖片：存在 IndexedDB（瀏覽器的大容量空間，一樣只在這台電腦、這個瀏覽器） ---------- */
const PH_DB='casevoraLedgerPhotos', BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; let phDBP=null; const PH_CACHE={};
const PH_FAIL='圖片存不進去。可能是無痕視窗、瀏覽器封鎖了網站資料，或電腦空間不足。';
function phDB(){ if(phDBP) return phDBP; phDBP=new Promise((ok,no)=>{ try{ const rq=indexedDB.open(PH_DB,1); rq.onupgradeneeded=()=>rq.result.createObjectStore('p'); rq.onsuccess=()=>ok(rq.result); rq.onerror=()=>no(rq.error); }catch(e){ no(e); } }); phDBP.catch(()=>{ phDBP=null; }); return phDBP; }
function phTx(mode,fn){ return phDB().then(db=>new Promise((ok,no)=>{ const tx=db.transaction('p',mode), rq=fn(tx.objectStore('p')); tx.oncomplete=()=>ok(rq?rq.result:undefined); tx.onerror=tx.onabort=()=>no(tx.error||new Error('tx')); })); }
async function phPut(url,id){ id=id||('ph'+newId()); await phTx('readwrite',st=>st.put(url,id)); PH_CACHE[id]=url; return id; }
async function phGet(id){ if(PH_CACHE[id]) return PH_CACHE[id]; const v=await phTx('readonly',st=>st.get(id)); if(v) PH_CACHE[id]=v; return v; }
async function phDel(ids){ for(const id of ids){ delete PH_CACHE[id]; try{ await phTx('readwrite',st=>st.delete(id)); }catch(e){} } }
function allPhIds(){ const ids=new Set(); Object.values(S.att).forEach(l=>l.forEach(i=>ids.add(i))); Object.values(S.payslips).forEach(p=>p.ph.forEach(i=>ids.add(i))); return [...ids]; }
function fillPhotos(){ document.querySelectorAll('img[data-ph]:not([data-ok])').forEach(im=>{ im.dataset.ok='1'; const id=im.dataset.ph; phGet(id).then(u=>{ if(u) im.src=u; else im.alt='圖片不見了'; }).catch(()=>{ im.alt='讀不到圖片'; }); }); }
new MutationObserver(()=>fillPhotos()).observe(document.body,{childList:true,subtree:true});
function phImg(id,cls,click,style){ return `<img class="${cls||''}" src="${BLANK}" data-ph="${esc(id)}" alt="圖片" ${style?`style="${style}"`:''} onclick="event.stopPropagation();${click}">`; }
function imgToData(file){ return new Promise((ok,no)=>{ const fr=new FileReader(); fr.onerror=()=>no(fr.error); fr.onload=()=>{ const im=new Image(); im.onerror=()=>no(new Error('img'));
  im.onload=()=>{ const M=2000, k=Math.min(1,M/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',.85)); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }
async function saveImages(files){ const ids=[]; for(const f of files){ ids.push(await phPut(await imgToData(f))); } try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){} return ids; }
let PASTE=null;
function clipImages(e){ const out=[], it=e.clipboardData&&e.clipboardData.items; if(it) for(const x of it){ if(x.kind==='file'&&/^image\//.test(x.type)){ const f=x.getAsFile(); if(f) out.push(f); } } return out; }

  Object.entries(S.recurMove).forEach(([k,to])=>{ if(to!==M) return; const [id,orig]=k.split('|'); if(orig===M) return; const x=recById(id); if(!x||x.kind==='income') return;

      <ul class="small muted" style="padding-left:18px;margin:8px 0 0"><li>每 4 個月一期：1～4 月在 5/20 發、5～8 月在 9/20、9～12 月在隔年 1/20。</li>
        <li>請假時數：事假、病假、颱風假算全部，生理假算一半（扣半薪）。8 小時＝1 天。</li>
        <li>證書加給：每月 ÷ 30 ÷ 8 × 當月請假時數。節金：× 這期請假時數 ÷ 960（4 個月 × 30 天 × 8 小時）。</li>
        <li>這是照你說明的公司算法估算，實際以薪資條為準。</li></ul></details></div>`; }
function bonusSave(){ const c=Number($('#bnCert').value)||0, f=Number($('#bnFest').value)||0, from=$('#bnFrom').value; if(c<0||f<0){ alert('金額不能是負的'); return; }
  const o=JSON.stringify(S.ot); S.ot.bonus={cert:Math.round(c),fest:Math.round(f),from:/^\d{4}-\d{2}$/.test(from)?from:''}; if(!persist()){ S.ot=JSON.parse(o); return; } renderOT(); flash('已儲存 ✦'); }

function parseDateAny(v){

  const s=String(v??'').trim(); const m=s.match(/^(\d{2,4})\s*[.\/\-年]\s*(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})\s*日?$/); return m?ymd(+m[1],+m[2],+m[3]):'';

function parseYM(v){

  if(typeof v==='number'){ const r=Math.round(v*100)%100; if(r%10===0&&r/10===1) return 'AMBIG'; v=Math.floor(v)+'.'+(r%10===0?r/10:r); }

/* ---------- 匯出、備份、還原 ---------- */
function exportCSV(){
  const rs=sortRecs(live()).reverse(); if(!rs.length){alert('目前沒有紀錄可匯出。');return;}
  const head=['日期','類型','分類','項目','對象','帳戶','轉出帳戶','轉入帳戶','金額'];
  const TL={income:'收入',expense:'支出',transfer:'轉帳',adjust:'校正',debt:'負債',save:'儲蓄（不算收支）'};
  const rows=rs.map(r=>[r.date,r.type==='debt'?(r.exp?'負債（還款・算支出）':'負債（借還）'):(TL[r.type]||''),r.category,(r.type==='debt'||r.type==='save')?recMeta(r).name:r.item,r.who||'',r.type!=='transfer'?acctName(r.acct):'',r.type==='transfer'?acctName(r.from):'',r.type==='transfer'?acctName(r.to):'',r.type==='adjust'&&r.sign<0?-r.amount:r.amount]);
  const csv=[head,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('﻿'+csv,`xiaozhang_${today()}.csv`,'text/csv;charset=utf-8');
}
async function backup(){ const photos={}; let miss=0; for(const id of allPhIds()){ try{ const u=await phGet(id); if(u) photos[id]=u; else miss++; }catch(e){ miss++; } }
  S.lastBackup=today(); persist(); if(page==='home') renderHome();
  download(JSON.stringify({app:'casevoraXiaozhang',version:2,exportedAt:new Date().toISOString(),records:live(),settings:S,photos},null,1),`xiaozhang_backup_${today()}.json`,'application/json');
  if(miss) alert(`有 ${miss} 張圖片讀不到，沒有放進備份。`); }
function restore(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return; const fr=new FileReader();
  fr.onload=async()=>{ let d; try{ d=JSON.parse(fr.result); if(!d||d.app!=='casevoraXiaozhang'||!Array.isArray(d.records)) throw 0; }catch(e){ alert('無法讀取：這不是本工具的備份檔。'); return; }
    const bad=d.records.some(r=>!r||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')||!(Number(r.amount)>0)||!['income','expense','transfer','adjust','debt','save'].includes(r.type)||(r.type==='save'&&!/^[\w-]{1,40}$/.test(String(r.goal)))||(r.type==='debt'&&(!DEBT_OP[r.op]||!/^[\w-]{1,40}$/.test(String(r.debt))))); if(bad){ alert('無法還原：備份檔內有格式不正確的紀錄。'); return; }
    const photos={}; if(d.photos&&typeof d.photos==='object') Object.entries(d.photos).forEach(([id,u])=>{ if(/^[\w-]{1,60}$/.test(id)&&typeof u==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(u)) photos[id]=u; });
    if(!confirm(`備份檔內有 ${d.records.length} 筆紀錄${Object.keys(photos).length?`、${Object.keys(photos).length} 張圖片`:''}。\n還原會「取代」目前瀏覽器中的 ${live().length} 筆紀錄和設定，目前「最近刪除」裡的 ${trashList().length} 筆也會一併被取代，確定嗎？`)) return;
    const oR=R,oS=S; R=d.records.map(r=>({id:/^[\w-]{1,40}$/.test(String(r.id))?String(r.id):newId(),type:r.type,amount:Number(r.amount),item:String(r.item||''),category:r.category||(r.type==='income'?'其他收入':r.type==='transfer'?'轉帳':r.type==='adjust'?'校正':'其他'),date:r.date,who:r.who||'',icon:r.icon||'',createdAt:r.createdAt||'',
      ...(r.type==='transfer'?{from:String(r.from||'cash'),to:String(r.to||'cash')}:{acct:String(r.acct||'cash')}),...(r.type==='adjust'?{sign:Number(r.sign)<0?-1:1}:{}),
      ...(r.type==='debt'?{op:r.op,debt:String(r.debt),debtName:String(r.debtName||'').slice(0,20),debtKind:r.debtKind==='loan'?'loan':'person',exp:r.debtKind==='loan'&&r.op==='pay'}:{}),
      ...(r.type==='save'?{acct:String(r.acct||''),goal:String(r.goal),goalName:String(r.goalName||'').slice(0,20)}:{})}));
    S=fixS(Object.assign(defaultS(),d.settings||{}));
    R.forEach(r=>{ if(r.type==='save'&&!S.goals.some(x=>x.id===r.goal)) S.goals.push({id:r.goal,name:r.goalName||'未命名目標',target:0,mode:'manual',acct:'',deadline:'',done:false,doneAt:''}); });
    R.forEach(r=>{ if(r.type==='debt'&&!S.debts.some(x=>x.id===r.debt)) S.debts.push({id:r.debt,name:r.debtName||'未命名',kind:r.debtKind,init:0,monthly:0,dueDay:0,payAcct:''}); }); if(!persist()){R=oR;S=oS;return;} let pbad=0; for(const [id,u] of Object.entries(photos)){ try{ await phPut(u,id); }catch(e){ pbad++; } } if(pbad) alert(`有 ${pbad} 張圖片還原失敗（可能是無痕視窗或空間不足）。`); applyBg(); flash('還原完成 ✦'); go2('home'); };
  fr.readAsText(f);
}
