<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casevora 小帳</title>
<style>
:root{
  --bg:#fff8f0; --card:#ffffff; --ink:#4a3b3b; --muted:#8b7878; --line:#f2ddd2;
  --brand:#ff8a7a; --brand-d:#e9695a; --brand-soft:#ffe3dc; --accent:#ffb88c;
  --ok:#3f9d71; --ok-soft:#e5f5ec; --bad:#d9534f; --bad-soft:#fdecea; --info:#8a6bd1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.6;background-attachment:fixed;background-size:cover;background-position:center}
body.bgpage{background-image:linear-gradient(rgba(255,248,240,.82),rgba(255,248,240,.82)),var(--bgimg)}
body.bgboth{background-image:linear-gradient(rgba(255,248,240,.5),rgba(255,248,240,.5)),var(--bgimg)}
header{position:relative;overflow:hidden;min-height:150px;background:linear-gradient(135deg,#ffb4a2,#ffd6a5);border-radius:0 0 28px 28px;box-shadow:0 4px 14px rgba(233,105,90,.18)}
header.custom{background-size:cover;background-position:center}
header svg{position:absolute;inset:0;width:100%;height:100%}
header.custom svg{display:none}
header .t{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:26px 20px 22px}
header .t .tt{display:inline-block;border-radius:18px;padding:2px 2px}
header.custom .t .tt{background:rgba(255,255,255,.75);padding:8px 14px}
header h1{margin:0;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(233,105,90,.5);letter-spacing:1px}
header.custom h1{color:var(--brand-d);text-shadow:none}
header .sub{font-size:13px;color:#fff;opacity:.95;text-shadow:0 1px 0 rgba(233,105,90,.45)}
header .sub .lead{font-size:16px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 0 rgba(200,80,65,.75),0 0 6px rgba(200,80,65,.45)}
header .sub .note{display:inline-block;margin-top:6px;background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;font-weight:700;border-radius:999px;padding:2px 12px;box-shadow:0 1px 4px rgba(233,105,90,.2)}
header.custom .sub{color:var(--ink);text-shadow:none}
main{max-width:760px;margin:0 auto;padding:14px 16px 90px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
nav button{flex:1;border-radius:999px;padding:9px 6px;font-weight:700}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(233,105,90,.07)}
.card h2{margin:0 0 10px;font-size:17px}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px}
button:hover{background:#fff3ee}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.primary:hover{background:var(--brand-d)}
button.danger{color:var(--bad);border-color:#efb9b5}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.muted{color:var(--muted)} .small{font-size:13px}
.quick{display:flex;gap:8px}
.quick input{font-size:18px;padding:13px 16px;border-radius:16px}
.quick button{padding:0 22px;font-size:17px;border-radius:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:18px;padding:12px 8px;text-align:center;background:var(--brand-soft)}
.stat .n{font-size:clamp(14px,4.6vw,22px);font-weight:800;line-height:1.2;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:13px;font-weight:700;color:var(--muted)}
.stat.in .n{color:var(--ok)} .stat.out .n{color:var(--bad)}
.stat.in{background:var(--ok-soft)} .stat.out{background:var(--bad-soft)}
.rec{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.rec:last-child{border-bottom:0}
.rec .ic{font-size:26px;width:38px;text-align:center;flex:none}
.rec .mid{flex:1;min-width:0}
.rec .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .sb{font-size:12px;color:var(--muted)}
.rec .am{font-weight:800;white-space:nowrap}
.rec .am.in{color:var(--ok)} .rec .am.out{color:var(--bad)} .rec .am.mv{color:var(--info)}
.paysel{display:flex;gap:8px;align-items:center;margin-top:8px}
.paysel select{width:auto;max-width:60%;padding:6px 10px}
.acc{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.acc:last-child{border-bottom:0}
.acc .ic{font-size:26px;width:38px;text-align:center;flex:none}
.acc .mid{flex:1;min-width:120px}
.acc .bal{font-weight:800;font-size:18px;white-space:nowrap}
.acc .ops{display:flex;gap:6px;width:100%;justify-content:flex-end}
.acc .ops button{padding:4px 10px;font-size:13px}
.total{text-align:center;padding:6px 0}
.total .n{font-size:clamp(22px,7vw,30px);font-weight:800}
.cmp{display:block;font-size:11px;font-weight:700;margin-top:2px}
.bs{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.bs.sum{font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand-d);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700;margin-left:4px}
.ask{border:2px dashed var(--brand);background:#fff7f4}
.empty{text-align:center;padding:26px;color:var(--muted)}
.bar{display:grid;grid-template-columns:90px 1fr 76px;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.bar .b{background:var(--brand-soft);border-radius:999px;height:14px}
.bar .b i{display:block;height:14px;background:var(--brand);border-radius:999px;min-width:3px}
.bar .v{text-align:right;font-weight:700}
.dayh{display:flex;justify-content:space-between;font-weight:800;margin:10px 0 2px;color:var(--brand-d)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 16px}
.savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dirty{color:#b45309;font-weight:700;font-size:14px}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:50vh;overflow:auto}
.icgrid button{font-size:24px;padding:4px}
.modal{position:fixed;inset:0;background:rgba(74,59,59,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:22px;padding:18px;max-width:440px;width:100%}
.tabs button{border-radius:999px;padding:4px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{color:var(--muted)}
.notice{border-radius:14px;padding:10px 14px;font-size:14px;margin:8px 0;background:#fff3e0;color:#7a3d06}
details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header id="hd">
  <svg viewBox="0 0 800 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="#fff" opacity=".55"><circle cx="90" cy="150" r="30"/><circle cx="125" cy="140" r="38"/><circle cx="165" cy="152" r="28"/>
      <circle cx="470" cy="40" r="22"/><circle cx="498" cy="32" r="28"/><circle cx="530" cy="42" r="20"/></g>
    <g fill="#fff" opacity=".9" font-size="20"><text x="330" y="40">✦</text><text x="410" y="150">✧</text><text x="260" y="128">✦</text><text x="620" y="40">✧</text></g>
    <g><circle cx="560" cy="130" r="20" fill="#ffe08a" stroke="#f3b94a" stroke-width="3"/><text x="552" y="137" font-size="20" font-weight="800" fill="#f3b94a">$</text></g>
    <g><circle cx="610" cy="150" r="14" fill="#ffe08a" stroke="#f3b94a" stroke-width="3"/><text x="605" y="155" font-size="14" font-weight="800" fill="#f3b94a">$</text></g>
    <g transform="translate(690 92)">
      <ellipse cx="0" cy="62" rx="44" ry="8" fill="#e9695a" opacity=".18"/>
      <path d="M-46 8 Q-46 -52 0 -52 Q46 -52 46 8 Q46 58 0 58 Q-46 58 -46 8Z" fill="#fff6dc" stroke="#f3b94a" stroke-width="3"/>
      <circle cx="-16" cy="2" r="5" fill="#4a3b3b"/><circle cx="16" cy="2" r="5" fill="#4a3b3b"/>
      <circle cx="-17" cy="0" r="1.6" fill="#fff"/><circle cx="15" cy="0" r="1.6" fill="#fff"/>
      <ellipse cx="-28" cy="16" rx="8" ry="5" fill="#ff9d94" opacity=".7"/><ellipse cx="28" cy="16" rx="8" ry="5" fill="#ff9d94" opacity=".7"/>
      <path d="M-8 14 Q0 24 8 14" fill="none" stroke="#4a3b3b" stroke-width="3" stroke-linecap="round"/>
      <path d="M-6 -52 Q-4 -66 6 -64" fill="none" stroke="#6bbf8a" stroke-width="4" stroke-linecap="round"/><ellipse cx="12" cy="-66" rx="10" ry="6" fill="#8fd6a8"/>
    </g>
  </svg>
  <div class="t"><div class="tt"><h1>Casevora 小帳</h1><div class="sub"><span class="lead">像聊天一樣記帳</span><br><span class="note">🔒 本機儲存 · 僅在此裝置此瀏覽器有效 · 可匯出備份</span></div></div></div>
</header>
<main><nav id="nav"></nav><div id="app"></div></main>
<script>
const KEY_R='casevoraXiaozhang_v1', KEY_S='casevoraXiaozhang_v1_settings';
const EXP=['餐飲','交通','生活用品','房租','娛樂','醫療','帳單','其他'];
const INC=['薪資','兼職','其他收入'];
const DEF_ICON={餐飲:'🍙',交通:'🚌',生活用品:'🧻',房租:'🏠',娛樂:'🎮',醫療:'💊',帳單:'🧾',其他:'🧸',薪資:'💰',兼職:'🐥',其他收入:'🎁'};
const DEF_ACCTS=[{id:'cash',name:'現金',icon:'💵',init:0},{id:'linepay',name:'LINE Pay',icon:'💚',init:0},{id:'applepay',name:'Apple Pay',icon:'🍎',init:0},{id:'jko',name:'街口支付',icon:'🧡',init:0},{id:'easycard',name:'悠遊卡',icon:'🎫',init:0}];
const ACCT_TYPES={cash:'💵 現金',bank:'🏦 銀行帳戶',epay:'📱 電子支付',card:'💳 信用卡',other:'🗂️ 其他帳戶'};
function defType(id){return id==='cash'?'cash':['linepay','applepay','jko','easycard'].includes(id)?'epay':'other';}
function typeOpts(sel){return Object.entries(ACCT_TYPES).map(([k,n])=>`<option value="${k}" ${k===sel?'selected':''}>${n}</option>`).join('');}
const ACCT_ALIAS={cash:['現金'],linepay:['line\\s*pay'],applepay:['apple\\s*pay','蘋果\\s*pay'],jko:['街口支付','街口'],easycard:['悠遊卡']};
const ICONS='🍙 🍜 🍱 🍰 🍩 🍦 🧋 ☕ 🍎 🍓 🥐 🍕 🍔 🍟 🍣 🥗 🍪 🍫 🍉 🍇 🚌 🚇 🚗 🚲 🛵 ⛽ 🚕 ✈️ 🚆 🛴 🧻 🧴 🧼 🛒 🛍️ 🧺 🪥 🧽 🏠 💡 💧 🔥 🎮 🎬 🎤 🎧 🎁 🎈 🎀 🌸 🧸 📚 🎨 ⚽ 💊 🏥 🩹 🦷 🩺 🧾 💳 📱 🌐 🔌 🔑 💰 💵 🪙 🐷 🌟 ✨ 🍀 🐱 🐶 🐰 🐻 🐼 🦊 🐥 🐣 🐸 🦄 🌈 ☁️ 🌙 ⭐ 💖 🎀'.split(' ');
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const p2=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function addDays(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());}
function validYMD(y,m,d){const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;}
function fmtMD(s){const [,m,d]=s.split('-');return `${+m}/${+d}`;}
function fmtFull(s){const [y,m,d]=s.split('-');return `${y}/${+m}/${+d}`;}
function money(n){return '$'+(Math.round(Number(n)*100)/100).toLocaleString('en-US');}
function bm(n){return n<0?'-'+money(-n):money(n);}
/* 小格子用：太長就改成「萬」，完整金額放在 title */
function bmS(n){ const a=Math.abs(n); if(a<100000) return bm(n); const w=Math.round(a/1000)/10; return (n<0?'-$':'$')+(w>=1000?Math.round(w).toLocaleString('en-US'):w)+'萬'; }
function flash(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#e9695a;color:#fff;padding:9px 20px;border-radius:999px;z-index:99;box-shadow:0 3px 10px rgba(0,0,0,.2);font-weight:700;max-width:92vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ---------- 資料 ---------- */
let R=loadR(), S=loadS();
function defaultS(){return {rules:[],people:[],catIcons:{},bg:{url:'',mode:'both'},recentN:10,accounts:JSON.parse(JSON.stringify(DEF_ACCTS)),acctInitDone:false,debts:[],goals:[]};}
function fixS(s){ if(!Array.isArray(s.accounts)) s.accounts=JSON.parse(JSON.stringify(DEF_ACCTS));
  s.accounts=s.accounts.filter(a=>a&&/^[\w-]{1,40}$/.test(String(a.id))&&String(a.name||'').trim()).map(a=>({id:String(a.id),name:String(a.name).trim().slice(0,20),icon:typeof a.icon==='string'?a.icon.slice(0,8):'💳',init:Number.isFinite(Number(a.init))?Number(a.init):0,dueDay:dayOk(a.dueDay),atype:ACCT_TYPES[a.atype]?a.atype:defType(a.id)})); if(!s.accounts.some(a=>a&&a.id==='cash')) s.accounts.unshift({id:'cash',name:'現金',icon:'💵',init:0,dueDay:0});
  if(!Array.isArray(s.debts)) s.debts=[];
  s.debts=s.debts.filter(d=>d&&/^[\w-]{1,40}$/.test(String(d.id))&&String(d.name||'').trim()&&['loan','person'].includes(d.kind)).map(d=>({id:String(d.id),name:String(d.name).trim().slice(0,20),kind:d.kind,
    init:Number.isFinite(Number(d.init))?Number(d.init):0,monthly:Number(d.monthly)>0?Number(d.monthly):0,dueDay:dayOk(d.dueDay),payAcct:/^[\w-]{1,40}$/.test(String(d.payAcct||''))?String(d.payAcct):'',created:/^\d{4}-\d{2}-\d{2}$/.test(String(d.created||''))?d.created:'',sub:['loan','inst','other'].includes(d.sub)?d.sub:'loan'}));
  if(!Array.isArray(s.goals)) s.goals=[];
  s.goals=s.goals.filter(g=>g&&/^[\w-]{1,40}$/.test(String(g.id))&&String(g.name||'').trim()).map(g=>({id:String(g.id),name:String(g.name).trim().slice(0,20),target:Number(g.target)>0?Number(g.target):0,
    mode:g.mode==='acct'?'acct':'manual',acct:/^[\w-]{1,40}$/.test(String(g.acct||''))?String(g.acct):'',deadline:/^\d{4}-\d{2}-\d{2}$/.test(String(g.deadline||''))?g.deadline:'',done:g.done===true,doneAt:/^\d{4}-\d{2}-\d{2}$/.test(String(g.doneAt||''))?g.doneAt:''}));
  return s; }
function dayOk(v){const n=Math.floor(Number(v));return n>=1&&n<=31?n:0;}
function loadR(){try{const a=JSON.parse(localStorage.getItem(KEY_R));return Array.isArray(a)?a:[];}catch(e){return [];}}
function loadS(){try{return fixS(Object.assign(defaultS(),JSON.parse(localStorage.getItem(KEY_S))||{}));}catch(e){return defaultS();}}
function persist(){try{localStorage.setItem(KEY_R,JSON.stringify(R));localStorage.setItem(KEY_S,JSON.stringify(S));
  const used=(localStorage.getItem(KEY_R)||'').length+(localStorage.getItem(KEY_S)||'').length;
  if(used>4000000&&!window.__w){window.__w=true;alert('提醒：本機儲存空間已用約 80% 以上。請盡快「下載備份」，並考慮換成較小的背景圖。');}
  return true;}catch(e){alert('儲存失敗！瀏覽器的儲存空間可能已滿。請先「下載備份」，再刪除部分紀錄或背景圖。');return false;}}
const live=()=>R.filter(r=>!r.deleted);
function iconOf(cat){return S.catIcons[cat]||DEF_ICON[cat]||'🧸';}
function recIcon(r){return r.icon||iconOf(r.category);}
function sortRecs(a){return a.slice().sort((x,y)=>y.date.localeCompare(x.date)||(y.createdAt||'').localeCompare(x.createdAt||''));}
function newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- 帳戶 ---------- */
function acctById(id){return S.accounts.find(a=>a.id===id);}
function okAcct(id){return acctById(id)?id:'cash';}
function acctName(id){const a=acctById(okAcct(id));return a?a.name:'現金';}
function acctIcon(id){const a=acctById(okAcct(id));return (a&&a.icon)||'💳';}
function acctOpts(sel){return S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.icon||'💳'} ${esc(a.name)}</option>`).join('');}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function findAccts(t){
  const hits=[];
  S.accounts.forEach(a=>{ [...(ACCT_ALIAS[a.id]||[]), reEsc(a.name).replace(/\s+/g,'\\s*')].forEach(p=>{
    const re=new RegExp(p,'ig'); let m; while((m=re.exec(t))){ if(!m[0].length){re.lastIndex++;continue;} hits.push({id:a.id,idx:m.index,len:m[0].length}); } }); });
  hits.sort((a,b)=>b.len-a.len||a.idx-b.idx); const taken=[], out=[];
  for(const h of hits){ if(taken.some(([s,e])=>h.idx<e&&h.idx+h.len>s)) continue; taken.push([h.idx,h.idx+h.len]); out.push(h); }
  return out.sort((a,b)=>a.idx-b.idx);
}
function cutSpans(t,hs){ hs.slice().sort((a,b)=>b.idx-a.idx).forEach(h=>{t=t.slice(0,h.idx)+' '+t.slice(h.idx+h.len);}); return t; }
function balances(upto){
  const b={}; S.accounts.forEach(a=>b[a.id]=Number(a.init)||0);
  live().forEach(r=>{ const g=okAcct; if(upto&&r.date>upto) return;
    if(r.type==='income') b[g(r.acct)]+=r.amount;
    else if(r.type==='expense') b[g(r.acct)]-=r.amount;
    else if(r.type==='transfer'){ b[g(r.from)]-=r.amount; b[g(r.to)]+=r.amount; }
    else if(r.type==='adjust') b[g(r.acct)]+=(r.sign<0?-1:1)*r.amount;
    else if(r.type==='debt') b[g(r.acct)]+=(r.op==='borrow'||r.op==='collect'?1:-1)*r.amount; });
  Object.keys(b).forEach(k=>b[k]=Math.round(b[k]*100)/100); return b;
}
function isExp(r){return r.type==='expense'||(r.type==='debt'&&r.exp===true);}

/* ---------- 儲蓄目標 ---------- */
function goalById(id){return S.goals.find(g=>g.id===id);}
function goalSaved(g,b){ if(g.mode==='acct') return acctById(g.acct)?Math.max((b||balances())[g.acct],0):0;
  return Math.round(live().filter(r=>r.type==='save'&&r.goal===g.id).reduce((a,r)=>a+r.amount,0)*100)/100; }
/* 「旅遊基金存5000」：文字裡有『自己標記』目標的名稱＋「存」 */
function findGoal(tt){ if(!/存/.test(tt)) return null; const lt=tt.toLowerCase();
  return S.goals.filter(g=>g.mode==='manual').sort((a,b)=>(a.done-b.done)).sort((a,b)=>b.name.length-a.name.length).find(g=>lt.includes(g.name.toLowerCase()))||null; }

/* ---------- 負債 ---------- */
const DEBT_OP={pay:-1,borrow:1,lend:-1,collect:1};
function debtById(id){return S.debts.find(d=>d.id===id);}
/* 貸款：正數 = 還欠多少。朋友：正數 = 我欠對方，負數 = 對方欠我 */
function debtBal(upto){
  const d={}; S.debts.forEach(x=>d[x.id]=(upto&&x.created&&x.created>upto)?0:(Number(x.init)||0));
  live().forEach(r=>{ if(upto&&r.date>upto) return; if(r.type==='debt'&&r.debt in d) d[r.debt]+=DEBT_OP[r.op]*r.amount; });
  Object.keys(d).forEach(k=>d[k]=Math.round(d[k]*100)/100); return d;
}
/* 資產負債：帳戶正數＋別人欠我 = 資產；帳戶負數（信用卡）＋貸款＋我欠別人 = 負債 */
function netWorth(upto){
  const b=balances(upto), d=debtBal(upto), r2=n=>Math.round(n*100)/100; let A=0,L=0; const assets=[], liabs=[];
  S.accounts.forEach(a=>{ const v=b[a.id]; if(v>0){A+=v;assets.push([`${a.icon||'💳'} ${a.name}`,v]);} else if(v<0){L+=-v;liabs.push([`${a.icon||'💳'} ${a.name}`,-v]);} });
  S.debts.forEach(x=>{ const v=d[x.id]; if(x.kind==='loan'){ if(v>0){L+=v;liabs.push([`🏦 ${x.name}`,v]);} }
    else if(v>0){L+=v;liabs.push([`📤 欠${x.name}`,v]);} else if(v<0){A+=-v;assets.push([`📥 ${x.name}欠我`,-v]);} });
  return {assets:r2(A),liab:r2(L),net:r2(A-L),assetList:assets,liabList:liabs};
}
function monthEnd(ym){const [y,m]=ym.split('-').map(Number);return `${ym}-${p2(new Date(y,m,0).getDate())}`;}
function prevYM(ym){const [y,m]=ym.split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${p2(m-1)}`;}
function cmpLine(cur,prev,goodUp,lab){ lab=lab||'上月'; const d=Math.round((cur-prev)*100)/100; if(!prev&&!cur) return `<span class="cmp">${lab}也是 $0</span>`;
  if(d===0) return `<span class="cmp">跟${lab}一樣</span>`;
  const up=d>0, pct=prev?Math.round(Math.abs(d)/Math.abs(prev)*100):null, good=up===goodUp;
  return `<span class="cmp" style="color:${good?'var(--ok)':'var(--bad)'}">比${lab} ${up?'▲':'▼'}${money(Math.abs(d))}${pct!==null?`（${pct}%）`:''}</span>`; }
function nwChart(n){
  const end=today().slice(0,7), firstRec=live().reduce((m,r)=>r.date<m?r.date:m,today()).slice(0,7); let ym=end; const months=[ym];
  while(months.length<n&&ym>firstRec){ ym=prevYM(ym); months.unshift(ym); }
  const vals=months.map(m=>netWorth(m===end?today():monthEnd(m)).net), hi=Math.max(0,...vals), lo=Math.min(0,...vals), span=Math.max(1,hi-lo);
  const W=320, H=140, bw=W/months.length, base=8+(hi/span)*(H-16), sc=(H-16)/span;
  return `<svg viewBox="0 0 ${W} ${H+34}" style="width:100%;height:auto" role="img" aria-label="每月淨資產變化">
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>
    ${vals.map((v,i)=>{const h=Math.max(2,Math.abs(v)*sc), x=i*bw+bw*0.2, w=Math.min(bw*0.6,46), y=v>=0?base-h:base;
      return `<rect x="${x+(bw*0.6-w)/2}" y="${y}" width="${w}" height="${h}" rx="3" fill="${v>=0?'var(--ok)':'var(--bad)'}"><title>${months[i]}：${bm(v)}</title></rect>
      <text x="${i*bw+bw/2}" y="${H+14}" font-size="10" text-anchor="middle" fill="var(--muted)">${+months[i].slice(5)}月</text>`;}).join('')}
    <text x="${W}" y="${H+30}" font-size="10" text-anchor="end" fill="var(--muted)">最新：${bm(vals[vals.length-1])}</text></svg>`;
}
function nextDue(day){ if(!day) return null; const t=today(), [y,m]=t.split('-').map(Number);
  const mk=(yy,mm)=>{const last=new Date(yy,mm,0).getDate();return `${yy}-${p2(mm)}-${p2(Math.min(day,last))}`;};
  let s=mk(y,m); if(s<t){ s=m===12?mk(y+1,1):mk(y,m+1); } return {date:s,days:daysBetween(t,s)}; }
function debtLabel(op,name){return {pay:`還${name}`,borrow:`跟${name}借錢`,lend:`借給${name}`,collect:`${name}還錢`}[op]||name;}
/* 從文字判斷是不是借還錢（在找「對象」之前判斷，才分得出「還小明」跟「小明還」） */
function findDebt(tt){
  const lt=tt.toLowerCase();
  const loan=S.debts.filter(d=>d.kind==='loan').sort((a,b)=>b.name.length-a.name.length).find(d=>lt.includes(d.name.toLowerCase()));
  if(loan) return {id:loan.id,op:'pay',kind:'loan',name:loan.name};
  const pats=[[/^(?:跟|向)(.{1,10}?)借錢?$/,'borrow'],[/^還錢?(.{1,10}?)錢?$/,'pay'],[/^借錢?(?:給)?(.{1,10}?)錢?$/,'lend'],[/^(.{1,10}?)還錢?$/,'collect'],[/^(.{1,10}?)借錢?$/,'lend']];
  for(const [re,op] of pats){ const m=tt.match(re); if(!m) continue; const nm=m[1].trim();
    if(!nm||/\d/.test(nm)||/借|還|跟|向/.test(nm)||/^(錢|款|貸款?|卡費?|書|車|錢包|給)$/.test(nm)) return null;
    const ex=S.debts.find(d=>d.kind==='person'&&d.name===nm); return {id:ex?ex.id:'',op,kind:'person',name:nm}; }
  return null;
}

/* ---------- 自動判斷（關鍵字規則，不是 AI，不會上網） ---------- */
const INC_KW=[['薪資',['薪水','薪資','月薪','工資','發薪']],['兼職',['兼職','打工','外快','家教']],['其他收入',['收入','獎金','紅包','利息','退款','收到','中獎']]];
const EXP_KW=[['房租',['房租','租金']],['帳單',['水費','電費','瓦斯','網路費','電話費','手機費','帳單','貸款','保險','稅','卡費','管理費','水電','月費']],
 ['醫療',['看醫生','診所','醫院','藥','掛號','牙醫','健檢','醫療','看診']],['交通',['加油','油錢','捷運','公車','火車','高鐵','計程車','uber','停車','過路費','機票','車票','悠遊卡','交通','客運']],
 ['娛樂',['電影','遊戲','ktv','唱歌','旅遊','旅行','演唱會','訂閱','netflix','spotify','玩']],['生活用品',['衛生紙','洗','日用','超市','全聯','家樂福','生活用品','牙膏','買菜','雜貨','用品','文具']],
 ['餐飲',['吃','飯','餐','飲料','咖啡','茶','便當','麵','麥當勞','火鍋','零食','點心','水果','飲','食','宵夜','奶茶','早餐','午餐','晚餐']]];
function classify(item){
  const t=item.toLowerCase();
  const rules=S.rules.slice().sort((a,b)=>b.word.length-a.word.length);
  for(const r of rules){ if(t.includes(r.word.toLowerCase())) return {type:INC.includes(r.category)?'income':'expense',category:r.category,who:r.who||'',learned:true}; }
  for(const [c,ks] of INC_KW) if(ks.some(k=>t.includes(k))) return {type:'income',category:c,who:'',learned:false};
  for(const [c,ks] of EXP_KW) if(ks.some(k=>t.includes(k))) return {type:'expense',category:c,who:'',learned:false};
  return {type:'expense',category:'其他',who:'',learned:false};
}
function parseInput(raw){
  let t=String(raw||'').trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/，/g,',').replace(/／/g,'/').replace(/＄/g,'$');
  if(!t) return {empty:true};
  /* 帳戶與轉帳：先把帳戶名稱找出來、從文字中拿掉，避免影響金額與項目判斷 */
  const hitsAll=findAccts(t), tk=t.match(/領|轉|加值|\+值/);
  let transfer=null, acct='';
  const bare=!hitsAll.filter(h=>h.id!=='cash').length && /(領|加值|\+值)\s*\d/.test(t);
  if(tk && (hitsAll.length||bare) && !/薪|獎金|紅包|利息|退款|收入/.test(t) && !/轉帳?給/.test(t)){
    const k=tk.index, kw=tk[0], bef=hitsAll.filter(h=>h.idx<k), aft=hitsAll.filter(h=>h.idx>k), nc=hitsAll.filter(h=>h.id!=='cash');
    let from='', to='';
    if(kw==='領'){ if(nc.length){ from=(bef.find(h=>h.id!=='cash')||nc[0]).id; const o=aft.find(h=>h.id!==from); to=o?o.id:'cash'; } else if(bare){ from=''; to='cash'; } }
    else if(kw==='轉'){ if(nc.length||(bef.length&&aft.length)){ from=bef.length?bef[bef.length-1].id:''; to=aft.length?aft[0].id:''; } }
    else { if(bef.length&&aft.length){from=bef[bef.length-1].id;to=aft[0].id;} else if(bef.length){to=bef[bef.length-1].id;from='cash';} else if(aft.length){to=aft[0].id;from='cash';} else {from='cash';to='';} }
    if(from||to){ transfer={from,to}; t=cutSpans(t,hitsAll).replace(/領|轉|加值|\+值/,' '); }
  }
  if(!transfer){ const hs=hitsAll.filter(h=>h.id!=='easycard'); if(hs.length){ acct=hs[0].id; t=cutSpans(t,hs); } }
  let date=today(), dateBad=false;
  if(/前天/.test(t)){date=addDays(today(),-2);t=t.replace('前天',' ');}
  else if(/昨天/.test(t)){date=addDays(today(),-1);t=t.replace('昨天',' ');}
  else if(/今天/.test(t)){t=t.replace('今天',' ');}
  else {
    let m=t.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
    if(m){const y=+m[1],mo=+m[2],d=+m[3]; if(validYMD(y,mo,d)){date=`${y}-${p2(mo)}-${p2(d)}`;} else dateBad=true; t=t.replace(m[0],' ');}
    else{ m=t.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日號]?/)||t.match(/(?<![\d.])(\d{1,2})[\/.](\d{1,2})(?![\d.\/])/);
      if(m){const y=+today().slice(0,4),mo=+m[1],d=+m[2]; if(validYMD(y,mo,d)){date=`${y}-${p2(mo)}-${p2(d)}`;} else dateBad=true; t=t.replace(m[0],' ');} }
  }
  if(dateBad) return {badDate:true};
  t=t.replace(/(\d),(?=\d{3})/g,'$1').replace(/[$元塊圓]/g,' ');
  let amount=null; const nums=[...t.matchAll(/\d+(?:\.\d+)?/g)];
  if(nums.length){const last=nums[nums.length-1]; amount=Number(last[0]); t=t.slice(0,last.index)+' '+t.slice(last.index+last[0].length);}
  const goal=transfer?null:findGoal(t.replace(/\s+/g,''));
  const debt=(transfer||goal)?null:findDebt(t.replace(/\s+/g,'').replace(/^買/,''));
  let who=''; for(const p of S.people.slice().sort((a,b)=>b.length-a.length)){ if(p&&t.includes(p)){who=p;t=t.replace(p,' ');break;} }
  let item=t.replace(/\s+/g,' ').trim().replace(/^買/,'').trim();
  if(!who){ const m=item.match(/^([還借])\s*(\S+)$/); if(m){ const c=S.people.filter(x=>x.startsWith(m[2])); if(c.length===1){ who=c[0]; item=m[1]; } } }
  if(who&&(item==='還'||item==='借')) item=item+'錢';
  if(transfer) return {date,amount,item:item.replace(/^(現金|錢)$/,''),who:'',acct:'',transfer};
  return {date,amount,item,who,acct,transfer:null,debt,goal};
}
const WHO_KW=['還錢','借','欠','轉帳','請客','代墊','分攤'];
let pending=null;
function quickAdd(){
  const inp=$('#qin'); const p=parseInput(inp.value);
  if(p.empty){flash('先打一點內容喔，例如：吃飯100');return;}
  if(p.badDate){alert('日期看起來不對（這天不存在），請再確認一下。');return;}
  const ps=$('#paySel'); p.sel=ps?ps.value:'cash'; p.selTouched=!!(ps&&ps.dataset.t==='1');
  pending=p; continueAdd();
}
function commitAdd(rec,onFail,msg){
  R.push(rec); if(!persist()){R.pop();if(onFail)onFail();return;}
  pending=null; if($('#qin')) $('#qin').value=''; hideAsk(); renderHome(); flash(msg);
}
function continueAdd(){
  const p=pending;
  if(!(p.amount>0)){ showAsk('amount',`「${esc(p.transfer?'這筆轉帳':(p.item||'這筆'))}」是多少錢呢？`); return; }
  if(p.transfer){
    const t=p.transfer;
    if(!t.from||!t.to){ showAskTransfer(); return; }
    if(t.from===t.to){ alert('轉出和轉入是同一個帳戶，請再選一次。'); t.to=''; showAskTransfer(); return; }
    const rec={id:newId(),type:'transfer',amount:p.amount,item:p.item||'',category:'轉帳',date:p.date,who:'',icon:'',from:t.from,to:t.to,createdAt:new Date().toISOString()};
    commitAdd(rec,null,`已記好 ✦ ${fmtMD(rec.date)} 轉帳 ${acctName(t.from)} → ${acctName(t.to)} ${money(rec.amount)}`); return;
  }
  if(p.goal){
    const g=goalById(p.goal.id); if(!g){ pending.goal=null; continueAdd(); return; }
    if(g.done){ if(!confirm(`「${g.name}」已經標記完成了。\n要把它移回「進行中」並記這筆嗎？`)){ cancelAsk(); return; } g.done=false; g.doneAt=''; }
    const acct=p.acct||(p.selTouched?p.sel:'')||'';
    const rec={id:newId(),type:'save',goal:g.id,goalName:g.name,amount:p.amount,item:`${g.name}存錢`,category:'儲蓄',date:p.date,who:'',icon:'',acct:acct&&acctById(acct)?acct:'',createdAt:new Date().toISOString()};
    commitAdd(rec,null,`已記好 ✦ ${g.name} +${money(rec.amount)}${rec.acct?`（放在${acctName(rec.acct)}）`:''}・帳戶餘額不變、不算支出`);
    return;
  }
  if(p.debt){
    const d=p.debt;
    if(!d.id&&!p.debtOk){ showAskDebt(); return; }
    let acct=p.acct||(p.selTouched?p.sel:'');
    if(!acct&&d.kind==='loan'){ const L=debtById(d.id); if(L&&L.payAcct&&acctById(L.payAcct)) acct=L.payAcct; }
    acct=okAcct(acct||'cash');
    const oS=JSON.stringify(S); let id=d.id;
    if(!id){ id=newId(); S.debts.push({id,name:d.name,kind:'person',init:0,monthly:0,dueDay:0,payAcct:''}); }
    const isLoanPay=d.kind==='loan'&&d.op==='pay';
    const rec={id:newId(),type:'debt',op:d.op,debt:id,debtName:d.name,debtKind:d.kind,exp:isLoanPay,amount:p.amount,item:debtLabel(d.op,d.name),
      category:d.kind==='loan'?'還款':'借還',date:p.date,who:'',icon:'',acct,createdAt:new Date().toISOString()};
    const io=d.op==='borrow'||d.op==='collect';
    commitAdd(rec,()=>{S=JSON.parse(oS);},`已記好 ✦ ${fmtMD(rec.date)} ${rec.item} ${io?'+':'-'}${money(rec.amount)} · ${acctName(acct)}${isLoanPay?'（算支出）':'（不算收支）'}`);
    return;
  }
  if(!p.item){ showAsk('item',`${money(p.amount)} 是花在什麼地方呢？`); return; }
  const c=classify(p.item);
  if(!p.who&&!p.whoAsked&&((c.learned&&c.who)||WHO_KW.some(k=>p.item.includes(k))||(/^還/.test(p.item)&&!/^還[款貸]/.test(p.item)))){ showAskWho(c.who||''); return; }
  const who=p.whoAsked?p.who:(p.who||c.who);
  let acct=p.acct||(p.selTouched?p.sel:'')||p.acctPick||'';
  if(!acct){ if(c.type==='income'){ showAskAcct(); return; } acct='cash'; }
  const rec={id:newId(),type:c.type,amount:p.amount,item:p.item,category:c.category,date:p.date,who,icon:'',acct:okAcct(acct),createdAt:new Date().toISOString()};
  const oldRules=JSON.stringify(S.rules);
  if(p.whoAsked&&who){ const ex=S.rules.find(x=>x.word===p.item); if(ex){ex.who=who;} else S.rules.push({word:p.item,category:c.category,who}); }
  commitAdd(rec,()=>{S.rules=JSON.parse(oldRules);},`已記好 ✦ ${fmtMD(rec.date)} ${rec.category} ${rec.item} ${rec.type==='income'?'+':'-'}${money(rec.amount)} · ${acctName(rec.acct)}`);
}

/* ---------- 帳務管理 ---------- */
function monthsWithData(){return [...new Set([today().slice(0,7),...live().map(r=>r.date.slice(0,7))])].sort().reverse();}
/* ---------- 統計報表（全部依實際紀錄即時計算） ---------- */
const CAT_COLOR={餐飲:'#2a78d6',交通:'#eb6834',生活用品:'#1baf7a',房租:'#eda100',娛樂:'#e87ba4',醫療:'#008300',帳單:'#6250d6',還款:'#e34948'};
const C_IN='#1baf7a', C_OUT='#eb6834';
function catColor(c){return CAT_COLOR[c]||'#9a9590';}
function yearsWithData(){return [...new Set([today().slice(0,4),...live().map(r=>r.date.slice(0,4))])].sort().reverse();}
function catTotals(rs){ const t={}; rs.filter(isExp).forEach(r=>t[r.category]=(t[r.category]||0)+r.amount); return Object.entries(t).sort((a,b)=>b[1]-a[1]); }
function rateTxt(i,o){ return i>0?Math.round((i-o)/i*100)+'%':'—'; }
function tile(cls,v,label,extra){ return `<div class="stat ${cls}"><div class="n" title="${bm(v)}" ${cls===''?`style="color:${v<0?'var(--bad)':'var(--ink)'}"`:''}>${bmS(v)}</div><div class="l">${label}</div>${extra||''}</div>`; }
function legend(items){ return `<div class="row small" style="gap:14px;margin:4px 0 6px">${items.map(([c,n])=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:4px;vertical-align:-1px"></i>${n}</span>`).join('')}</div>`; }
/* 甜甜圈圖：最多 6 塊，其餘併成「其他」；旁邊一定列出金額和百分比 */
function donut(list){
  const sum=list.reduce((a,x)=>a+x[1],0); if(!sum) return '<div class="empty">這個月沒有支出</div>';
  let top=list.slice(0,6); const rest=list.slice(6).reduce((a,x)=>a+x[1],0); if(rest) top=top.concat([['其他（合併）',rest]]);
  const R=54, r=34, cx=70, cy=70; let a0=-Math.PI/2; const gap=top.length>1?0.025:0;
  const arcs=top.map(([c,v])=>{ const a1=a0+v/sum*Math.PI*2; const s0=a0+gap/2, s1=Math.max(s0+0.001,a1-gap/2), lg=(s1-s0)>Math.PI?1:0;
    const P=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)].map(n=>n.toFixed(2)).join(' ');
    const d=top.length===1?`M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} L ${cx-0.01} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z`
      :`M ${P(R,s0)} A ${R} ${R} 0 ${lg} 1 ${P(R,s1)} L ${P(r,s1)} A ${r} ${r} 0 ${lg} 0 ${P(r,s0)} Z`;
    a0=a1; return `<path d="${d}" fill="${catColor(c)}"><title>${esc(c)}：${money(v)}（${Math.round(v/sum*100)}%）</title></path>`; }).join('');
  return `<div class="row" style="align-items:center;gap:14px;flex-wrap:nowrap"><svg viewBox="0 0 140 140" style="width:42%;max-width:170px;flex:none" role="img" aria-label="消費分類比例">${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="10" fill="var(--muted)">支出</text><text x="70" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${bmS(sum)}</text></svg>
    <div style="flex:1;min-width:0">${top.map(([c,v])=>`<div class="bs" style="font-size:13px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${catColor(c)};margin-right:5px"></i>${esc(c)}</span><span>${money(v)}・${Math.round(v/sum*100)}%</span></div>`).join('')}</div></div>`;
}
/* 每日支出趨勢：單一系列折線，y 軸從 0 開始 */
function dayTrend(ym,daily){
  const [y,m]=ym.split('-').map(Number), last=new Date(y,m,0).getDate(), lim=ym===today().slice(0,7)?+today().slice(8,10):last;
  const vals=[...Array(last)].map((_,i)=>i<lim?(daily[i+1]?daily[i+1].o:0):null), mx=Math.max(1,...vals.filter(v=>v!==null));
  const W=320,H=120,L=4,pad=14, X=i=>L+i*(W-L-4)/(last-1), Y=v=>H-pad-(v/mx)*(H-pad*2);
  const pts=vals.map((v,i)=>v===null?null:[X(i),Y(v),v,i+1]).filter(Boolean);
  return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto" role="img" aria-label="每日支出趨勢">
    <line x1="${L}" y1="${H-pad}" x2="${W}" y2="${H-pad}" stroke="var(--line)"/><line x1="${L}" y1="${pad}" x2="${W}" y2="${pad}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${W}" y="${pad-4}" font-size="10" text-anchor="end" fill="var(--muted)">最高 ${money(mx)}</text>
    <polyline fill="none" stroke="${C_OUT}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>
    ${pts.filter(p=>p[2]>0).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${C_OUT}" stroke="#fff" stroke-width="2"><title>${m}/${p[3]}：${money(p[2])}</title></circle>`).join('')}
    ${[1,10,20,last].map(d=>`<text x="${X(d-1)}" y="${H+12}" font-size="10" text-anchor="${d===1?'start':d===last?'end':'middle'}" fill="var(--muted)">${d}日</text>`).join('')}</svg>`;
}
/* 每月收支長條圖：收入、支出並排，共用一個 y 軸 */
function monthBars(rows){
  const mx=Math.max(1,...rows.flatMap(r=>[r.i,r.o])), W=320,H=130,pad=10, bw=W/12, w=Math.min(bw*0.34,12);
  return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto" role="img" aria-label="每月收支">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/><text x="${W}" y="${pad}" font-size="10" text-anchor="end" fill="var(--muted)">最高 ${money(mx)}</text>
    ${rows.map((r,k)=>{const cx=k*bw+bw/2, hi=r.i/mx*(H-pad*2), ho=r.o/mx*(H-pad*2);
      return `${r.i?`<rect x="${cx-w-1}" y="${H-hi}" width="${w}" height="${hi}" rx="2" fill="${C_IN}"><title>${k+1}月收入 ${money(r.i)}</title></rect>`:''}
        ${r.o?`<rect x="${cx+1}" y="${H-ho}" width="${w}" height="${ho}" rx="2" fill="${C_OUT}"><title>${k+1}月支出 ${money(r.o)}</title></rect>`:''}
        <text x="${cx}" y="${H+13}" font-size="9" text-anchor="middle" fill="var(--muted)">${k+1}</text>`;}).join('')}</svg>`;
}
function catBars(list){ const mx=list.length?list[0][1]:1, sum=list.reduce((a,x)=>a+x[1],0);
  return list.length?list.map(([c,a])=>`<div class="bar" style="cursor:default"><div><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${catColor(c)};margin-right:4px"></i>${esc(c)}</div><div class="b"><i style="width:${Math.round(a/mx*100)}%;background:${catColor(c)}"></i></div><div class="v">${money(a)}<div class="small muted" style="font-weight:400">${Math.round(a/sum*100)}%</div></div></div>`).join(''):'<div class="empty">沒有支出</div>'; }

    <div class="dayh" style="margin-top:12px"><span>🧾 消費紀錄明細</span><span>${money(t.o)}</span></div>
    ${sortRecs(rs.filter(isExp)).map(recRow).join('')||'<div class="empty">沒有消費紀錄</div>'}`;

    R[j]=Object.assign({},o,{amount:amt,date:r.date,acct:r.acct&&acctById(r.acct)?r.acct:''});
    if(!persist()){R[j]=o;return;} dirty=false; cur=null; go2(back); flash('已儲存 ✦'); return;
  }
  if(r.type==='debt'){
    if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}
    const j=R.findIndex(x=>x.id===r.id), o=R[j], d=debtById(r.debt), nm=d?d.name:(r.debtName||'');

function checkAcctName(name,selfId){
  if(!name){alert('請填寫帳戶名稱');return false;}
  if(/\d{6,}/.test(name.replace(/[\s-]/g,''))){alert('名稱看起來像帳號或卡號。為了安全，請只寫暱稱，例如「台新」或「中信信用卡」。');return false;}
  if(/領|轉|加值|\+值/.test(name)){alert('名稱裡不能有「領、轉、加值、+值」，這些字小帳會當成轉帳。');return false;}
  if(/^\d+$/.test(name)){alert('名稱不能只有數字');return false;}
  if(S.accounts.some(a=>a.id!==selfId&&a.name.toLowerCase()===name.toLowerCase())){alert('已經有同名的帳戶了');return false;}
  return true;
}

function acctDelta(r,id){ let d=0;
  if(r.type==='income'&&okAcct(r.acct)===id) d+=r.amount;
  if(r.type==='expense'&&okAcct(r.acct)===id) d-=r.amount;
  if(r.type==='transfer'){ if(okAcct(r.from)===id) d-=r.amount; if(okAcct(r.to)===id) d+=r.amount; }
  if(r.type==='adjust'&&okAcct(r.acct)===id) d+=(r.sign<0?-1:1)*r.amount;
  if(r.type==='debt'&&okAcct(r.acct)===id) d+=(r.op==='borrow'||r.op==='collect'?1:-1)*r.amount;
  return d; }

function delAcct(id){
  if(id==='cash') return; const a=acctById(id); if(!a) return;
  const refs=live().filter(r=>r.type!=='save'&&(r.acct===id||r.from===id||r.to===id));
  const finish=(apply,msg)=>{ const oR=JSON.stringify(R), oS=JSON.stringify(S); apply(); live().forEach(r=>{ if(r.type==='save'&&r.acct===id) r.acct=''; }); S.accounts=S.accounts.filter(x=>x.id!==id);
    if(!persist()){R=JSON.parse(oR);S=JSON.parse(oS);return false;} renderAccounts(); flash(msg); return true; };
  if(!refs.length){ if(confirm(`確定要刪除帳戶「${a.name}」嗎？`)) finish(()=>{},'已刪除帳戶'); return; }
  const others=S.accounts.filter(x=>x.id!==id);
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h2 style="margin:0 0 8px;font-size:17px">刪除帳戶「${esc(a.name)}」</h2>

    <div class="row"><button class="danger" id="daOk">確定</button><button id="daNo">取消</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#daNo').onclick=()=>m.remove();
  m.querySelector('#daOk').onclick=()=>{
    const mode=m.querySelector('input[name=dm]:checked').value;
    if(mode==='move'){
      const to=m.querySelector('#daTo').value, tn=acctName(to);

      let gone=0;
      if(finish(()=>{ refs.forEach(r=>{ if(r.acct===id) r.acct=to; if(r.from===id) r.from=to; if(r.to===id) r.to=to;
          if(r.type==='transfer'&&r.from===r.to){ r.deleted=true; r.deletedAt=today(); gone++; } }); },
        `已搬到「${tn}」並刪除帳戶`+(gone?`（${gone} 筆變成「自己轉給自己」的轉帳已移到最近刪除）`:''))) m.remove();
    } else {
      if(!confirm(`確定刪除「${a.name}」和它的 ${refs.length} 筆紀錄嗎？\n紀錄會先放進「最近刪除」，30 天內可以救回。`)) return;
      if(finish(()=>{ refs.forEach(r=>{ r.deleted=true; r.deletedAt=today(); }); },`已刪除帳戶，${refs.length} 筆紀錄移到「最近刪除」`)) m.remove();
    }
  };
}

  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML=`<div class="box" style="max-height:80vh;overflow:auto"><div class="row" style="margin-bottom:8px"><b>${esc(d.name)} 的紀錄</b><span class="spacer"></span><button id="ddX">關閉</button></div>
    ${rs.length?rs.map(recRow).join(''):'<div class="empty">還沒有紀錄</div>'}</div>`;
  document.body.appendChild(m); m.querySelector('#ddX').onclick=()=>m.remove();
  m.querySelectorAll('.rec').forEach(el=>el.addEventListener('click',()=>m.remove()));
}
function delDebt(id){
  const d=debtById(id); if(!d) return; const refs=live().filter(r=>r.type==='debt'&&r.debt===id);
  if(!confirm(refs.length?`確定刪除「${d.name}」嗎？\n它的 ${refs.length} 筆紀錄會一起放進「最近刪除」，30 天內可以救回。`:`確定刪除「${d.name}」嗎？`)) return;
  const oR=JSON.stringify(R), oS=JSON.stringify(S); refs.forEach(r=>{r.deleted=true;r.deletedAt=today();r.debtDef={name:d.name,kind:d.kind,init:d.init,monthly:d.monthly,dueDay:d.dueDay,payAcct:d.payAcct};}); S.debts=S.debts.filter(x=>x.id!==id);
  if(!persist()){R=JSON.parse(oR);S=JSON.parse(oS);return;} renderDebts(); flash(refs.length?`已刪除，${refs.length} 筆紀錄移到「最近刪除」`:'已刪除');
}

/* ---------- 儲蓄頁 ---------- */
function monthsUntil(ymd){ const t=today(); if(ymd<=t) return 0; const [y1,m1,d1]=t.split('-').map(Number),[y2,m2,d2]=ymd.split('-').map(Number);
  let m=(y2-y1)*12+(m2-m1); if(d2<d1) m--; return Math.max(m,1); }
function goalRow(g,b){
  const saved=goalSaved(g,b), tg=Number(g.target)||0, pct=tg>0?Math.min(Math.round(saved/tg*100),100):0, left=Math.max(tg-saved,0);
  const lost=g.mode==='acct'&&!acctById(g.acct);
  let plan='';
  if(!g.done&&left>0&&g.deadline){ const mo=monthsUntil(g.deadline); plan=mo>0?`・${fmtFull(g.deadline)} 前每月要存約 ${money(Math.ceil(left/mo))}`:'・已超過預定日期'; }
  return `<div class="acc"><div class="ic">${pct>=100?'🎉':'🎯'}</div><div class="mid"><div style="font-weight:700">${esc(g.name)}</div>
    <div class="small muted">${g.mode==='acct'?(lost?'⚠️ 綁定的帳戶已刪除，請按「修改」重新選':`綁定帳戶：${esc(acctName(g.acct))}`):'自己標記'}${g.done?`・${fmtFull(g.doneAt||today())} 完成`:(left>0?`・還差 ${money(left)}`:'・🎉 已達成！')}${plan}</div></div>
    <div class="bal">${money(saved)} <span class="small muted">/ ${money(tg)}</span></div>
    <div style="width:100%"><div class="bar" style="grid-template-columns:1fr 52px;cursor:default;margin:2px 0"><div class="b"><i style="width:${pct}%;background:${pct>=100?'var(--ok)':'var(--brand)'}"></i></div><div class="v small">${pct}%</div></div></div>
    <div class="ops">${g.mode==='manual'?`<button onclick="goalDetail('${g.id}')">明細</button>`:''}${g.done?`<button onclick="goalDone('${g.id}',false)">移回進行中</button>`:`<button onclick="editGoal('${g.id}')">修改</button><button onclick="goalDone('${g.id}',true)">完成</button>`}<button class="danger" onclick="delGoal('${g.id}')">刪除</button></div></div>`;
}
function goalFormHTML(pre,g){ g=g||{};
  return `<div class="grid"><div><label class="f">名稱</label><input type="text" id="${pre}Name" maxlength="20" value="${esc(g.name||'')}" placeholder="例如：旅遊基金"></div>
    <div><label class="f">目標金額</label><input type="number" id="${pre}Tg" inputmode="decimal" value="${g.target||''}" placeholder="例如：50000"></div>
    <div><label class="f">進度怎麼算</label><select id="${pre}Mode" onchange="$('#${pre}AcctW').style.display=this.value==='acct'?'':'none'">
      <option value="manual" ${g.mode!=='acct'?'selected':''}>自己標記（打「${esc(g.name||'旅遊基金')}存5000」）</option><option value="acct" ${g.mode==='acct'?'selected':''}>綁定帳戶（進度 = 帳戶餘額）</option></select></div>
    <div id="${pre}AcctW" style="${g.mode==='acct'?'':'display:none'}"><label class="f">綁定哪個帳戶</label><select id="${pre}Acct">${acctOpts(g.acct&&acctById(g.acct)?g.acct:'')}</select></div>
    <div><label class="f">希望哪天存到（選填）</label><input type="date" id="${pre}Dl" value="${esc(g.deadline||'')}"></div></div>`;
}
function readGoalForm(pre,selfId){
  const name=$('#'+pre+'Name').value.trim(), tg=parseInit($('#'+pre+'Tg').value), mode=$('#'+pre+'Mode').value, acct=$('#'+pre+'Acct').value, dl=$('#'+pre+'Dl').value;
  if(!name){alert('請填寫名稱');return null;} if(/\d/.test(name)){alert('名稱裡不要有數字（會跟金額搞混）');return null;}
  if(/領|轉|加值|\+值|借|還/.test(name)){alert('名稱裡不能有「領、轉、加值、借、還」這些字，小帳會判斷錯');return null;}
  if(S.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase())){alert('名稱不能跟帳戶一樣');return null;}
  if(S.goals.some(g=>g.id!==selfId&&g.name.toLowerCase()===name.toLowerCase())){alert('已經有同名的目標了');return null;}
  if(Number.isNaN(tg)||!(tg>0)){alert('目標金額要是大於 0 的數字');return null;}
  if(mode==='acct'&&!acctById(acct)){alert('請選擇要綁定的帳戶');return null;}
  return {name,target:tg,mode,acct:mode==='acct'?acct:'',deadline:dl||''};
}
function renderSavings(){
  page='savings'; nav(); const b=balances(), act=S.goals.filter(g=>!g.done), dn=S.goals.filter(g=>g.done);
  const total=act.reduce((s,g)=>s+goalSaved(g,b),0);
  $('#app').innerHTML=`<div class="card total"><div class="muted small" style="font-weight:700">進行中的目標，總共已存</div><div class="n">${money(total)}</div></div>
   <div class="card"><h2>🎯 儲蓄目標</h2>${act.length?act.map(g=>goalRow(g,b)).join(''):'<div class="muted small">還沒有目標。在下面新增一個吧 ✦</div>'}
    <details style="margin-top:10px"><summary>➕ 新增目標</summary><div style="margin-top:8px">${goalFormHTML('ng')}</div><button class="primary" style="margin-top:10px" onclick="addGoal()">新增</button></details>
    <div class="muted small" style="margin-top:8px">「自己標記」：在首頁打「旅遊基金存5000」或「旅遊基金存到台新5000」，進度會增加，但<b>帳戶餘額不變、不算支出</b>。花錢照平常記帳就好，不會扣目標。<br>「綁定帳戶」：用轉帳存錢，例如「台新轉儲蓄專戶5000」。</div></div>
   ${dn.length?`<div class="card"><details><summary>✅ 已完成（${dn.length}）</summary>${dn.map(g=>goalRow(g,b)).join('')}</details></div>`:''}`;
}
function addGoal(){ const f=readGoalForm('ng',null); if(!f) return; const o=JSON.stringify(S);
  S.goals.push(Object.assign({id:newId(),done:false,doneAt:''},f)); if(!persist()){S=JSON.parse(o);return;} renderSavings(); flash(`已新增目標「${f.name}」✦`); }
function editGoal(id){
  const g=goalById(id); if(!g) return; const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h2 style="margin:0 0 10px;font-size:17px">修改「${esc(g.name)}」</h2>${goalFormHTML('eg',g)}
    ${g.mode==='manual'?'<div class="muted small" style="margin:8px 0">改成「綁定帳戶」後，原本標記的存錢紀錄會保留，但進度改成看帳戶餘額。</div>':''}
    <div class="row" style="margin-top:10px"><button class="primary" id="egOk">儲存</button><button id="egNo">取消</button></div></div>`;
  document.body.appendChild(m); m.querySelector('#egNo').onclick=()=>m.remove();
  m.querySelector('#egOk').onclick=()=>{ const f=readGoalForm('eg',id); if(!f) return; const o=JSON.stringify(S); Object.assign(g,f);
    if(!persist()){S=JSON.parse(o);return;} m.remove(); renderSavings(); flash('已儲存 ✦'); };
}
function goalDone(id,v){ const g=goalById(id); if(!g) return;
  if(v&&!confirm(`確定把「${g.name}」標記為完成嗎？\n會收進「已完成」，紀錄都會保留。`)) return;
  const o=JSON.stringify(S); g.done=v; g.doneAt=v?today():''; if(!persist()){S=JSON.parse(o);return;} renderSavings(); flash(v?'🎉 恭喜完成！':'已移回進行中'); }
function goalDetail(id){
  const g=goalById(id); if(!g) return; const rs=sortRecs(live().filter(r=>r.type==='save'&&r.goal===id));
  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML=`<div class="box" style="max-height:80vh;overflow:auto"><div class="row" style="margin-bottom:8px"><b>${esc(g.name)} 的存錢紀錄</b><span class="spacer"></span><button id="gdX">關閉</button></div>
    ${rs.length?rs.map(recRow).join(''):'<div class="empty">還沒有紀錄</div>'}</div>`;
  document.body.appendChild(m); m.querySelector('#gdX').onclick=()=>m.remove();
  m.querySelectorAll('.rec').forEach(el=>el.addEventListener('click',()=>m.remove()));
}
function delGoal(id){
  const g=goalById(id); if(!g) return; const refs=live().filter(r=>r.type==='save'&&r.goal===id);
  if(!confirm(refs.length?`確定刪除目標「${g.name}」嗎？\n它的 ${refs.length} 筆存錢紀錄會一起放進「最近刪除」，30 天內可以救回。`:`確定刪除目標「${g.name}」嗎？`)) return;
  const oR=JSON.stringify(R), oS=JSON.stringify(S); refs.forEach(r=>{r.deleted=true;r.deletedAt=today();r.goalDef={name:g.name,target:g.target,mode:g.mode,acct:g.acct,deadline:g.deadline};}); S.goals=S.goals.filter(x=>x.id!==id);
  if(!persist()){R=JSON.parse(oR);S=JSON.parse(oS);return;} renderSavings(); flash(refs.length?`已刪除，${refs.length} 筆紀錄移到「最近刪除」`:'已刪除');
}

function delRule(i){ if(!confirm(`確定刪除「${S.rules[i].word}」這個常用詞嗎？`)) return; S.rules.splice(i,1); persist(); renderSettings(); }
function addPerson(){ const v=$('#pIn').value.trim(); if(!v) return; if(S.people.includes(v)){flash('已經有這個對象了');return;} S.people.push(v); persist(); renderSettings(); }
function delPerson(i){ if(!confirm(`確定刪除對象「${S.people[i]}」嗎？已經記好的紀錄不會被改動。`)) return; S.people.splice(i,1); persist(); renderSettings(); }
function uploadBg(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return;
  if(!/^image\//.test(f.type)){ alert('請上傳圖檔'); return; }
  const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const s=Math.min(1,1200/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); const old=S.bg; S.bg={url:c.toDataURL('image/jpeg',0.7),mode:old.mode||'both'};
    if(!persist()){S.bg=old;return;} applyBg(); renderSettings(); flash('背景圖換好了 ✦'); };
    img.onerror=()=>alert('這張圖讀不出來，請換一張'); img.src=fr.result; }; fr.readAsDataURL(f);
}
function resetBg(){ if(!confirm('要換回預設的可愛橫幅嗎？')) return; S.bg={url:'',mode:'both'}; persist(); applyBg(); renderSettings(); }

/* ---------- 最近刪除 ---------- */
let selT=new Set();
function trashList(){return R.filter(r=>r.deleted).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));}
function daysBetween(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000);}
function renderTrash(){
  page='trash'; $('#nav').innerHTML=''; const rs=trashList(), n=selT.size;
  $('#app').innerHTML=`<div class="row" style="margin-bottom:12px"><button onclick="selT=new Set();go2('settings')">← 返回設定</button><h2 style="margin:0 8px;font-size:18px">最近刪除</h2></div>
   <div class="card"><div class="notice small">已刪除超過 30 天的紀錄，會在下次打開本工具時永久刪除。</div>
    <div class="row" style="margin:8px 0"><button onclick="selT=new Set(trashList().map(r=>r.id));renderTrash()" ${rs.length?'':'disabled'}>全選</button><button onclick="selT=new Set();renderTrash()" ${n?'':'disabled'}>全部不選</button>
     <button id="trR" onclick="trashRestore()" ${n?'':'disabled'}>還原</button><button id="trP" class="danger" onclick="trashPerm()" ${n?'':'disabled'}>永久刪除</button><span class="muted small">${n?'已勾選 '+n+' 筆':'請先勾選'}</span></div>
    ${rs.length?rs.map(r=>{const m=recMeta(r); return `<div class="rec" style="cursor:default"><input type="checkbox" style="width:auto" data-id="${r.id}" ${selT.has(r.id)?'checked':''} onchange="this.checked?selT.add('${r.id}'):selT.delete('${r.id}');renderTrash()"><div class="ic">${m.icon}</div>
      <div class="mid"><div class="nm">${esc(m.name)}${r.who?`<span class="tag">${esc(r.who)}</span>`:''}</div><div class="sb">${fmtMD(r.date)}・${m.sub}・${fmtFull(r.deletedAt)} 刪除・剩 ${Math.max(30-daysBetween(r.deletedAt,today()),0)} 天</div></div>
      <div class="am ${m.cls}">${m.sign}${money(r.amount)}</div></div>`;}).join(''):'<div class="empty">目前沒有刪除的紀錄</div>'}</div>`;
}
function trashRestore(){ const ids=[...selT]; if(!ids.length) return; const oR=JSON.stringify(R); let fixed=0;
  R.forEach(r=>{ if(ids.includes(r.id)&&r.deleted){ r.deleted=false; delete r.deletedAt;
    let f=false; ['acct','from','to'].forEach(k=>{ if(r[k]&&!acctById(r[k])){ r[k]='cash'; f=true; } }); if(f) fixed++;
    if(r.type==='save'&&!goalById(r.goal)){ const D=r.goalDef||{}; S.goals.push(fixS({accounts:S.accounts,goals:[Object.assign({id:r.goal,name:r.goalName||'未命名目標',target:0,mode:'manual',acct:'',deadline:''},D,{done:false,doneAt:''})]}).goals[0]); }
    if(r.type==='debt'&&!debtById(r.debt)&&r.debtDef){ S.debts.push(fixS({accounts:S.accounts,debts:[Object.assign({id:r.debt},r.debtDef)]}).debts[0]); }
    if(r.type==='debt'&&!debtById(r.debt)) S.debts.push({id:r.debt,name:r.debtName||'未命名',kind:r.debtKind==='loan'?'loan':'person',init:0,monthly:0,dueDay:0,payAcct:''}); } });
  if(!persist()){R=JSON.parse(oR);return;} selT=new Set(); renderTrash();
  if(fixed) alert(`已還原。其中 ${fixed} 筆原本的帳戶已經刪除，已自動改成「現金」。`); else flash('已還原 ✦'); }
function trashPerm(){ const n=selT.size; if(!n) return; if(!confirm(`確定要永久刪除選取的 ${n} 筆嗎？永久刪除後無法復原。`)) return;
  const old=R; R=R.filter(r=>!selT.has(r.id)); if(!persist()){R=old;return;} selT=new Set(); renderTrash(); flash('已永久刪除'); }
function purgeExpired(){ const old=R, n=R.length; R=R.filter(r=>!(r.deleted&&r.deletedAt&&today()>addDays(r.deletedAt,30))); if(R.length!==n) persist(); }

/* ---------- 匯出、備份、還原 ---------- */
function exportCSV(){
  const rs=sortRecs(live()).reverse(); if(!rs.length){alert('目前沒有紀錄可匯出。');return;}
  const head=['日期','類型','分類','項目','對象','帳戶','轉出帳戶','轉入帳戶','金額'];
  const TL={income:'收入',expense:'支出',transfer:'轉帳',adjust:'校正',debt:'負債',save:'儲蓄（不算收支）'};
  const rows=rs.map(r=>[r.date,r.type==='debt'?(r.exp?'負債（還款・算支出）':'負債（借還）'):(TL[r.type]||''),r.category,(r.type==='debt'||r.type==='save')?recMeta(r).name:r.item,r.who||'',r.type!=='transfer'?acctName(r.acct):'',r.type==='transfer'?acctName(r.from):'',r.type==='transfer'?acctName(r.to):'',r.type==='adjust'&&r.sign<0?-r.amount:r.amount]);
  const csv=[head,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('﻿'+csv,`xiaozhang_${today()}.csv`,'text/csv;charset=utf-8');
}

function restore(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return; const fr=new FileReader();
  fr.onload=()=>{ let d; try{ d=JSON.parse(fr.result); if(!d||d.app!=='casevoraXiaozhang'||!Array.isArray(d.records)) throw 0; }catch(e){ alert('無法讀取：這不是本工具的備份檔。'); return; }
    const bad=d.records.some(r=>!r||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')||!(Number(r.amount)>0)||!['income','expense','transfer','adjust','debt','save'].includes(r.type)||(r.type==='save'&&!/^[\w-]{1,40}$/.test(String(r.goal)))||(r.type==='debt'&&(!DEBT_OP[r.op]||!/^[\w-]{1,40}$/.test(String(r.debt))))); if(bad){ alert('無法還原：備份檔內有格式不正確的紀錄。'); return; }
    if(!confirm(`備份檔內有 ${d.records.length} 筆紀錄。\n還原會「取代」目前瀏覽器中的 ${live().length} 筆紀錄和設定，目前「最近刪除」裡的 ${trashList().length} 筆也會一併被取代，確定嗎？`)) return;
    const oR=R,oS=S; R=d.records.map(r=>({id:/^[\w-]{1,40}$/.test(String(r.id))?String(r.id):newId(),type:r.type,amount:Number(r.amount),item:String(r.item||''),category:r.category||(r.type==='income'?'其他收入':r.type==='transfer'?'轉帳':r.type==='adjust'?'校正':'其他'),date:r.date,who:r.who||'',icon:r.icon||'',createdAt:r.createdAt||'',
      ...(r.type==='transfer'?{from:String(r.from||'cash'),to:String(r.to||'cash')}:{acct:String(r.acct||'cash')}),...(r.type==='adjust'?{sign:Number(r.sign)<0?-1:1}:{}),
      ...(r.type==='debt'?{op:r.op,debt:String(r.debt),debtName:String(r.debtName||'').slice(0,20),debtKind:r.debtKind==='loan'?'loan':'person',exp:r.debtKind==='loan'&&r.op==='pay'}:{}),
      ...(r.type==='save'?{acct:String(r.acct||''),goal:String(r.goal),goalName:String(r.goalName||'').slice(0,20)}:{})}));
    S=fixS(Object.assign(defaultS(),d.settings||{}));
    R.forEach(r=>{ if(r.type==='save'&&!S.goals.some(x=>x.id===r.goal)) S.goals.push({id:r.goal,name:r.goalName||'未命名目標',target:0,mode:'manual',acct:'',deadline:'',done:false,doneAt:''}); });
    R.forEach(r=>{ if(r.type==='debt'&&!S.debts.some(x=>x.id===r.debt)) S.debts.push({id:r.debt,name:r.debtName||'未命名',kind:r.debtKind,init:0,monthly:0,dueDay:0,payAcct:''}); }); if(!persist()){R=oR;S=oS;return;} applyBg(); flash('還原完成 ✦'); go2('home'); };
  fr.readAsText(f);
}
