/* ---------- 生活費預算 ---------- */
const LIVING=['餐飲','飲料','交通','生活用品','購物','服飾','3C用品','娛樂','醫療','寵物','禮物','育兒','其他'];
function livingSpent(ym){ return live().filter(r=>r.date.startsWith(ym)&&r.type==='expense'&&LIVING.includes(r.category)).reduce((a,r)=>a+r.amount,0); }
function cashOnHand(){ const b=balances(); return S.accounts.filter(a=>a.atype==='cash').reduce((s,a)=>s+Math.max(0,b[a.id]||0),0); }
function monthFlow(ym){ let inn=0,out=0; live().filter(r=>r.date.startsWith(ym)).forEach(r=>{
    if(r.type==='income') inn+=r.amount; else if(r.type==='expense') out+=r.amount;
    else if(r.type==='debt'){ if(r.op==='borrow'||r.op==='collect') inn+=r.amount; else out+=r.amount; } });
  return {inn:Math.round(inn),out:Math.round(out),net:Math.round(inn-out)}; }
function moneyCard(){ const b=balances(), ym=today().slice(0,7), f=monthFlow(ym);
  const grp={cash:0,bank:0,epay:0,other:0}, cardDebt=S.accounts.filter(a=>(b[a.id]||0)<0).reduce((s,a)=>s-b[a.id],0);
  S.accounts.forEach(a=>{ const v=b[a.id]||0; if(v>0) grp[a.atype==='card'?'other':(grp[a.atype]!==undefined?a.atype:'other')]+=v; });
  const have=Math.round(grp.cash+grp.bank+grp.epay+grp.other), list=S.accounts.filter(a=>Math.abs(b[a.id]||0)>0.001||a.id==='cash');
  const chip=(ic,t,v)=>v?`<div class="mchip"><span>${ic} ${t}</span><b>${money(Math.round(v))}</b></div>`:'';
  return `<div class="card o8 moneyc"><div class="row"><h2 style="margin:0">👛 我的錢</h2><span class="spacer"></span><a href="#" class="small" onclick="balModal();return false">填／校正</a></div>
    <div class="mtotal"><div class="small muted">現在總共有（身上＋銀行＋電子支付）</div><div class="big">${money(have)}</div>
      ${cardDebt>0?`<div class="small" style="color:var(--bad)">信用卡／負數帳戶 -${money(Math.round(cardDebt))}，扣掉後 ${bm(Math.round(have-cardDebt))}</div>`:''}</div>
    <div class="mchips">${chip('💵','身上',grp.cash)}${chip('🏦','銀行',grp.bank)}${chip('📱','電子支付',grp.epay)}${chip('🗂️','其他',grp.other)}${have?'':'<div class="small muted">還沒填，按右上「填／校正」</div>'}</div>
    <div class="mflow"><div class="small muted" style="margin-bottom:2px">本月現金流（${+ym.slice(5)}月）</div>
      <div class="mfr"><span>⬇️ 進來 <b style="color:var(--ok)">+${money(f.inn)}</b></span><span>⬆️ 出去 <b style="color:var(--bad)">-${money(f.out)}</b></span><span>＝ <b style="color:${f.net<0?'var(--bad)':'var(--ok)'}">${f.net<0?'-':'+'}${money(Math.abs(f.net))}</b></span></div></div>
    <details class="macc"><summary class="small">看每個帳戶</summary><div class="mlist">${list.map(a=>`<div class="bs"><span>${a.icon||'💳'} ${esc(a.name)}</span><b style="color:${(b[a.id]||0)<0?'var(--bad)':'var(--ink)'}">${bm(Math.round((b[a.id]||0)*100)/100)}</b></div>`).join('')}</div></details>
    <div class="small muted mhint" style="margin-top:6px">從銀行領錢放身上，打「薪資帳戶領1000」，會從銀行轉到身上，總數不變、不算花掉。</div></div>`; }
function budgetCard(){ const B=livBudget(today().slice(0,7)), ym=today().slice(0,7), sp=livingSpent(ym), left=B-sp, pct=B?Math.min(100,Math.round(sp/B*100)):0;
  const [y,m]=ym.split('-').map(Number), daysLeft=new Date(y,m,0).getDate()-(+today().slice(8))+1;
  const c=Math.max(0,Math.round(cashOnHand())), capped=left>0&&c<left, usable=left>0?Math.min(left,c):0;
  return `<div class="card o4"><div class="row"><h2 style="margin:0">🍙 本月生活費</h2><span class="spacer"></span><a href="#" class="small" onclick="budgetEdit();return false">改預算</a></div>

        :`<div class="bs sum"><span>✨ 本月還可以用</span><b style="color:${capped?'#b45309':'var(--ok)'}">${money(usable)}</b></div>
          ${capped?`<div class="small" style="color:#8a5a00">預算還剩 ${money(left)}，但身上只有 ${money(c)}，先以身上的錢為準。</div>`:''}
          ${usable>0?`<div class="small muted">剩 ${daysLeft} 天，平均每天可以用 ${money(Math.floor(usable/daysLeft))}</div>`:''}
          ${capped?`<div class="notice small">💡 要用到完整預算，從帳戶領 <b>${money(Math.ceil((left-c)/100)*100)}</b> 出來（例：打「薪資帳戶領${Math.ceil((left-c)/100)*100}」），領出來後「還可以用」就會變回 ${money(left)}。</div>`:left>0?`<div class="small" style="color:var(--ok);font-weight:700">✓ 身上的錢夠用到月底</div>`:''}`}
      ${catBudgetHTML(ym)}

     :'<div class="small muted" style="margin-top:6px">還沒設定。按「改預算」填每個月的生活費，就會幫你算還可以用多少。</div>'}</div>`; }
function catBudgetHTML(ym){ const cs=Object.entries(S.budget.cats); if(!cs.length) return '';

/* ---------- 行事曆 ---------- */
let CALM=today().slice(0,7), CALV='month', CALD=today();
const EV_TXT={done:'已繳',wait:'待繳',today:'今天到期',late:'逾期',moved:'已延後',skip:'略過',income:'收入',got:'已入帳',goal:'存錢目標'};
function monthEvents(M){ const ev=[];
  billRows(M).forEach(b=>{ const r=b.st==='done'?billRec(b):null; ev.push({date:b.due,name:b.x.name,amt:r?r.amount:b.x.amount,st:b.st,k:b.k,type:'bill',to:b.to,from:b.from}); });
  S.recurring.forEach(x=>{ if(x.kind!=='income'||!recurOn(x,M)) return; const k=x.id+'|'+M, d=S.recurDone[k], h=recurHint(x,M), ov=S.recurAmt[k]; ev.push({date:dueDate(M,x.day),name:x.name,amt:ov!==undefined?ov:h?h.amt:x.amount,st:d==='done'?'got':d==='skip'?'skip':'income',type:'income',note:h?h.note:'',k}); });
  const prev=ymAdd(M,-1), slp=otSlipFor(prev), otAct=live().filter(r=>r.date.startsWith(M)&&!r.recur&&r.type==='income'&&/加班/.test(r.item||'')).reduce((a,r)=>a+r.amount,0), otp=otAct||(S.otEst[M]!==undefined?S.otEst[M]:slp?slp.v:otPayMonth(prev)); if(otp>0){ const sx=S.recurring.find(y=>y.kind==='income'&&/薪水|薪資|月薪/.test(y.name)&&recurOn(y,M)); ev.push({date:dueDate(M,sx?sx.day:10),name:`加班費（${ymShort(prev)}）`,amt:otp,st:otAct?'got':'income',type:'income',ot:1,note:otAct?'已經記帳（實際入帳）':S.otEst[M]!==undefined?'你改過的金額':slp?`照 ${ymShort(slp.ym)}薪資條備註（${money(slp.v)}）`:`照加班頁 ${ymShort(prev)}的紀錄估算，實際以薪資條為準`}); }
  S.goals.forEach(g=>{ if(!g.done&&g.deadline&&g.deadline.startsWith(M)) ev.push({date:g.deadline,name:`${g.name} 截止`,amt:g.target,st:'goal',type:'goal'}); });
  return ev.sort((a,b)=>a.date.localeCompare(b.date)||(a.type==='income'?-1:1)); }
function otPayMonth(ym){ return Math.round(S.ot.days.filter(d=>d.date.startsWith(ym)&&!isLeave(d.kind)).reduce((a,d)=>a+otCalc(d).pay,0)); }
function monthPlan(M){ /* 跟月結表同一套算法，數字才會一致 */ const L=ledgerMonth(M); let inc=0,out=0; Object.entries(L.rows).forEach(([k,v])=>{ if(k==='out|生活費') return; if(k.startsWith('in|')) inc+=v; else out+=-v; });
  const liv=-(L.rows['out|生活費']||0); return {inc,out,liv,save:L.net}; }
function evChip(e,i,full){ return `<button class="ev ev-${e.st}" onclick="evOpen('${e.date.slice(0,7)}',${i})" title="${esc(e.name)} ${money(e.amt)}・${EV_TXT[e.st]}">${e.type==='income'?'＋':e.type==='goal'?'🎯':''}${esc(e.name)}${full?` <b>${money(e.amt)}</b>`:''}</button>`; }
function renderCal(){ page='cal'; nav(); const M=CALM, ev=monthEvents(M), P=monthPlan(M), t=today();

    const evs={}; [...new Set(days.map(d=>d.slice(0,7)))].forEach(mm=>monthEvents(mm).forEach((e,i)=>{ (evs[e.date]=evs[e.date]||[]).push([e,i]); }));

  $('#app').innerHTML=`<div class="kpis">

     ${kpi('要繳的錢',bmS(P.out),`${ev.filter(e=>e.type==='bill'&&OPEN_ST.includes(e.st)).length} 筆還沒繳`,'🧾','var(--bad)','var(--bad-soft)',money(P.out),'',"BM=CALM;BF='open';go('bills')")}

     ${kpi('預計可以存',bmS(P.save),P.save<0?'<b style="color:var(--bad)">這個月會不夠用</b>':'收入 − 要繳 − 生活費','🐷',P.save<0?'var(--bad)':'var(--brand)',P.save<0?'var(--bad-soft)':'var(--brand-soft)',bm(P.save))}</div>
   <div class="card"><div class="row" style="margin-bottom:10px"><div class="seg">${[['month','月檢視'],['week','週檢視'],['list','清單檢視'],['sheet','📋 收支表'],['ledger','📒 月結表']].map(([k,n])=>`<button class="${CALV===k?'on':''}" onclick="CALV='${k}';renderCal()">${n}</button>`).join('')}</div></div>
     <div class="row" style="margin-bottom:10px"><button onclick="CALM=ymAdd(CALM,-1);CALD=CALM+'-01';renderCal()">← 上個月</button><h2 style="margin:0 6px">${ymLabel(M)}</h2><button onclick="CALM=ymAdd(CALM,1);CALD=CALM+'-01';renderCal()">下個月 →</button><button onclick="CALM=today().slice(0,7);CALD=today();renderCal()">回到今天</button><span class="spacer"></span>

function evOpen(M,i){ const e=monthEvents(M)[i]; if(!e) return; const m=document.createElement('div'); m.className='modal';

/* ---------- 試算＋照計畫執行 ---------- */
function calcEval(src){ const t=String(src||'').replace(/[×xX＊]/g,'*').replace(/[÷／]/g,'/').replace(/[＋]/g,'+').replace(/[－—]/g,'-').replace(/[（]/g,'(').replace(/[）]/g,')').replace(/[,，\s元$]/g,'');
  if(!t) return null; if(!/^[\d.+\-*/()]+$/.test(t)) return NaN; let i=0;
  const num=()=>{ const m=t.slice(i).match(/^\d+(\.\d+)?/); if(!m) throw 0; i+=m[0].length; return Number(m[0]); };
  const fac=()=>{ if(t[i]==='-'){ i++; return -fac(); } if(t[i]==='('){ i++; const v=add(); if(t[i]!==')') throw 0; i++; return v; } return num(); };
  const mul=()=>{ let v=fac(); while(t[i]==='*'||t[i]==='/'){ const o=t[i++], w=fac(); if(o==='/'&&w===0) throw 0; v=o==='*'?v*w:v/w; } return v; };
  const add=()=>{ let v=mul(); while(t[i]==='+'||t[i]==='-'){ const o=t[i++], w=mul(); v=o==='+'?v+w:v-w; } return v; };
  try{ const v=add(); if(i!==t.length) return NaN; return Math.round(v*100)/100; }catch(e){ return NaN; } }
let CALC=null;
function calcInit(){ if(CALC&&!CALC.baseEdited) CALC.base=String(Math.round(cashOnHand())); if(!CALC) CALC={base:String(Math.round(cashOnHand())),days:'7',name:'這週計畫',items:[{n:'飯錢',e:'150*7'},{n:'油錢',e:'200'}]}; return CALC; }
function calcCard(){ const C=calcInit(), base=calcEval(C.base), vals=C.items.map(it=>calcEval(it.e)), bad=vals.some(v=>Number.isNaN(v))||Number.isNaN(base), tot=vals.reduce((a,v)=>a+(v||0),0), left=(base||0)-tot;
  const plans=S.plans.slice().reverse().slice(0,3);
  return `<div class="card o4 calc"><div class="row"><h2 style="margin:0">🧮 試算</h2><span class="spacer"></span><a href="#" class="small" onclick="CALC=null;rerender();return false">重來</a></div>
    <div class="grid" style="grid-template-columns:1fr 90px;margin-top:6px"><div><label class="f">手上有多少 <span class="small muted" style="font-weight:400">（預設＝身上現金）</span></label><input type="text" inputmode="decimal" value="${esc(C.base)}" oninput="CALC.base=this.value;CALC.baseEdited=true;calcUpd()" placeholder="例：2000"></div><div><label class="f">幾天</label><input type="number" inputmode="numeric" value="${esc(C.days)}" oninput="CALC.days=this.value"></div></div>
    <div style="margin-top:8px">${C.items.map((it,i)=>`<div class="crow"><input type="text" value="${esc(it.n)}" placeholder="項目" oninput="CALC.items[${i}].n=this.value" style="width:34%"><input type="text" value="${esc(it.e)}" placeholder="例：150*7" oninput="CALC.items[${i}].e=this.value;calcUpd()" style="flex:1"><b class="cv" id="cv${i}">${Number.isNaN(vals[i])?'算式看不懂':vals[i]===null?'':money(vals[i])}</b><button onclick="CALC.items.splice(${i},1);rerender()" aria-label="刪除這列">✕</button></div>`).join('')}

    <div class="small muted" style="margin-top:4px">可以打 + − × ÷ 和括號，例如 150*7、(80+70)*5。只是試算，按「照計畫執行」才會存成計畫，不會記帳。</div>

function calcUpd(){ const C=CALC; if(!C) return; const base=calcEval(C.base), vals=C.items.map(it=>calcEval(it.e)), bad=vals.some(v=>Number.isNaN(v))||Number.isNaN(base), tot=vals.reduce((a,v)=>a+(v||0),0), left=(base||0)-tot;

/* ---------- 📒 月結表：像 Excel，項目一列、每個月一欄，最後是餘額和存款 ---------- */

function ledgerMonth(M){ const cur=today().slice(0,7), rows={}, st={}, meta={}, add=(sec,name,v,done,m)=>{ const k=sec+'|'+name; rows[k]=(rows[k]||0)+v; st[k]=st[k]===undefined?done:(st[k]&&done); (meta[k]=meta[k]||[]).push(m); };

    else add('out',/^cc-/.test(e.k||'')?'信用卡繳款':e.name,-e.amt,e.st==='done',/^cc-/.test(e.k||'')?{t:'card',k:e.k}:{t:'rec',k:e.k}); });

  if(S.otEst[M]!==undefined&&!monthEvents(M).some(e=>e.ot)) add('in','加班費',S.otEst[M],false,{t:'ot'});

  const liv=livingSpent(M), bud=livBudget(M), livV=M<cur?liv:Math.max(liv,bud); if(livV||S.livMonth[M]!==undefined) add('out','生活費',-livV,M<cur,{t:'liv'});

/* 這個月起之後都改：把固定收支拆成兩段 */
function recSplitFrom(x,ym,v){ Object.keys(S.recurAmt).forEach(k=>{ const [id,m]=k.split('|'); if(id===x.id&&m>=ym) delete S.recurAmt[k]; });
  if(x.start>=ym){ x.amount=v; return; }
  const nx=Object.assign({},x,{id:newId(),start:ym,amount:v}); x.end=ymAdd(ym,-1);
  ['recurDone','recurMove','att'].forEach(f=>Object.keys(S[f]).forEach(k=>{ const [id,m]=k.split('|'); if(id===x.id&&m>=ym){ S[f][nx.id+'|'+m]=S[f][k]; delete S[f][k]; } }));
  R.forEach(r=>{ if(r.recur===x.id&&r.recurMonth>=ym) r.recur=nx.id; });
  S.recurring.push(nx); }

/* ---------- 貸款攤還（本息平均攤還）＋提前清償 ---------- */
function rateDerive(){ const k=Number($('#rvK').value), P=Number($('#rvP').value), I=Number($('#rvI').value), n=Number($('#rvN').value), A=P+I;
  if(!(k>0&&P>0&&I>0&&n>=k)){ $('#rvOut').textContent='請把四格都填好（總期數要大於等於第幾期）'; return; }
  const x=1-I/A, i=Math.pow(x,-1/(n-k+1))-1, r=Math.round(i*12*100*100)/100; $('#elRate').value=r; if(!$('#elMon').value) $('#elMon').value=A;
  $('#rvOut').innerHTML=`<b style="color:var(--ok)">年利率約 ${r}%</b>，已填到上面（每月 ${money(A)}）`; }
function debtStartMonth(d){ const cur=today().slice(0,7), xs=S.recurring.filter(x=>x.kind==='debt'&&x.debt===d.id); const due=xs.some(x=>recurOn(x,cur)&&S.recurDone[x.id+'|'+cur]!=='done'&&!S.recurMove[x.id+'|'+cur]); return due?cur:ymAdd(cur,1); }
function amortInfo(d){ const rem=debtBal()[d.id]||0, A=d.monthly, i=(d.rate||0)/1200; if(!(rem>0&&A>0)) return null; const m=Math.max(1,Math.round(rem/A)), n=Math.max(m,Math.round((d.orig||rem)/A));
  const principal=i>0?A*(1-Math.pow(1+i,-m))/i:rem; return {A,i,m,n,k0:n-m,principal,start:debtStartMonth(d)}; }
function amortRun(B,A,i,start,extra){ /* extra: {ym:amount}；回傳每期資料 */ const rows=[]; let ym=start, g=0;
  while(B>0.5&&g++<600){ if(extra&&extra[ym]){ B=Math.max(0,B-extra[ym]); if(B<=0.5){ rows.push({ym,pay:0,int:0,prin:0,bal:0,extra:extra[ym]}); break; } }
    const int=B*i, pay=Math.min(A,B+int), prin=pay-int; B=B-prin; rows.push({ym,pay,int,prin,bal:Math.max(0,B),extra:extra&&extra[ym]||0}); ym=ymAdd(ym,1); }
  return rows; }
function amortShow(id){ const d=debtById(id); if(!d) return; const a=amortInfo(d); if(!a) return; const m=document.createElement('div'); m.className='modal';
  const draw=()=>{ const ey=Number(($('#apY')||{}).value)||0, em=($('#apM')||{}).value||a.start, ex=ey>0?{[em]:ey}:null;
    const base=amortRun(a.principal,a.A,a.i,a.start,null), sc=ex?amortRun(a.principal,a.A,a.i,a.start,ex):null;
    const tI=r=>r.reduce((x,y)=>x+y.int,0), last=r=>r.length?r[r.length-1].ym:'—';
    const past=[]; if(a.i>0){ let B=a.A*(1-Math.pow(1+a.i,-a.n))/a.i; for(let k=1;k<=a.k0;k++){ const int=B*a.i, prin=a.A-int; B-=prin; past.push({k,ym:ymAdd(a.start,k-a.k0-1),pay:a.A,int,prin,bal:B}); } }
    const rows=(sc||base), body=[...past.map(r=>`<tr class="pastr"><td>${r.k}</td><td>${ymLabel(r.ym)}</td><td>${money(Math.round(r.prin))}</td><td>${money(Math.round(r.int))}</td><td>${money(r.pay)}</td><td>${money(Math.round(r.bal))}</td></tr>`),
      ...rows.map((r,j)=>`<tr class="${r.ym===today().slice(0,7)?'curm':''}"><td>${a.k0+j+1}</td><td>${ymLabel(r.ym)}${r.extra?` <span class="pill moved">提前還 ${money(r.extra)}</span>`:''}</td><td>${money(Math.round(r.prin))}</td><td>${money(Math.round(r.int))}</td><td>${money(Math.round(r.pay))}</td><td>${money(Math.round(r.bal))}</td></tr>`)].join('');
    $('#apSum').innerHTML=`<div class="kpis" style="margin:8px 0">${kpi('剩餘本金',money(Math.round(a.principal)),`年利率 ${d.rate||0}%`,'⚖️','var(--brand)','var(--brand-soft)')}${kpi('之後還要付的利息',money(Math.round(tI(base))),`每月 ${money(a.A)}・剩 ${base.length} 期`,'📈','var(--bad)','var(--bad-soft)')}${kpi('預計還清',ymLabel(last(base)),`共 ${a.n} 期・已繳 ${a.k0} 期`,'⏰','var(--ok)','var(--ok-soft)')}</div>
      ${sc?`<div class="notice" style="background:var(--ok-soft);color:#1f5f3f">💡 ${ymLabel(em)}提前還 <b>${money(ey)}</b>：提早 <b>${base.length-sc.length} 個月</b>還清（${ymLabel(last(sc))}），<b>省下利息約 ${money(Math.round(tI(base)-tI(sc)))}</b>。月付一樣是 ${money(a.A)}。</div>`:''}`;
    $('#apTb').innerHTML=`<table class="ledger amort"><tr><th>期數</th><th>月份</th><th>本金</th><th>利息</th><th>月付</th><th>剩餘本金</th></tr>${body}</table>`; };
  m.innerHTML=`<div class="box" style="max-width:720px;max-height:92vh;overflow:auto"><div class="row"><h2 style="margin:0;font-size:18px">📄 ${esc(d.name)} 攤還表</h2><span class="spacer"></span><button onclick="this.closest('.modal').remove()">關閉</button></div>

let SIMN=24;
function simDefaults(){ const g=S.goals.find(x=>!x.done&&/機車/.test(x.name)); return {more:0,ot:0,pay:{debt:'',ym:ymAdd(today().slice(0,7),1),amt:0},buy:{on:!!g,name:g?g.name:'機車',ym:g&&g.deadline?g.deadline.slice(0,7):ymAdd(today().slice(0,7),6),down:g?g.target:70000,inst:0,months:0,run:0}}; }
function simCfg(){ const d=simDefaults(), c=S.sim||{}; return {more:+c.more||0,ot:+c.ot||0,pay:Object.assign({},d.pay,c.pay||{}),buy:Object.assign({},d.buy,c.buy||{})}; }
function simSeries(n,cfg){ const cur=today().slice(0,7), months=[...Array(n)].map((_,i)=>ymAdd(cur,i)), now=moneyAt().all;
  /* 基準：跟月結表一樣 */ const base=[], sc=[], notes=[]; let b=null, s2=null;
  /* 提前還款：用攤還（有利率）或剩餘期數（沒利率）算之後少繳的月付 */
  let payDelta={}; const D=cfg.pay.debt&&debtById(cfg.pay.debt);
  if(D&&cfg.pay.amt>0&&D.monthly>0){ const a=amortInfo(D); if(a){ const br=amortRun(a.principal,a.A,a.i,a.start,null), sr=amortRun(a.principal,a.A,a.i,a.start,{[cfg.pay.ym]:cfg.pay.amt});
      const bm={},sm={}; br.forEach(r=>bm[r.ym]=r.pay); sr.forEach(r=>sm[r.ym]=r.pay+(r.extra||0)); months.forEach(M=>{ payDelta[M]=(bm[M]||0)-(sm[M]||0); });
      notes.push(`${esc(D.name)}：${ymLabel(cfg.pay.ym)}提前還 ${money(cfg.pay.amt)} → ${ymLabel(br[br.length-1].ym)} 變成 <b>${ymLabel(sr[sr.length-1].ym)}</b> 還清，提早 ${br.length-sr.length} 個月${a.i>0?`，省利息約 ${money(Math.round(br.reduce((x,y)=>x+y.int,0)-sr.reduce((x,y)=>x+y.int,0)))}`:''}`); } }
  months.forEach((M,i)=>{ const L=ledgerMonth(M);
    if(i===0){ const pend=Object.entries(L.rows).filter(([k])=>!L.st[k]).reduce((a,[k,v])=>a+(k==='out|生活費'?-Math.max(0,L.bud-L.liv):v),0); b=now+pend; s2=b; }
    else { b+=L.net; s2+=L.net; }
    let adj=(i>0?cfg.more+cfg.ot:0)+(payDelta[M]||0);
    const B=cfg.buy; if(B.on){ if(M===B.ym) adj-=B.down; const k=(B.ym<=M)?ymDiff(B.ym,M):-1; if(B.months>0&&k>=0&&k<B.months) adj-=B.inst; if(B.run>0&&k>=0) adj-=B.run; }
    s2+=adj; base.push(b); sc.push(s2); });
  if(cfg.buy.on) notes.push(`${esc(cfg.buy.name)}：${ymLabel(cfg.buy.ym)}付 ${money(cfg.buy.down)}${cfg.buy.months?`，之後 ${cfg.buy.months} 期每月 ${money(cfg.buy.inst)}`:''}${cfg.buy.run?`，每月養${esc(cfg.buy.name)} ${money(cfg.buy.run)}`:''}`);
  if(cfg.more) notes.push(`每月多存（少花）${money(cfg.more)}`); if(cfg.ot) notes.push(`每月加班費 ${money(cfg.ot)}`);
  return {months,base,sc,notes}; }
function simChart(r){ const W=760,H=240,P={l:62,r:16,t:16,b:30}, all=[...r.base,...r.sc,0], mn=Math.min(...all), mx=Math.max(...all), span=(mx-mn)||1, n=r.months.length;

  const ticks=[mn,mn+span/2,mx].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${bmS(Math.round(v))}</text>`).join('');

  const dots=r.months.map((M,i)=>`<g><circle cx="${X(i)}" cy="${Y(r.sc[i])}" r="7" fill="transparent"/><circle cx="${X(i)}" cy="${Y(r.sc[i])}" r="3" fill="var(--brand-d)" stroke="#fff" stroke-width="1.5"/><title>${ymLabel(M)}\n模擬後：${bm(Math.round(r.sc[i]))}\n照目前：${bm(Math.round(r.base[i]))}</title></g>`).join('');

    if(!from) return skip('月薪',r.n,'日期看不懂'); if(!(amt>0)) return skip('月薪',r.n,'月薪要大於 0'); if(S.ot.bases.some(b=>b.from===from&&b.amt===Math.round(amt))) return;

function planCount(p){ return p.accts.length+p.debts.length+p.recur.length+p.recs.length+p.ot.length+p.bases.length+p.allow.length+(p.bonusFrom?1:0)+(p.budget!==null?1:0)+Object.keys(p.bcats||{}).length+p.goals.length; }
function applyPlan(p){ S.accounts.push(...p.accts); S.debts.push(...p.debts); S.recurring.push(...p.recur); R.push(...p.recs); S.ot.days.push(...p.ot); S.ot.bases.push(...p.bases); S.ot.allow.push(...p.allow); if(p.bonusFrom) S.ot.bonusFrom=p.bonusFrom; if(p.budget!==null) S.budget.living=p.budget; Object.assign(S.budget.cats,p.bcats||{}); S.goals.push(...p.goals); S.ot.bases.sort((a,b)=>a.from.localeCompare(b.from)); if(p.accts.length) S.acctInitDone=true; }
function cleanState(){ return fixS(Object.assign(defaultS(),{phrases:S.phrases,rules:S.rules,people:S.people,catIcons:S.catIcons,bg:S.bg,recentN:S.recentN,payslips:S.payslips,lastBackup:S.lastBackup})); }
function fullPlan(){ if(!IMPORT_SRC) return null; const sv=[S,R]; try{ S=cleanState(); R=[]; return buildPlan(IMPORT_SRC.X,IMPORT_SRC.wb); }finally{ S=sv[0]; R=sv[1]; } }

async function importExcel(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return;
  if(/\.json$/i.test(f.name)||/json/.test(f.type)){ restoreFile(f); return; }
  let X; try{ X=await loadXLSX(); }catch(e){ alert('需要網路才能讀 Excel，請連上網路再試一次。'); return; }
  let wb; try{ wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true}); }catch(e){ alert('讀不出這個檔案，請確認是 Excel（.xlsx）檔。'); return; }
  IMPORT_SRC={X,wb}; const plan=buildPlan(X,wb);
  PENDING_IMPORT=plan; showImportPreview(plan);
}

       <button ${S.bg.url?'':'disabled'} onclick="resetBg()">換回預設</button></div>
     ${S.bg.url?`<div class="grid" style="margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
       <div><label class="f">背景淡化 <b id="veilV">${Math.round((S.bg.veil??.5)*100)}%</b>（越低，背景越清楚）</label><input type="range" min="0" max="90" step="5" value="${Math.round((S.bg.veil??.5)*100)}" oninput="bgTune('veil',this.value,false)" onchange="bgTune('veil',this.value,true)" style="width:100%" aria-label="背景淡化"></div>
       <div><label class="f">卡片透明度 <b id="cardV">${Math.min(70,Math.round((1-(S.bg.cardA??1))*100))}%</b>（越高，越看得到背景）</label><input type="range" min="0" max="70" step="5" value="${Math.min(70,Math.round((1-(S.bg.cardA??1))*100))}" oninput="bgTune('card',this.value,false)" onchange="bgTune('card',this.value,true)" style="width:100%" aria-label="卡片透明度"></div></div>`:''}
     <div class="muted small" style="margin-top:6px">只放一張，上傳後會自動縮小。圖存在這個瀏覽器裡，不會上傳。${S.bg.url?'拉桿拉到看得清楚背景、字也還讀得到就好。':'目前使用預設的鯨魚橫幅。'}</div></div>
   <div class="card"><h2>📅 每月固定收支</h2>${foldBox('recur',`共 ${S.recurring.length} 筆・收入 ${S.recurring.filter(x=>x.kind==='income').length}・支出 ${S.recurring.filter(x=>x.kind==='expense').length}・還款 ${S.recurring.filter(x=>x.kind==='debt').length}`,recurListHTML())}
     <details style="margin-top:10px"><summary>➕ 新增固定收支</summary><div style="margin-top:8px">${recurFormHTML('nr')}</div><button class="primary" style="margin-top:10px" onclick="addRecur()">新增</button></details>
     <div class="muted small" style="margin-top:8px">支出和還款會出現在「繳費狀態」，按「完成」才會真的記帳，也可以「延後」到下個月；收入（例如薪水）到了日期會在首頁提醒你按「記好」。</div></div>
   <div class="card"><h2>📥 匯入 Excel</h2>
     <div class="small" style="margin-bottom:8px">1. 先下載範本，照範本的欄位把資料貼進去（不用的工作表可以留空）　2. 選檔案匯入，會先給你預覽，按「確定匯入」才會加進去</div>
     <div class="row"><button onclick="downloadTemplate()">下載範本</button><button class="primary" onclick="$('#xlsFile').click()">選擇檔案匯入（Excel 或備份檔）</button><input type="file" id="xlsFile" accept=".xlsx,.xls,.csv,.json,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden onchange="importExcel(this)"></div>
     <div class="muted small" style="margin-top:8px">匯入是「加進去」，不會蓋掉原本的資料。讀檔需要網路（會從 cdnjs 載入 SheetJS 工具），但檔案只在這台裝置上讀，<b>不會上傳</b>。日期可以寫民國（115.11.10）或西元（2026/11/10）。</div></div>
   <div class="card"><h2>📦 資料</h2><div class="row"><button onclick="go2('trash')">最近刪除（${trashN}）</button><button onclick="exportCSV()">匯出 CSV（Excel 可開）</button><button onclick="backup()">下載備份</button><button onclick="$('#restoreFile').click()">從備份還原</button><input type="file" id="restoreFile" accept=".json,application/json" hidden onchange="restore(this)"></div></div>
   <div class="card"><details id="dataHelp"><summary>資料保存方式與限制（請務必閱讀）</summary><ul class="small">
     <li><b>圖片（薪資條、繳費截圖）</b>存在瀏覽器的大容量空間 IndexedDB，一樣<b>只在這台電腦、這個瀏覽器</b>，不會上傳。可放的數量依電腦剩餘空間而定，通常可放上千張。目前圖片約用了 <b id="phMB">…</b>。</li>
     <li>「下載備份」會把圖片一起放進備份檔，所以檔案會比較大。<b>薪資條是很私密的資料，備份檔不要傳給別人。</b></li>
     <li><b>本機儲存 · 僅在此裝置此瀏覽器有效 · 可匯出備份。</b>資料存在這台裝置、這個瀏覽器裡，不會上傳，也不會同步。</li>
     <li>換瀏覽器、換手機、使用無痕視窗，都看不到原本的資料。清除瀏覽資料會讓紀錄全部消失，且無法復原。</li>
     <li>請定期按「下載備份」，把備份檔放在這台裝置以外的地方（雲端硬碟或寄給自己）。</li>
     <li>「最近刪除」保留 30 天，超過的會在「下次打開本工具時」永久刪除（不是準時自動刪除）。</li>
     <li>自動判斷是用關鍵字規則，<b>不是 AI</b>，也不會上網。判斷錯的時候請自己改分類。</li>
     <li>帳戶名稱請<b>只寫暱稱</b>（例如「台新」），不要寫帳號、卡號或密碼。帳戶餘額是依照你記的帳算出來的，跟銀行實際金額有落差時，請用「校正餘額」。</li>
     <li>打「悠遊卡」會被當成<b>交通</b>分類；用悠遊卡付款請用付款方式下拉選單選。打「悠遊卡加值500」則會記成從現金轉到悠遊卡。</li></ul></details></div>`;
  phUsage(); setLookPreview();
}
function delRule(i){ if(!confirm(`確定刪除「${S.rules[i].word}」這個常用詞嗎？`)) return; S.rules.splice(i,1); persist(); renderOpts(); }
function addPerson(){ const v=$('#pIn').value.trim(); if(!v) return; if(S.people.includes(v)){flash('已經有這個對象了');return;} S.people.push(v); persist(); renderOpts(); }
function delPerson(i){ if(!confirm(`確定刪除對象「${S.people[i]}」嗎？已經記好的紀錄不會被改動。`)) return; S.people.splice(i,1); persist(); renderOpts(); }
function bgTune(k,v,save){ v=Number(v); if(k==='veil'){ S.bg.veil=v/100; const e=$('#veilV'); if(e) e.textContent=v+'%'; } else { S.bg.cardA=1-v/100; const e=$('#cardV'); if(e) e.textContent=v+'%'; } applyBg(); if(save) persist(); }
function setLookPreview(){ try{ fontPreviewLink(); }catch(e){} }
function setLook(k,v){ S.look[k]=v; persist(); applyLook(); renderSettings(); flash(k==='theme'?`換成「${THEMES[v].n}」和${THEME_PET[v]} ✦`:`字體換成「${FONTS[v].n}」✦`); }
function uploadBg(inp){
  const f=inp.files[0]; inp.value=''; if(!f) return;
  if(!/^image\//.test(f.type)){ alert('請上傳圖檔'); return; }
  const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const s=Math.min(1,1200/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); const old=S.bg; S.bg={url:c.toDataURL('image/jpeg',0.7),mode:old.mode||'both',veil:old.veil??.3,cardA:old.cardA??.85};
    if(!persist()){S.bg=old;return;} applyBg(); renderSettings(); flash('背景圖換好了 ✦ 可以用下面的拉桿調透明度'); };
    img.onerror=()=>alert('這張圖讀不出來，請換一張'); img.src=fr.result; }; fr.readAsDataURL(f);
}
function resetBg(){ if(!confirm('要換回預設的鯨魚橫幅嗎？')) return; S.bg={url:'',mode:'both'}; persist(); applyBg(); renderSettings(); }

/* ---------- 最近刪除 ---------- */
let selT=new Set();
function trashList(){return R.filter(r=>r.deleted).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));}
function daysBetween(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000);}
function renderTrash(){
  page='trash'; nav(); const rs=trashList(), n=selT.size;
  $('#app').innerHTML=`<div class="row" style="margin-bottom:12px"><button onclick="selT=new Set();go2('settings')">← 返回設定</button><h2 style="margin:0 8px;font-size:18px">最近刪除</h2></div>
   <div class="card"><div class="notice small">已刪除超過 30 天的紀錄，會在下次打開本工具時永久刪除。</div>
    <div class="row" style="margin:8px 0"><button onclick="selT=new Set(trashList().map(r=>r.id));renderTrash()" ${rs.length?'':'disabled'}>全選</button><button onclick="selT=new Set();renderTrash()" ${n?'':'disabled'}>全部不選</button>
     <button id="trR" onclick="trashRestore()" ${n?'':'disabled'}>還原</button><button id="trP" class="danger" onclick="trashPerm()" ${n?'':'disabled'}>永久刪除</button><span class="muted small">${n?'已勾選 '+n+' 筆':'請先勾選'}</span></div>
    ${rs.length?rs.map(r=>{const m=recMeta(r); return `<div class="rec" style="cursor:default"><input type="checkbox" style="width:auto" data-id="${r.id}" ${selT.has(r.id)?'checked':''} onchange="this.checked?selT.add('${r.id}'):selT.delete('${r.id}');renderTrash()"><div class="ic">${m.icon}</div>
      <div class="mid"><div class="nm">${esc(m.name)}${r.who?`<span class="tag">${esc(r.who)}</span>`:''}</div><div class="sb">${fmtMD(r.date)}・${m.sub}・${fmtFull(r.deletedAt)} 刪除・剩 ${Math.max(30-daysBetween(r.deletedAt,today()),0)} 天</div></div>
      <div class="am ${m.cls}">${m.sign}${money(r.amount)}</div></div>`;}).join(''):'<div class="empty">目前沒有刪除的紀錄</div>'}</div>`;
}
function trashRestore(){ const ids=[...selT]; if(!ids.length) return; const oR=JSON.stringify(R); let fixed=0;
  R.forEach(r=>{ if(ids.includes(r.id)&&r.deleted){ r.deleted=false; delete r.deletedAt;
    let f=false; ['acct','from','to'].forEach(k=>{ if(r[k]&&!acctById(r[k])){ r[k]='cash'; f=true; } }); if(f) fixed++;
    if(r.type==='save'&&!goalById(r.goal)){ const D=r.goalDef||{}; S.goals.push(fixS({accounts:S.accounts,goals:[Object.assign({id:r.goal,name:r.goalName||'未命名目標',target:0,mode:'manual',acct:'',deadline:''},D,{done:false,doneAt:''})]}).goals[0]); }
    if(r.type==='debt'&&!debtById(r.debt)&&r.debtDef){ S.debts.push(fixS({accounts:S.accounts,debts:[Object.assign({id:r.debt},r.debtDef)]}).debts[0]); }
    if(r.type==='debt'&&!debtById(r.debt)) S.debts.push({id:r.debt,name:r.debtName||'未命名',kind:r.debtKind==='loan'?'loan':'person',init:0,monthly:0,dueDay:0,payAcct:''}); } });
  if(!persist()){R=JSON.parse(oR);return;} selT=new Set(); renderTrash();
  if(fixed) alert(`已還原。其中 ${fixed} 筆原本的帳戶已經刪除，已自動改成「現金」。`); else flash('已還原 ✦'); }
function trashPerm(){ const n=selT.size; if(!n) return; if(!confirm(`確定要永久刪除選取的 ${n} 筆嗎？永久刪除後無法復原。`)) return;
  const old=R; R=R.filter(r=>!selT.has(r.id)); if(!persist()){R=old;return;} selT=new Set(); renderTrash(); flash('已永久刪除'); }
function purgeExpired(){ const old=R, n=R.length; R=R.filter(r=>!(r.deleted&&r.deletedAt&&today()>addDays(r.deletedAt,30))); if(R.length!==n) persist(); }

/* ---------- 匯出、備份、還原 ---------- */
function exportCSV(){
  const rs=sortRecs(live()).reverse(); if(!rs.length){alert('目前沒有紀錄可匯出。');return;}
  const head=['日期','類型','分類','項目','對象','帳戶','轉出帳戶','轉入帳戶','金額'];
  const TL={income:'收入',expense:'支出',transfer:'轉帳',adjust:'校正',debt:'負債',save:'儲蓄（不算收支）'};
  const rows=rs.map(r=>[r.date,r.type==='debt'?(r.exp?'負債（還款・算支出）':'負債（借還）'):(TL[r.type]||''),r.category,(r.type==='debt'||r.type==='save')?recMeta(r).name:r.item,r.who||'',r.type!=='transfer'?acctName(r.acct):'',r.type==='transfer'?acctName(r.from):'',r.type==='transfer'?acctName(r.to):'',r.type==='adjust'&&r.sign<0?-r.amount:r.amount]);
  const csv=[head,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('﻿'+csv,`xiaozhang_${today()}.csv`,'text/csv;charset=utf-8');
}
async function backup(){ const photos={}; let miss=0; for(const id of allPhIds()){ try{ const u=await phGet(id); if(u) photos[id]=u; else miss++; }catch(e){ miss++; } }
  S.lastBackup=today(); persist(); if(page==='home') renderHome();
  download(JSON.stringify({app:'casevoraXiaozhang',version:2,exportedAt:new Date().toISOString(),records:live(),settings:S,photos},null,1),`xiaozhang_backup_${today()}.json`,'application/json');
  if(miss) alert(`有 ${miss} 張圖片讀不到，沒有放進備份。`); }
function restore(inp){ const f=inp.files[0]; inp.value=''; if(f) restoreFile(f); }
function restoreFile(f){ const fr=new FileReader();
  fr.onload=async()=>{ let d; try{ d=JSON.parse(fr.result); if(!d||d.app!=='casevoraXiaozhang'||!Array.isArray(d.records)) throw 0; }catch(e){ alert('無法讀取：這不是本工具的備份檔。'); return; }
    const bad=d.records.some(r=>!r||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')||!(Number(r.amount)>0)||!['income','expense','transfer','adjust','debt','save'].includes(r.type)||(r.type==='save'&&!/^[\w-]{1,40}$/.test(String(r.goal)))||(r.type==='debt'&&(!DEBT_OP[r.op]||!/^[\w-]{1,40}$/.test(String(r.debt))))); if(bad){ alert('無法還原：備份檔內有格式不正確的紀錄。'); return; }
    const photos={}; if(d.photos&&typeof d.photos==='object') Object.entries(d.photos).forEach(([id,u])=>{ if(/^[\w-]{1,60}$/.test(id)&&typeof u==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(u)) photos[id]=u; });
    if(!confirm(`備份檔內有 ${d.records.length} 筆紀錄${Object.keys(photos).length?`、${Object.keys(photos).length} 張圖片`:''}。\n還原會「取代」目前瀏覽器中的 ${live().length} 筆紀錄和設定，目前「最近刪除」裡的 ${trashList().length} 筆也會一併被取代，確定嗎？`)) return;
    const oR=R,oS=S; R=d.records.map(r=>({id:/^[\w-]{1,40}$/.test(String(r.id))?String(r.id):newId(),type:r.type,amount:Number(r.amount),item:String(r.item||''),category:r.category||(r.type==='income'?'其他收入':r.type==='transfer'?'轉帳':r.type==='adjust'?'校正':'其他'),date:r.date,who:r.who||'',icon:r.icon||'',createdAt:r.createdAt||'',
      ...(r.type==='transfer'?{from:String(r.from||'cash'),to:String(r.to||'cash')}:{acct:String(r.acct||'cash')}),...(r.type==='adjust'?{sign:Number(r.sign)<0?-1:1}:{}),
      ...(r.type==='debt'?{op:r.op,debt:String(r.debt),debtName:String(r.debtName||'').slice(0,20),debtKind:r.debtKind==='loan'?'loan':'person',exp:r.debtKind==='loan'&&r.op==='pay'}:{}),
      ...(r.type==='save'?{acct:String(r.acct||''),goal:String(r.goal),goalName:String(r.goalName||'').slice(0,20)}:{})}));
    S=fixS(Object.assign(defaultS(),d.settings||{}));
    R.forEach(r=>{ if(r.type==='save'&&!S.goals.some(x=>x.id===r.goal)) S.goals.push({id:r.goal,name:r.goalName||'未命名目標',target:0,mode:'manual',acct:'',deadline:'',done:false,doneAt:''}); });
    R.forEach(r=>{ if(r.type==='debt'&&!S.debts.some(x=>x.id===r.debt)) S.debts.push({id:r.debt,name:r.debtName||'未命名',kind:r.debtKind,init:0,monthly:0,dueDay:0,payAcct:''}); }); if(!persist()){R=oR;S=oS;return;} let pbad=0; for(const [id,u] of Object.entries(photos)){ try{ await phPut(u,id); }catch(e){ pbad++; } } if(pbad) alert(`有 ${pbad} 張圖片還原失敗（可能是無痕視窗或空間不足）。`); applyLook(); applyBg(); flash('還原完成 ✦'); go2('home'); };
  fr.readAsText(f);
}
window.addEventListener('beforeunload',e=>{ if(dirty){e.preventDefault();e.returnValue='';} });
(function init(){
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){alert('注意：目前瀏覽器無法保存資料（可能是無痕模式或已封鎖網站資料），關閉後資料會遺失。');}
  purgeExpired(); applyLook(); applyBg(); renderHome();
})();
document.addEventListener('click',e=>{});
window.go2=go2;
const _go2=go2; window.go2=function(k){ if(k==='trash'){ selT=new Set(); renderTrash(); window.scrollTo(0,0); return; } _go2(k); };
</script>
</body>
