<style>
:root{
  --bg:#f1f8fb; --card:#ffffff; --ink:#1f3a4a; --muted:#5d7a89; --line:#d3e8f0;
  --brand:#1e94c2; --brand-d:#16769b; --brand-soft:#dcf1f8; --accent:#f2b84b;
  --bg-rgb:241,248,251; --card-rgb:255,255,255; --cardA:1; --veil:.5; --shadow:27,127,163;
  --tint:var(--tint); --hd1:#7fd6ec; --hd2:#2a90cf; --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --ok:#3f9d71; --ok-soft:#e5f5ec; --bad:#d9534f; --bad-soft:#fdecea; --info:#8a6bd1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:var(--fw,400);font-size:16px;line-height:1.6;background-attachment:fixed;background-size:cover;background-position:center}
/* 背景圖：固定在螢幕上的一層（手機也不會跟著捲、不會被拉扯） */
body.bgpage::before,body.bgboth::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(rgba(var(--bg-rgb),var(--veilX)),rgba(var(--bg-rgb),var(--veilX))),var(--bgimg) center/cover no-repeat}
body.bgpage{--veilX:calc(var(--veil) + .3)} body.bgboth{--veilX:var(--veil)}
body.bgpage,body.bgboth{background-color:transparent}
/* 滿版：橫幅透明，跟整頁同一張背景接在一起 */
header.see{background:transparent;box-shadow:none}
header.see .t .tt{background:rgba(var(--card-rgb),.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header{position:relative;overflow:hidden;min-height:150px;background:linear-gradient(135deg,var(--hd1),var(--hd2));border-radius:0 0 28px 28px;box-shadow:0 4px 14px rgba(var(--shadow),.18)}
header.custom{background-size:cover;background-position:center}
header svg{position:absolute;inset:0;width:100%;height:100%}
header.custom svg{display:none}
header .t{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:26px 20px 22px}
header .t .tt{display:inline-block;border-radius:18px;padding:2px 2px}
header.custom .t .tt{background:rgba(255,255,255,.75);padding:8px 14px}
header h1{margin:0;font-size:30px;font-weight:800;color:var(--hdink,#fff);text-shadow:0 2px 0 rgba(var(--shadow),.5);letter-spacing:1px}
header.custom h1{color:var(--brand-d);text-shadow:none}
header .sub{font-size:13px;color:var(--hdink,#fff);opacity:.95;text-shadow:0 1px 0 rgba(var(--shadow),.45)}
header .sub .lead{font-size:16px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 0 rgba(var(--shadow),.75),0 0 6px rgba(var(--shadow),.45)}
header .sub .note{display:inline-block;margin-top:6px;background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;font-weight:700;border-radius:999px;padding:2px 12px;box-shadow:0 1px 4px rgba(var(--shadow),.2)}
header.custom .sub{color:var(--ink);text-shadow:none}
main{max-width:760px;margin:0 auto;padding:6px 16px 90px}
nav{display:flex;gap:8px;overflow-x:auto;margin:0;padding:4px 0 6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:rgba(var(--card-rgb),var(--cardA));border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(var(--shadow),.07)}
.card h2{margin:0 0 10px;font-size:17px}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px}
button:hover{background:var(--brand-soft)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.primary:hover{background:var(--brand-d)}
button.danger{color:var(--bad);border-color:#efb9b5}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=month],input[type=number],select,textarea{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.muted{color:var(--muted)} .small{font-size:14px}
.quick{display:flex;gap:8px}
.quick input{font-size:18px;padding:13px 16px;border-radius:16px}
.quick button{padding:0 22px;font-size:17px;border-radius:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:18px;padding:12px 8px;text-align:center;background:var(--brand-soft)}
.stat .n{font-size:clamp(14px,4.6vw,22px);font-weight:800;line-height:1.2;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:13px;font-weight:700;color:var(--muted)}
.stat.in .n{color:var(--ok)} .stat.out .n{color:var(--bad)}
.stat.in{background:var(--ok-soft)} .stat.out{background:var(--bad-soft)}
.rec{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.rec:last-child{border-bottom:0}
.rec .ic{font-size:26px;width:38px;text-align:center;flex:none}
.rec .mid{flex:1;min-width:0}
.rec .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .sb{font-size:13px;color:var(--muted)}
.rec .am{font-weight:800;white-space:nowrap}
.rec .am.in{color:var(--ok)} .rec .am.out{color:var(--bad)} .rec .am.mv{color:var(--info)}
.paysel{display:flex;gap:8px;align-items:center;margin-top:8px}
.paysel select{width:auto;max-width:60%;padding:6px 10px}
.acc{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.acc:last-child{border-bottom:0}
.acc .ic{font-size:26px;width:38px;text-align:center;flex:none}
.acc .mid{flex:1;min-width:120px}
.acc .bal{font-weight:800;font-size:18px;white-space:nowrap}
.acc .ops{display:flex;gap:6px;width:100%;justify-content:flex-end}
.acc .ops button{padding:4px 10px;font-size:13px}
.total{text-align:center;padding:6px 0}
.total .n{font-size:clamp(22px,7vw,30px);font-weight:800}
.cmp{display:block;font-size:11px;font-weight:700;margin-top:2px}
.bs{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.bs.sum{font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand-d);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700;margin-left:4px}
.ask{border:2px dashed var(--brand);background:var(--tint)}
.empty{text-align:center;padding:26px;color:var(--muted)}
.bar{display:grid;grid-template-columns:90px 1fr 76px;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.bar .b{background:var(--brand-soft);border-radius:999px;height:14px}
.bar .b i{display:block;height:14px;background:var(--brand);border-radius:999px;min-width:3px}
.bar .v{text-align:right;font-weight:700}
.dayh{display:flex;justify-content:space-between;font-weight:800;margin:10px 0 2px;color:var(--brand-d)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 16px}
.savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 首頁儀表板：手機照原本順序一欄；電腦兩欄 */
.dash{display:flex;flex-direction:column}
.dash .col{display:contents}
.dash>.kpis{margin-bottom:14px}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}
.desk{display:none}
.card h2 .sub{font-size:12px;font-weight:700;color:var(--muted);margin-left:6px}
@media (min-width:900px){
  .dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 18px;align-items:start}
  .dash .col{display:block}
  .dash>.kpis{grid-column:1/-1;order:0}
  .desk{display:block}
  .stat{padding:16px 8px}
  .stat .n{font-size:clamp(16px,1.6vw,22px)}
  .savebar .in{max-width:1180px}
}
.dirty{color:#b45309;font-weight:700;font-size:14px}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:50vh;overflow:auto}
.icgrid button{font-size:24px;padding:4px}
.modal{position:fixed;inset:0;background:rgba(74,59,59,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:22px;padding:18px;max-width:440px;width:100%}
.tabs button{border-radius:999px;padding:4px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{color:var(--muted)}
.notice{border-radius:14px;padding:10px 14px;font-size:14px;margin:8px 0;background:#fff3e0;color:#7a3d06}
details summary{cursor:pointer;font-weight:700}

/* ===== 版面：左側滿版工具列（參考衛生追蹤），配色維持原本 ===== */
#side{max-width:760px;margin:0 auto;padding:12px 16px 0}
#side .brand,#side .ws,#side .foot{display:none}
nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
.phead{display:block;margin:8px 0 12px}
.phead .ph1{display:flex;align-items:center;gap:10px}
.phead h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
.phead .en{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--brand-d)}
.phead .en:before{content:"";width:22px;height:2px;background:var(--brand)}
.phead .desc{font-size:14px;color:var(--muted);margin-top:2px}
.phead .badge{margin-left:auto;flex:none;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:800;border-radius:999px;padding:3px 12px;white-space:nowrap}
.nbar{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{position:relative;background:rgba(var(--card-rgb),var(--cardA));border:2px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(var(--shadow),.06);min-width:0}
.kpi .t{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:clamp(18px,5vw,26px);font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.kpi .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .i{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--cs);color:var(--c)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{border-radius:999px;padding:4px 14px;font-weight:700}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.brow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"n n n a" "s d f f" "x x x x";gap:6px 10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.bhead{display:none}
.brow .cn{grid-area:n;min-width:0}.brow .ca{grid-area:a;font-weight:800;text-align:right;white-space:nowrap}.brow .cs{grid-area:s}.brow .cd{grid-area:d;white-space:nowrap}.brow .cf{grid-area:f;min-width:0}.brow .cx{grid-area:x;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.brow .cn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .cn .sb{font-size:13px;color:var(--muted)}
.brow .cx button{padding:4px 12px;font-size:13px}
button.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
button.dark:hover{background:#2f2424}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}.pill.late{background:var(--bad-soft);color:var(--bad)}.pill.wait{background:#eef0f6;color:#5b6478}.pill.today,.pill.moved{background:#fff3e0;color:#b45309}.pill.skip{background:#f1eeee;color:var(--muted)}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle;margin:0 4px 0 0;background:var(--tint)}
.attbtn{padding:2px 10px!important;font-size:12px!important;border-style:dashed!important}
.psgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ps{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;min-width:0}
.ps.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ps .ims{display:flex;gap:6px;flex-wrap:wrap;min-height:96px;align-items:center;justify-content:center;background:var(--tint);border:2px dashed var(--line);border-radius:12px;margin:8px 0;padding:6px;text-align:center}
.ps .ims img{height:86px;max-width:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.pastebox{border:2px dashed var(--brand);background:var(--tint);border-radius:14px;padding:16px;text-align:center;margin:8px 0}
.viewer img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:10px}
.tscroll{overflow-x:auto;max-width:100%}
.ottb th,.ottb td{padding:7px 4px}
@media (max-width:600px){.ottb .hm{display:none}}
.prog{height:10px;border-radius:999px;background:var(--brand-soft);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ok)}
@media (min-width:900px){
  header#hd{display:none}
  #side{position:fixed;top:0;left:0;bottom:0;width:240px;max-width:none;margin:0;padding:0;background:rgba(var(--card-rgb),calc(var(--cardA) + .15));border-right:2px solid var(--line);display:flex;flex-direction:column;z-index:20;overflow-y:auto;box-shadow:4px 0 14px rgba(var(--shadow),.06)}
  #side .brand{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--hd1),var(--hd2));padding:22px 16px}
  #side .brand svg{width:64px;height:60px;flex:none}
  #side .bn{font-size:21px;font-weight:800;color:var(--hdink,#fff);text-shadow:0 2px 0 rgba(var(--shadow),.5);letter-spacing:1px}
  #side .bs2{font-size:12px;font-weight:700;color:var(--hdink,#fff);text-shadow:0 1px 0 rgba(var(--shadow),.7)}
  #side .ws{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;padding:18px 20px 6px}
  nav{flex-direction:column;overflow:visible;padding:0 12px;gap:4px;flex:1}
  nav button{text-align:left;padding:11px 14px;border-radius:14px;border-color:transparent;font-size:15px;background:transparent}
  nav button:not(.on):hover{background:var(--brand-soft)}
  #side .foot{display:block;margin:12px;padding:12px 8px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}
  main{margin-left:240px;max-width:none;padding:26px 32px 60px}
  .phead{margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .phead h1{font-size:28px}
  .nbar{display:flex;align-items:center;gap:12px;background:var(--bad-soft);border:2px solid #f3c2bd;border-left:5px solid var(--bad);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-weight:700;color:#9b2c25;font-size:14px}
  .nbar .lab{background:#a1302a;color:#fff;border-radius:6px;padding:1px 10px;font-size:13px;flex:none}
  .nbar button{margin-left:auto;flex:none;font-size:13px;padding:4px 12px;color:#9b2c25;border-color:#efb9b5}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .kpi{padding:14px 16px}
  .brow{grid-template-columns:minmax(0,2fr) 100px 140px 64px minmax(0,1fr) auto;grid-template-areas:"n a s d f x";gap:6px 14px;padding:12px 6px}
  .brow .ca{text-align:left}
  .brow.bhead{display:grid;font-size:13px;font-weight:700;color:var(--muted);padding:6px}
  .savebar{left:240px}
}

.gcard summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none;font-size:16px;flex-wrap:wrap}
.gcard summary::-webkit-details-marker{display:none}.gcard summary::before{content:'▸';color:var(--brand-d)}.gcard details[open] summary::before{content:'▾'}
.mg-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.mg-step{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card)}
.mg-h{font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.mg-h .no{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;align-items:center;justify-content:center;font-size:12px;flex:none}
.mg-txt p{margin:0 0 6px;font-size:14px}.mg-txt ul{margin:0 0 6px;padding-left:18px;font-size:14px}
.gx{background:var(--tint);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;font-size:12px;max-width:340px}
.gx-c{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px}
.gx-t{font-weight:700;font-size:12px}
.gx-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gx-b{display:inline-flex;align-items:center;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11.5px;white-space:nowrap;color:var(--ink)}
.gx-b.dk{background:var(--ink);color:#fff;border-color:var(--ink)}.gx-b.pr{background:var(--brand);color:#fff;border-color:var(--brand)}.gx-b.rd{color:var(--bad);border-color:#efb9b5}
.gx-b.hl,.gx-in.hl{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.gx-bn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.gx-n{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;flex:none;vertical-align:middle;margin:0 1px}
.gx-in{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);flex:1;min-width:70px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-s{font-size:11px;color:var(--muted)}
.gx-ph{display:inline-block;width:34px;height:26px;border-radius:4px;background:var(--brand-soft);border:1px solid var(--line)}
.gx-dash{border:2px dashed var(--brand);background:var(--tint);color:var(--brand-d);border-radius:8px;padding:5px;text-align:center;font-size:11px}
.gx-k{display:inline-flex;flex-direction:column;flex:1;min-width:90px;padding:4px 8px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;font-weight:800;font-size:14px;background:#fff}.gx-k small{font-weight:700;font-size:10px;color:var(--muted)}
.gx-key{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:#fff;padding:2px 8px;font-weight:800;font-size:12px}
.fsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fstep{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.fstep .fno{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--brand-d);margin-bottom:4px}
.fstep b{font-size:14.5px}.fstep p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.helpbtn{display:none}
@media (min-width:700px){.mg-step{grid-template-columns:260px minmax(0,1fr)}}
@media (min-width:1300px){.mg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.helpbtn{display:flex;align-items:center;gap:10px;margin:0 12px 4px;padding:10px 14px;border-radius:14px;border-color:transparent;background:transparent;font-weight:700;text-align:left}
  .helpbtn span{display:inline-flex;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);align-items:center;justify-content:center;font-size:12px}
  .helpbtn:hover{background:var(--brand-soft)}}

.addph{padding:5px 12px;font-size:13px;border-radius:999px;border-style:dashed;white-space:nowrap}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;background:var(--tint);overflow:hidden}
.chip button{border:0;background:transparent;padding:3px 4px 3px 12px;font-size:13px;font-weight:700;border-radius:0;color:var(--brand-d)}
.chip button:hover{background:var(--brand-soft)}
.chip a{color:var(--muted);text-decoration:none;padding:3px 10px 3px 4px;font-weight:700}
.chip a:hover{color:var(--bad)}
.paysel{flex-wrap:wrap}
.gx-chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;background:var(--tint);color:var(--brand-d);font-weight:700}
.mg-txt ol li{margin-bottom:2px}

.kpi.click{cursor:pointer;transition:transform .1s,box-shadow .1s}
.kpi.click:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(var(--shadow),.15)}
.clickrow{cursor:pointer;border-radius:8px;padding-left:4px;padding-right:4px}
.clickrow:hover{background:var(--brand-soft)}

.impmode .opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.impmode .opt input{margin-top:4px;flex:none}
.impmode .opt:has(input:checked){border-color:var(--brand);background:var(--tint)}
.impmode .opt.danger:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
button.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
button.dangerfill:hover{background:#b93c37}

.pie{display:flex;align-items:center;gap:14px}
.pie svg{width:42%;max-width:180px;flex:none}
.pleg{flex:1;min-width:0}
.pleg .bs.on{background:var(--brand-soft);font-weight:700}
@media (max-width:420px){.pie{flex-direction:column;align-items:stretch}.pie svg{width:60%;margin:0 auto}}

body.glass .card,body.glass .kpi{backdrop-filter:blur(8px) saturate(1.1);-webkit-backdrop-filter:blur(8px) saturate(1.1)}
.fold summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none;padding:6px 0}
.fold summary::-webkit-details-marker{display:none}.fold summary::before{content:'▸';color:var(--brand-d)}.fold[open] summary::before{content:'▾'}
.acc.compact{flex-wrap:nowrap;padding:8px 4px}
.acc.compact .bal{font-size:15px}
.acc.compact .ops{width:auto;flex:none}
@media (max-width:600px){.acc.compact{flex-wrap:wrap}.acc.compact .ops{width:100%}}
@media (max-width:600px){header .sub .note{max-width:60%;border-radius:14px;line-height:1.5}}

/* 有背景圖時：字加深、壓在圖上的字墊底，確保讀得到 */
body.bgpage,body.bgboth{--muted:#2f4b59;--ink:#10232e}
body.bgpage .phead,body.bgboth .phead{background:rgba(var(--card-rgb),.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:12px 16px;border:2px solid var(--line)}
body.bgpage #app>.muted,body.bgboth #app>.muted,body.bgpage .dash>.col>.muted,body.bgboth .dash>.col>.muted{background:rgba(var(--card-rgb),.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:8px 12px;color:var(--ink)}
@media (max-width:899px){body.bgpage nav button,body.bgboth nav button{background:rgba(var(--card-rgb),.92)}body.bgpage nav button.on,body.bgboth nav button.on{background:var(--brand)}}
@media (min-width:900px){body.bgpage #side,body.bgboth #side{background:rgba(var(--card-rgb),.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}}
body.glass .card .muted,body.glass .kpi .s,body.glass .kpi .t{color:#2a4552}

.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 16px;font-weight:700;background:rgba(var(--card-rgb),.9)}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cw{text-align:center;font-weight:800;color:var(--muted);font-size:14px;padding:2px 0}

/* 每個色調自己的背景小圖案（淡淡的，不影響閱讀） */
function decoSVG(k){ const T=THEMES[k]||THEMES.ocean, c=T.brand, c2=T.sw[1], o='.16';
  const heart=(x,y,s,f)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 4 C-6 -4 -14 2 -8 9 L0 16 L8 9 C14 2 6 -4 0 4Z" fill="${f}"/>`;
  const star=(x,y,s,f)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3Z" fill="${f}"/>`;
  const leaf=(x,y,r,f)=>`<g transform="translate(${x} ${y}) rotate(${r})"><path d="M0 0 C6 -14 22 -16 26 -12 C22 -2 10 4 0 0Z" fill="${f}"/><path d="M0 0 L20 -10" stroke="${f}" stroke-width="1.2"/></g>`;
  const bub=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c}" stroke-width="1.6"/><circle cx="${x-r*.35}" cy="${y-r*.35}" r="${r*.22}" fill="${c}"/>`;
  const wave=(y)=>`<path d="M0 ${y} q15 -8 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="${c2}" stroke-width="2"/>`;
  const coin=(x,y)=>`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#e0a800" stroke-width="1.5"/><text x="${x}" y="${y+3.5}" font-size="9" text-anchor="middle" fill="#e0a800" font-family="sans-serif" font-weight="700">$</text>`;
  const moon=(x,y)=>`<path transform="translate(${x} ${y})" d="M0 -12 A12 12 0 1 0 10 8 A9 9 0 1 1 0 -12Z" fill="${c}"/>`;
  const P={ocean:bub(30,40,9)+bub(150,30,6)+bub(200,140,11)+bub(70,170,5)+wave(110)+coin(110,200),
    sakura:heart(40,30,1,c)+heart(170,60,.7,c2)+heart(100,150,.9,c)+heart(210,190,.6,c2)+`<ellipse cx="60" cy="110" rx="6" ry="3" fill="${c2}" transform="rotate(30 60 110)"/><ellipse cx="190" cy="120" rx="5" ry="2.5" fill="${c}" transform="rotate(-20 190 120)"/>`+coin(140,215),
    forest:leaf(20,50,-10,c)+leaf(150,40,30,c2)+leaf(90,150,-40,c)+leaf(190,180,10,c2)+`<circle cx="60" cy="110" r="3" fill="${c}"/><circle cx="200" cy="100" r="2.5" fill="${c2}"/>`+coin(120,215),
    banana:star(40,40,1,c)+star(170,60,.7,'#e0a800')+star(110,160,.9,c)+star(210,200,.6,'#e0a800')+`<circle cx="80" cy="100" r="3" fill="${c}"/><circle cx="190" cy="130" r="2.5" fill="#e0a800"/>`+coin(30,200),
    violet:moon(50,50)+star(160,40,.8,c2)+star(110,150,.6,c)+star(210,180,.9,c2)+`<circle cx="30" cy="140" r="2.5" fill="${c}"/><circle cx="190" cy="100" r="2" fill="${c2}"/>`+coin(90,210),
    latte:bub(40,40,8)+heart(160,50,.8,'#e8b04a')+bub(190,160,6)+heart(70,150,.6,c2)+`<path d="M110 100 q8 -6 16 0 q-8 6 -16 0Z M126 100 l6 -4 v8Z" fill="${c}"/>`+coin(30,210)};
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><g opacity="${o}">${P[T.deco]||P.ocean}</g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`; }

const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const p2=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function addDays(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());}
function validYMD(y,m,d){const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;}
function fmtMD(s){const [,m,d]=s.split('-');return `${+m}/${+d}`;}
function fmtFull(s){const [y,m,d]=s.split('-');return `${y}/${+m}/${+d}`;}
function money(n){return '$'+(Math.round(Number(n)*100)/100).toLocaleString('en-US');}
function bm(n){return n<0?'-'+money(-n):money(n);}
/* 小格子用：太長就改成「萬」，完整金額放在 title */
function bmS(n){ const a=Math.abs(n); if(a<100000) return bm(n); const w=Math.round(a/1000)/10; return (n<0?'-$':'$')+(w>=1000?Math.round(w).toLocaleString('en-US'):w)+'萬'; }
function flash(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--brand-d);color:#fff;padding:9px 20px;border-radius:999px;z-index:99;box-shadow:0 3px 10px rgba(0,0,0,.2);font-weight:700;max-width:92vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

    let m=t.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
    if(m){const y=+m[1],mo=+m[2],d=+m[3]; if(validYMD(y,mo,d)){date=`${y}-${p2(mo)}-${p2(d)}`;} else dateBad=true; t=t.replace(m[0],' ');}
    else{ m=t.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日號]?/)||t.match(/(?<![\d.])(\d{1,2})[\/.](\d{1,2})(?![\d.\/])/);
      if(m){const y=+today().slice(0,4),mo=+m[1],d=+m[2]; if(validYMD(y,mo,d)){date=`${y}-${p2(mo)}-${p2(d)}`;} else dateBad=true; t=t.replace(m[0],' ');} }
  }
  if(dateBad) return {badDate:true};
  t=t.replace(/(\d),(?=\d{3})/g,'$1').replace(/[$元塊圓]/g,' ');
  let amount=null; const nums=[...t.matchAll(/\d+(?:\.\d+)?/g)];
  if(nums.length){const last=nums[nums.length-1]; amount=Number(last[0]); t=t.slice(0,last.index)+' '+t.slice(last.index+last[0].length);}
  t=unmask(t);
  const goal=transfer?null:findGoal(t.replace(/\s+/g,''));
  const debt=(transfer||goal)?null:findDebt(t.replace(/\s+/g,'').replace(/^買/,''));
  let who=''; for(const p of S.people.slice().sort((a,b)=>b.length-a.length)){ if(p&&t.includes(p)){who=p;t=t.replace(p,' ');break;} }
  let item=t.replace(/\s+/g,' ').trim().replace(/^買/,'').trim();
  if(!who){ const m=item.match(/^([還借])\s*(\S+)$/); if(m){ const c=S.people.filter(x=>x.startsWith(m[2])); if(c.length===1){ who=c[0]; item=m[1]; } } }
  if(who&&(item==='還'||item==='借')) item=item+'錢';
  if(transfer) return {date,amount,item:item.replace(/^(現金|錢)$/,'')||(transfer.card?'繳卡費':''),who:'',acct:'',transfer};
  return {date,amount,item,who,acct,transfer:null,debt,goal};
}

function dupOf(rec){ const nm=x=>String(x.item||x.debtName||x.goalName||'').trim(); return live().find(r=>r.date===rec.date&&r.type===rec.type&&Math.abs(r.amount-rec.amount)<0.005&&nm(r)===nm(rec)&&(r.type!=='transfer'||(r.from===rec.from&&r.to===rec.to))); }
function commitAdd(rec,onFail,msg){

/* 分類預算：70% 提醒、90% 注意、100% 超支 */
function catSpent(cat,ym){ return live().filter(r=>r.date.startsWith(ym)&&r.type==='expense'&&r.category===cat).reduce((a,r)=>a+r.amount,0); }
function budgetLevel(sp,bud){ const pct=bud?sp/bud*100:0; return pct>=100?{k:'over',t:'超支',c:'var(--bad)'}:pct>=90?{k:'warn',t:'注意',c:'#d9730d'}:pct>=70?{k:'tip',t:'提醒',c:'#c99400'}:{k:'ok',t:'正常',c:'var(--ok)'}; }
function catAlert(rec){ if(!rec||rec.type!=='expense') return; const bud=S.budget.cats[rec.category]; if(!bud) return; const ym=rec.date.slice(0,7), sp=catSpent(rec.category,ym), before=sp-rec.amount, L=budgetLevel(sp,bud), L0=budgetLevel(before,bud);
  if(L.k==='ok'||L.k===L0.k&&L.k!=='over') return; const pct=Math.round(sp/bud*100);
  const msg=L.k==='over'?`🔴 ${rec.category}本月已超支 ${money(sp-bud)}（${pct}%）`:L.k==='warn'?`🟠 注意：${rec.category}本月已用 ${pct}%，剩 ${money(bud-sp)}`:`🟡 提醒：${rec.category}本月已用 ${pct}%，剩 ${money(bud-sp)}`;

function continueAdd(){
  const p=pending;

  if(p.transfer){
    const t=p.transfer;
    if(!t.from||!t.to){ showAskTransfer(); return; }
    if(t.from===t.to){ alert('轉出和轉入是同一個帳戶，請再選一次。'); t.to=''; showAskTransfer(); return; }
    const rec={id:newId(),type:'transfer',amount:p.amount,item:p.item||(t.card?'繳卡費':''),category:'轉帳',date:p.date,who:'',icon:'',from:t.from,to:t.to,createdAt:new Date().toISOString()};
    commitAdd(rec,null,`已記好 ✦ ${fmtMD(rec.date)} 轉帳 ${acctName(t.from)} → ${acctName(t.to)} ${money(rec.amount)}`); return;
  }
  if(p.goal){
    const g=goalById(p.goal.id); if(!g){ pending.goal=null; continueAdd(); return; }
    if(g.done){ if(!confirm(`「${g.name}」已經標記完成了。\n要把它移回「進行中」並記這筆嗎？`)){ cancelAsk(); return; } g.done=false; g.doneAt=''; }
    const acct=p.acct||(p.selTouched?p.sel:'')||'';
    const rec={id:newId(),type:'save',goal:g.id,goalName:g.name,amount:p.amount,item:`${g.name}存錢`,category:'儲蓄',date:p.date,who:'',icon:'',acct:acct&&acctById(acct)?acct:'',createdAt:new Date().toISOString()};
    commitAdd(rec,null,`已記好 ✦ ${g.name} +${money(rec.amount)}${rec.acct?`（放在${acctName(rec.acct)}）`:''}・帳戶餘額不變、不算支出`);
    return;
  }
  if(p.debt){
    const d=p.debt;
    if(!d.id&&!p.debtOk){ showAskDebt(); return; }
    let acct=p.acct||(p.selTouched?p.sel:'');
    if(!acct&&d.kind==='loan'){ const L=debtById(d.id); if(L&&L.payAcct&&acctById(L.payAcct)) acct=L.payAcct; }
    acct=okAcct(acct||'cash');
    const oS=JSON.stringify(S); let id=d.id;
    if(!id){ id=newId(); S.debts.push({id,name:d.name,kind:'person',init:0,monthly:0,dueDay:0,payAcct:''}); }
    const isLoanPay=d.kind==='loan'&&d.op==='pay';
    const rec={id:newId(),type:'debt',op:d.op,debt:id,debtName:d.name,debtKind:d.kind,exp:isLoanPay,amount:p.amount,item:debtLabel(d.op,d.name),
      category:d.kind==='loan'?'還款':'借還',date:p.date,who:'',icon:'',acct,createdAt:new Date().toISOString()};
    const io=d.op==='borrow'||d.op==='collect';
    commitAdd(rec,()=>{S=JSON.parse(oS);},`已記好 ✦ ${fmtMD(rec.date)} ${rec.item} ${io?'+':'-'}${money(rec.amount)} · ${acctName(acct)}${isLoanPay?'（算支出）':'（不算收支）'}`);
    return;
  }
  if(!p.item){ showAsk('item',`${money(p.amount)} 是花在什麼地方呢？`); return; }
  const c=classify(p.item);
  if(!p.who&&!p.whoAsked&&((c.learned&&c.who)||WHO_KW.some(k=>p.item.includes(k))||(/^還/.test(p.item)&&!/^還[款貸]/.test(p.item)))){ showAskWho(c.who||''); return; }
  const who=p.whoAsked?p.who:(p.who||c.who);
  let acct=p.acct||(p.selTouched?p.sel:'')||p.acctPick||'';
  if(!acct){ if(c.type==='income'){ showAskAcct(); return; } acct='cash'; }
  const rec={id:newId(),type:c.type,amount:p.amount,item:p.item,category:c.category,date:p.date,who,icon:'',acct:okAcct(acct),createdAt:new Date().toISOString()};
  const oldRules=JSON.stringify(S.rules);
  if(p.whoAsked&&who){ const ex=S.rules.find(x=>x.word===p.item); if(ex){ex.who=who;} else S.rules.push({word:p.item,category:c.category,who}); }
  commitAdd(rec,()=>{S.rules=JSON.parse(oldRules);},`已記好 ✦ ${fmtMD(rec.date)} ${rec.category} ${rec.item} ${rec.type==='income'?'+':'-'}${money(rec.amount)} · ${acctName(rec.acct)}`);
}

function saveEdit(){
  const r=cur, amt=Number(r.amount);
  if(r.type==='save'){
    if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}
    const j=R.findIndex(x=>x.id===r.id), o=R[j];
    R[j]=Object.assign({},o,{amount:amt,date:r.date,acct:r.acct&&acctById(r.acct)?r.acct:''});
    if(!persist()){R[j]=o;return;} dirty=false; cur=null; go2(back); flash('已儲存 ✦'); return;
  }
  if(r.type==='debt'){
    if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}
    const j=R.findIndex(x=>x.id===r.id), o=R[j], d=debtById(r.debt), nm=d?d.name:(r.debtName||'');
    R[j]=Object.assign({},o,{op:r.op,amount:amt,date:r.date,acct:okAcct(r.acct),item:debtLabel(r.op,nm),exp:r.debtKind==='loan'&&r.op==='pay'});
    if(!persist()){R[j]=o;return;} dirty=false; cur=null; go2(back); flash('已儲存 ✦'); return;
  }
  if(r.type==='transfer'||r.type==='adjust'){

    if(r.type==='transfer'&&okAcct(r.from)===okAcct(r.to)){alert('轉出和轉入不能是同一個帳戶');return;}

      : {id:r.id,type:'adjust',amount:amt,item:'餘額校正',category:'校正',date:r.date,who:'',icon:r.icon||'',acct:okAcct(r.acct),sign:Number(r.sign)<0?-1:1,createdAt:o.createdAt};
    R[j]=c2; if(!persist()){R[j]=o;return;}
    dirty=false; cur=null; go2(back); flash('已儲存 ✦'); return;
  }
  if(!r.item.trim()){alert('請先填寫：項目');return;} if(!(amt>0)){alert('金額要是大於 0 的數字');return;} if(!r.date){alert('請先填寫：日期');return;}

  }

  dirty=false; cur=null; go2(back); flash('已儲存 ✦');
}

function pickIcon(cb,allowReset){
  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)m.remove();};
  const grid=()=>ICON_GROUPS[ICON_TAB][2].split(' ').map(i=>`<button data-i="${i}" aria-label="${i}">${i}</button>`).join('');
  m.innerHTML=`<div class="box" style="max-width:560px"><div class="row" style="margin-bottom:8px"><b>選一個可愛圖示</b><span class="small muted">（共 ${ICONS.length} 個）</span><span class="spacer"></span>${allowReset?'<button id="icReset">用分類預設</button>':''}<button id="icClose">關閉</button></div>
    <div class="ictabs">${ICON_GROUPS.map((g,i)=>`<button data-t="${i}" class="${i===ICON_TAB?'on':''}">${g[0]} ${g[1]}</button>`).join('')}</div>
    <div class="icgrid">${grid()}</div></div>`;
  document.body.appendChild(m);
  const bind=()=>m.querySelectorAll('.icgrid button').forEach(b=>b.onclick=()=>{cb(b.dataset.i);m.remove();}); bind();
  m.querySelectorAll('.ictabs button').forEach(t=>t.onclick=()=>{ ICON_TAB=+t.dataset.t; m.querySelectorAll('.ictabs button').forEach(x=>x.classList.toggle('on',x===t)); m.querySelector('.icgrid').innerHTML=grid(); m.querySelector('.icgrid').scrollTop=0; bind(); });
  m.querySelector('#icClose').onclick=()=>m.remove(); const rs=m.querySelector('#icReset'); if(rs) rs.onclick=()=>{cb('');m.remove();};
}

function checkAcctName(name,selfId){
  if(!name){alert('請填寫帳戶名稱');return false;}
  if(/\d{6,}/.test(name.replace(/[\s-]/g,''))){alert('名稱看起來像帳號或卡號。為了安全，請只寫暱稱，例如「台新」或「中信信用卡」。');return false;}
  if(/領|轉|加值|\+值/.test(name)){alert('名稱裡不能有「領、轉、加值、+值」，這些字小帳會當成轉帳。');return false;}
  if(/^\d+$/.test(name)){alert('名稱不能只有數字');return false;}
  if(S.accounts.some(a=>a.id!==selfId&&a.name.toLowerCase()===name.toLowerCase())){alert('已經有同名的帳戶了');return false;}
  return true;
}
function parseInit(v){ v=String(v??'').trim(); if(v==='') return 0; const n=Number(v); return Number.isFinite(n)?Math.round(n*100)/100:NaN; }
function addAcct(){
  const name=$('#naName').value.trim(), init=parseInit($('#naInit').value);
  if(!checkAcctName(name,null)) return; if(Number.isNaN(init)){alert('起始餘額要是數字');return;}
  const o=JSON.stringify(S); const at=$('#naType').value; S.accounts.push({id:newId(),name,icon:{cash:'💵',bank:'🏦',epay:'📱',card:'💳',other:'🗂️'}[at]||'💳',init,dueDay:0,atype:at}); S.acctInitDone=true;
  if(!persist()){S=JSON.parse(o);return;} renderAccounts(); flash(`已新增帳戶「${name}」✦`);
}

function acctDelta(r,id){ let d=0;
  if(r.type==='income'&&okAcct(r.acct)===id) d+=r.amount;
  if(r.type==='expense'&&okAcct(r.acct)===id) d-=r.amount;
  if(r.type==='transfer'){ if(okAcct(r.from)===id) d-=r.amount; if(okAcct(r.to)===id) d+=r.amount; }
  if(r.type==='adjust'&&okAcct(r.acct)===id) d+=(r.sign<0?-1:1)*r.amount;
  if(r.type==='debt'&&okAcct(r.acct)===id) d+=(r.op==='borrow'||r.op==='collect'?1:-1)*r.amount;
  return d; }
function acctHistory(id){
  const a=acctById(id); if(!a) return; let run=Number(a.init)||0;
  const rs=live().slice().sort((x,y)=>x.date.localeCompare(y.date)||(x.createdAt||'').localeCompare(y.createdAt||'')).map(r=>({r,d:acctDelta(r,id)})).filter(x=>x.d!==0).map(x=>{run=Math.round((run+x.d)*100)/100;return Object.assign(x,{bal:run});}).reverse();
  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML=`<div class="box" style="max-height:82vh;overflow:auto"><div class="row" style="margin-bottom:8px"><b>${a.icon||'💳'} ${esc(a.name)} 的資金異動</b><span class="spacer"></span><button id="ahX">關閉</button></div>
    <div class="small muted" style="margin-bottom:6px">起始餘額 ${bm(Number(a.init)||0)} → 目前 ${bm(balances()[id])}（共 ${rs.length} 筆）</div>
    ${rs.length?rs.map(({r,d,bal})=>{const mm=recMeta(r);return `<div class="rec" data-id="${r.id}"><div class="ic">${mm.icon}</div><div class="mid"><div class="nm">${esc(mm.name)}</div><div class="sb">${fmtFull(r.date)}・餘額 ${bm(bal)}</div></div><div class="am ${d>0?'in':'out'}">${d>0?'+':'-'}${money(Math.abs(d))}</div></div>`;}).join(''):'<div class="empty">還沒有異動</div>'}</div>`;
  document.body.appendChild(m); m.querySelector('#ahX').onclick=()=>m.remove();
  m.querySelectorAll('.rec').forEach(el=>el.addEventListener('click',()=>{m.remove();openEdit(el.dataset.id);}));
}
function calibAcct(id){
  const a=acctById(id), cur=balances()[id];
  const v=prompt(`「${a.name}」小帳算出來目前是 ${bm(cur)}。\n請輸入實際的餘額：`, String(cur)); if(v===null) return;
  const real=parseInit(v); if(Number.isNaN(real)||String(v).trim()===''){alert('請輸入數字');return;}
  const d=Math.round((real-cur)*100)/100; if(d===0){flash('餘額已經一樣，不用校正 ✦');return;}
  if(!confirm(`會新增一筆「餘額校正」${d>0?'+':'-'}${money(Math.abs(d))}，讓「${a.name}」變成 ${bm(real)}。\n這筆不算收入也不算支出，確定嗎？`)) return;
  R.push({id:newId(),type:'adjust',amount:Math.abs(d),item:'餘額校正',category:'校正',date:today(),who:'',icon:'',acct:id,sign:d>0?1:-1,createdAt:new Date().toISOString()});
  if(!persist()){R.pop();return;} renderAccounts(); flash('已校正 ✦');
}
function delAcct(id){
  if(id==='cash') return; const a=acctById(id); if(!a) return;
  const refs=live().filter(r=>r.type!=='save'&&(r.acct===id||r.from===id||r.to===id));
  const finish=(apply,msg)=>{ const oR=JSON.stringify(R), oS=JSON.stringify(S); apply(); live().forEach(r=>{ if(r.type==='save'&&r.acct===id) r.acct=''; }); S.accounts=S.accounts.filter(x=>x.id!==id);
    if(!persist()){R=JSON.parse(oR);S=JSON.parse(oS);return false;} renderAccounts(); flash(msg); return true; };
  if(!refs.length){ if(confirm(`確定要刪除帳戶「${a.name}」嗎？`)) finish(()=>{},'已刪除帳戶'); return; }
  const others=S.accounts.filter(x=>x.id!==id);
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h2 style="margin:0 0 8px;font-size:17px">刪除帳戶「${esc(a.name)}」</h2>
    <div style="margin-bottom:10px">「${esc(a.name)}」還有 <b>${refs.length}</b> 筆紀錄，要怎麼處理？</div>
    <label class="row" style="gap:6px;margin-bottom:6px"><input type="radio" name="dm" value="move" checked style="width:auto"> 🔀 搬到其他帳戶：</label>
    <select id="daTo" style="margin-bottom:10px">${others.map(x=>`<option value="${x.id}">${x.icon||'💳'} ${esc(x.name)}</option>`).join('')}</select>
    <label class="row" style="gap:6px;margin-bottom:12px"><input type="radio" name="dm" value="del" style="width:auto"> 🗑️ 連紀錄全部刪除（先放進「最近刪除」，30 天內可救回）</label>
    <div class="row"><button class="danger" id="daOk">確定</button><button id="daNo">取消</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#daNo').onclick=()=>m.remove();
  m.querySelector('#daOk').onclick=()=>{
    const mode=m.querySelector('input[name=dm]:checked').value;
    if(mode==='move'){
      const to=m.querySelector('#daTo').value, tn=acctName(to);
      if(!confirm(`確定把 ${refs.length} 筆紀錄搬到「${tn}」，然後刪除「${a.name}」嗎？`)) return;
      let gone=0;
      if(finish(()=>{ refs.forEach(r=>{ if(r.acct===id) r.acct=to; if(r.from===id) r.from=to; if(r.to===id) r.to=to;
          if(r.type==='transfer'&&r.from===r.to){ r.deleted=true; r.deletedAt=today(); gone++; } }); },
        `已搬到「${tn}」並刪除帳戶`+(gone?`（${gone} 筆變成「自己轉給自己」的轉帳已移到最近刪除）`:''))) m.remove();
    } else {
      if(!confirm(`確定刪除「${a.name}」和它的 ${refs.length} 筆紀錄嗎？\n紀錄會先放進「最近刪除」，30 天內可以救回。`)) return;
      if(finish(()=>{ refs.forEach(r=>{ r.deleted=true; r.deletedAt=today(); }); },`已刪除帳戶，${refs.length} 筆紀錄移到「最近刪除」`)) m.remove();
    }
  };
}

function dueReminders(){
  const b=balances(), out=[];
  S.accounts.forEach(a=>{ if(!a.dueDay||!(b[a.id]<0)) return; const n=nextDue(a.dueDay); if(n&&n.days<=5) out.push(`💳 <b>${esc(a.name)}</b> ${fmtMD(n.date)}${n.days===0?'（今天）':`（還有 ${n.days} 天）`}要繳 <b>${money(-b[a.id])}</b>`); });
  return out.length?`<div class="card" style="border-color:#f3b94a;background:#fff8e6"><h2>⏰ 繳款提醒</h2>${out.map(x=>`<div style="margin:4px 0">${x}</div>`).join('')}</div>`:'';
}
function renderDebts(){

const RC_KIND={income:'💰 收入',expense:'💸 支出',debt:'🏦 還負債'};
function recById(id){return S.recurring.find(x=>x.id===id);}
function recAmt(x,M){ const v=S.recurAmt[x.id+'|'+M]; return v!==undefined?v:x.amount; }
function withAmt(x,M){ const v=S.recurAmt[x.id+'|'+M]; return v!==undefined?Object.assign({},x,{amount:v}):x; }
function livBudget(M){ const v=S.livMonth[M]; return v!==undefined?v:S.budget.living; }
function ymDiff(a,b){ const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1); }
function recurOn(x,M){ return x.start<=M&&(!x.end||M<=x.end)&&ymDiff(x.start,M)%(x.every||1)===0; }
function freqTxt(x){ return x.end&&x.end===x.start?'單次':x.every>1?`每 ${x.every} 個月`:'每月'; }
function ymAdd(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return `${y}-${p2(m)}`;}
function dueDate(ym,day){const [y,m]=ym.split('-').map(Number);return `${ym}-${p2(Math.min(day,new Date(y,m,0).getDate()))}`;}
/* 到期（日期 ≤ 今天）但還沒按「記好」或「略過」的項目，含之前沒處理的月份 */
function recurDue(){
  const out=[], t=today(), cur=t.slice(0,7);
  S.recurring.forEach(x=>{ if(x.kind!=='income') return; let ym=x.start, guard=0; while(ym<=cur&&guard++<240){ if(x.end&&ym>x.end) break; if(!recurOn(x,ym)){ ym=ymAdd(ym,1); continue; } const d=dueDate(ym,x.day);
    if(d<=t&&!S.recurDone[x.id+'|'+ym]) out.push({x,ym,date:d}); ym=ymAdd(ym,1); } });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function recurRecord(x,ym,date,amt){
  const base={id:newId(),amount:amt,date,who:'',icon:'',acct:okAcct(x.acct),recur:x.id,recurMonth:ym,createdAt:new Date().toISOString()};

  const c=classify(x.name), inc=x.kind==='income';
  return Object.assign(base,{type:inc?'income':'expense',item:x.name,category:inc?(INC.includes(c.category)?c.category:'其他收入'):(EXP.includes(c.category)?c.category:'其他')});

function recurApply(list){ /* list: [{d, amt}] */
  const oR=R.length, oD=JSON.stringify(S.recurDone);
  for(const {d,amt} of list){ if(!(amt>0)){alert(`「${d.x.name}」的金額要大於 0`);R.length=oR;S.recurDone=JSON.parse(oD);return false;}
    R.push(recurRecord(d.x,d.ym,d.date,amt)); S.recurDone[d.x.id+'|'+d.ym]='done'; }
  if(!persist()){R.length=oR;S.recurDone=JSON.parse(oD);return false;} return true;
}
function recurDo(i){ const due=recurDue(), d=due[i]; if(!d) return; const amt=Math.round(Number($('#rc'+i).value)*100)/100;
  if(recurApply([{d,amt}])){ renderHome(); flash(`已記好 ✦ ${d.x.name} ${money(amt)}`); } }
function recurDoAll(){ const due=recurDue(); const list=due.map((d,i)=>({d,amt:Math.round(Number(($('#rc'+i)||{}).value)*100)/100}));
  if(!confirm(`要把這 ${list.length} 筆固定收支全部記好嗎？`)) return;
  if(recurApply(list)){ renderHome(); flash(`已記好 ${list.length} 筆 ✦`); } }
function recurSkip(i){ const d=recurDue()[i]; if(!d) return; if(!confirm(`這個月（${d.ym}）的「${d.x.name}」要略過、不記帳嗎？`)) return;
  const o=JSON.stringify(S.recurDone); S.recurDone[d.x.id+'|'+d.ym]='skip'; if(!persist()){S.recurDone=JSON.parse(o);return;} renderHome(); flash('已略過'); }

  const o=JSON.stringify(S), gone=[]; S.recurring=S.recurring.filter(y=>y.id!==id); ['recurDone','recurMove','att','recurAmt'].forEach(f=>Object.keys(S[f]).forEach(k=>{ if(k.startsWith(id+'|')){ if(f==='att') gone.push(...S.att[k]); delete S[f][k]; } }));
  if(!persist()){S=JSON.parse(o);return;} phDel(gone); renderSettings(); flash('已刪除'); }

/* ---------- 圖片：存在 IndexedDB（瀏覽器的大容量空間，一樣只在這台電腦、這個瀏覽器） ---------- */
const PH_DB='casevoraLedgerPhotos', BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; let phDBP=null; const PH_CACHE={};
const PH_FAIL='圖片存不進去。可能是無痕視窗、瀏覽器封鎖了網站資料，或電腦空間不足。';
function phDB(){ if(phDBP) return phDBP; phDBP=new Promise((ok,no)=>{ try{ const rq=indexedDB.open(PH_DB,1); rq.onupgradeneeded=()=>rq.result.createObjectStore('p'); rq.onsuccess=()=>ok(rq.result); rq.onerror=()=>no(rq.error); }catch(e){ no(e); } }); phDBP.catch(()=>{ phDBP=null; }); return phDBP; }
function phTx(mode,fn){ return phDB().then(db=>new Promise((ok,no)=>{ const tx=db.transaction('p',mode), rq=fn(tx.objectStore('p')); tx.oncomplete=()=>ok(rq?rq.result:undefined); tx.onerror=tx.onabort=()=>no(tx.error||new Error('tx')); })); }
async function phPut(url,id){ id=id||('ph'+newId()); await phTx('readwrite',st=>st.put(url,id)); PH_CACHE[id]=url; return id; }
async function phGet(id){ if(PH_CACHE[id]) return PH_CACHE[id]; const v=await phTx('readonly',st=>st.get(id)); if(v) PH_CACHE[id]=v; return v; }
async function phDel(ids){ for(const id of ids){ delete PH_CACHE[id]; try{ await phTx('readwrite',st=>st.delete(id)); }catch(e){} } }
function allPhIds(){ const ids=new Set(); Object.values(S.att).forEach(l=>l.forEach(i=>ids.add(i))); Object.values(S.payslips).forEach(p=>p.ph.forEach(i=>ids.add(i))); return [...ids]; }
function fillPhotos(){ document.querySelectorAll('img[data-ph]:not([data-ok])').forEach(im=>{ im.dataset.ok='1'; const id=im.dataset.ph; phGet(id).then(u=>{ if(u) im.src=u; else im.alt='圖片不見了'; }).catch(()=>{ im.alt='讀不到圖片'; }); }); }
new MutationObserver(()=>fillPhotos()).observe(document.body,{childList:true,subtree:true});
function phImg(id,cls,click,style){ return `<img class="${cls||''}" src="${BLANK}" data-ph="${esc(id)}" alt="圖片" ${style?`style="${style}"`:''} onclick="event.stopPropagation();${click}">`; }
function imgToData(file){ return new Promise((ok,no)=>{ const fr=new FileReader(); fr.onerror=()=>no(fr.error); fr.onload=()=>{ const im=new Image(); im.onerror=()=>no(new Error('img'));
  im.onload=()=>{ const M=2000, k=Math.min(1,M/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',.85)); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }
async function saveImages(files){ const ids=[]; for(const f of files){ ids.push(await phPut(await imgToData(f))); } try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){} return ids; }
let PASTE=null;
function clipImages(e){ const out=[], it=e.clipboardData&&e.clipboardData.items; if(it) for(const x of it){ if(x.kind==='file'&&/^image\//.test(x.type)){ const f=x.getAsFile(); if(f) out.push(f); } } return out; }
document.addEventListener('paste',e=>{ const fs=clipImages(e); if(!fs.length) return; const fn=PASTE||(page==='payslip'?(f=>psAdd(PS_SEL,f)):null);
  if(!fn){ flash('要貼截圖：請到「薪資條」點月份，或在繳費狀態按「＋ 截圖」'); return; } e.preventDefault(); fn(fs); });
function pickFiles(cb){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.multiple=true; i.onchange=()=>{ const fs=[...i.files].filter(f=>/^image\//.test(f.type)); if(fs.length) cb(fs); }; i.click(); }

async function delPhoto(ctx,key,id){ const o=JSON.stringify(S);
  if(ctx==='att'){ S.att[key]=(S.att[key]||[]).filter(x=>x!==id); if(!S.att[key].length) delete S.att[key]; }

/* ---------- 繳費狀態 ---------- */
const ST_TXT={done:'已繳',skip:'略過',late:'逾期',today:'今天到期',wait:'待繳',moved:'已延後'}, OPEN_ST=['late','today','wait'];
function ymLabel(ym){ return `${ym.slice(0,4)}年${+ym.slice(5)}月`; }
function ymShort(ym){ return `${+ym.slice(5)}月`; }
function billStatus(k,due){ const d=S.recurDone[k]; if(d==='done') return 'done'; if(d==='skip') return 'skip'; const t=today(); return due<t?'late':due===t?'today':'wait'; }
function billRows(M){ const out=[];
  const db=debtBal(), paidOff=x=>x.kind==='debt'&&debtById(x.debt)&&!(db[x.debt]>0);
  S.recurring.forEach(x=>{ if(x.kind==='income'||!recurOn(x,M)) return; const k=x.id+'|'+M, mv=S.recurMove[k], due=dueDate(M,x.day); if(paidOff(x)&&!S.recurDone[k]) return;
    const xx=withAmt(x,M); out.push(mv&&mv!==M?{x:xx,k,orig:M,show:M,due,st:'moved',to:mv}:{x:xx,k,orig:M,show:M,due,st:billStatus(k,due)}); });
  Object.entries(S.recurMove).forEach(([k,to])=>{ if(to!==M) return; const [id,orig]=k.split('|'); if(orig===M) return; const x0=recById(id), x=x0&&withAmt(x0,orig); if(!x||x.kind==='income') return;
    const due=dueDate(M,x.day); out.push({x,k,orig,show:M,due,st:billStatus(k,due),from:orig}); });
  cardRows(M).forEach(r=>out.push(r));
  return out.sort((a,b)=>a.due.localeCompare(b.due)||a.x.name.localeCompare(b.x.name)); }
/* 信用卡繳款提醒：本月起，欠款大於 0 或這個月已經繳過 */
function cardPaidIn(id,M){ return live().filter(r=>r.type==='transfer'&&r.to===id&&r.date.startsWith(M)).reduce((a,r)=>a+r.amount,0); }
function cardRows(M){ const cur=today().slice(0,7), b=balances(), out=[];
  S.accounts.filter(a=>isCard(a)&&a.dueDay).forEach(a=>{ const owed=Math.max(0,-(b[a.id]||0)), paid=cardPaidIn(a.id,M), due=dueDate(M,a.dueDay), k='cc-'+a.id+'|'+M;
    const x={id:'cc-'+a.id,name:`${a.name} 卡費`,kind:'card',amount:paid||owed,day:a.dueDay,start:M,end:'',every:1,acct:a.id,card:a.id};
    if(paid>0) out.push({x,k,orig:M,show:M,due,st:'done',paid});
    else if(M>=cur&&owed>0&&(M===cur||M===ymAdd(cur,1))) out.push({x,k,orig:M,show:M,due,st:due<today()?'late':due===today()?'today':'wait'}); });
  return out; }
function billOpen(){ const cur=today().slice(0,7); let first=cur; S.recurring.forEach(x=>{ if(x.kind!=='income'&&x.start<first) first=x.start; });
  const out=[]; let ym=first, g=0; while(ym<=cur&&g++<240){ billRows(ym).forEach(b=>{ if(OPEN_ST.includes(b.st)) out.push(b); }); ym=ymAdd(ym,1); }
  return out.sort((a,b)=>a.due.localeCompare(b.due)); }
function billByKey(k){ const [id,orig]=String(k).split('|'), x0=recById(id); if(!x0||!orig) return null; const x=withAmt(x0,orig), show=S.recurMove[k]||orig; return {x,k,orig,show,due:dueDate(show,x.day)}; }
function billRec(b){ if(b.x.kind==='card') return {amount:b.paid||b.x.amount}; return R.find(r=>!r.deleted&&r.recur===b.x.id&&r.recurMonth===b.orig); }
function billRowHTML(b,compact){ const x=b.x, kq=esc(b.k), freq=freqTxt(x), dn=x.kind==='debt'&&debtById(x.debt)?debtById(x.debt).name:'';
  const sub=[x.kind==='card'?'繳卡費・轉帳不算支出':x.kind==='debt'?'還款':'支出',x.kind==='card'?'':freq,b.from?`${ymShort(b.from)}延後過來`:'',compact&&b.show!==today().slice(0,7)?ymLabel(b.show):'',dn&&dn!==x.name?dn:''].filter(Boolean).join('・');
  const rec=b.st==='done'?billRec(b):null, amt=rec?rec.amount:x.amount;
  const pill=b.st==='moved'?`<span class="pill moved">已延後 → ${ymShort(b.to)}${S.recurDone[b.k]==='done'?'（已繳）':''}</span>`:`<span class="pill ${b.st}">${ST_TXT[b.st]}</span>`;
  const att=S.att[b.k]||[];
  const attH=x.kind==='card'?'':att.map(id=>phImg(id,'thumb',`viewImg('${esc(id)}','att','${kq}')`)).join('')+`<button class="attbtn" onclick="billAttach('${kq}')" title="貼上或選擇繳費截圖">${att.length?'＋':'＋ 截圖'}</button>`;
  const acts=x.kind==='card'?(b.st==='done'?'':`<button class="dark" onclick="cardPay('${x.card}')">完成</button>`):b.st==='done'||b.st==='skip'?`<button onclick="billUndo('${kq}')">改回未繳</button>`:b.st==='moved'?(S.recurDone[b.k]==='done'?'':`<button onclick="billUnmove('${kq}')">取消延後</button>`)
    :`<button class="dark" onclick="billDone('${kq}')">完成</button><button class="danger" onclick="billMove('${kq}')">延後</button>`;
  return `<div class="brow"><div class="cn"><b>${esc(x.name)}</b><div class="sb">${sub}</div></div><div class="ca">${money(amt)}</div><div class="cs">${pill}</div><div class="cd">${fmtMD(b.due)}</div><div class="cf">${attH}</div><div class="cx">${acts}</div></div>`; }

  if(appr!==null&&(!(appr>=0)||appr*2!==Math.round(appr*2)||appr>hrs)){ alert('核准時數要以 0.5 為單位，而且不能比申報多'); return null; }

function payslipOT(ym){ const n=String((S.payslips[ym]||{}).note||'').replace(/，/g,','); const m=n.match(/^\s*\$?\s*(\d[\d,]*)\s*元?\s*$/)||n.match(/加班費\s*[:：]?\s*\$?\s*(\d[\d,]*)(?!\s*(小時|h|H|hr))/); if(!m) return null; const v=Number(m[1].replace(/,/g,'')); return v>0?v:null; }

function otAddBase(){ const from=$('#obFrom').value, amt=Number($('#obAmt').value); if(!/^\d{4}-\d{2}-\d{2}$/.test(from)){ alert('請選從哪天開始'); return; } if(!(amt>0)){ alert('月薪要大於 0'); return; }

/* ---------- 節金＋加給預估、請假扣薪 ---------- */
/* 節金／加給：依請假時數扣（事假、病假、颱風假全算，生理假算一半）；薪水：依政府規定（事假、颱風假全扣，病假、生理假扣一半） */
const LV_W={lv_personal:1,lv_sick:1,lv_typhoon:1,lv_men:0.5,lv_injury:0}, LV_PAY={lv_personal:1,lv_sick:0.5,lv_men:0.5,lv_typhoon:1,lv_injury:0};
function lvW(prefix){ return S.ot.days.filter(d=>isLeave(d.kind)&&d.date.startsWith(prefix)).reduce((a,d)=>a+d.hrs*(LV_W[d.kind]??1),0); }
function lvPayCut(ym){ return Math.round(S.ot.days.filter(d=>isLeave(d.kind)&&d.date.startsWith(ym)).reduce((a,d)=>a+d.hrs*(LV_PAY[d.kind]??1)*otBase(d.date)/240,0)); }
function lvHours(ym){ const o={}; S.ot.days.filter(d=>isLeave(d.kind)&&d.date.startsWith(ym)).forEach(d=>o[d.kind]=(o[d.kind]||0)+d.hrs); return o; }
function allowNames(){ return [...new Set(S.ot.allow.map(a=>a.name))]; }
function allowRate(name,m){ let r=null; S.ot.allow.filter(a=>a.name===name&&a.from<=m).sort((x,y)=>x.from.localeCompare(y.from)).forEach(a=>r=a); return r; }
function monthShare(name,m){ const r=allowRate(name,m); return r?(r.per==='p'?r.amt/4:r.amt):0; }
function bonusPeriod(ym){ const y=+ym.slice(0,4), m=+ym.slice(5), i=Math.floor((m-1)/4), ms=[1,2,3,4].map(k=>`${y}-${p2(i*4+k)}`);
  return {ms,label:`${y}年${i*4+1}～${i*4+4}月`,pay:i<2?`${y}-${p2(i===0?5:9)}-20`:`${y+1}-01-20`}; }
function bonusCalc(ym){ const P=bonusPeriod(ym), names=allowNames(), on=!!S.ot.bonusFrom&&P.pay.slice(0,7)>=S.ot.bonusFrom;
  const parts=names.map(n=>{ const full=P.ms.reduce((a,m)=>a+monthShare(n,m),0), cut=on?P.ms.reduce((a,m)=>a+monthShare(n,m)/240*lvW(m),0):0; return {n,full:Math.round(full),cut:Math.round(cut)}; }).filter(x=>x.full>0);
  const full=parts.reduce((a,x)=>a+x.full,0), cut=parts.reduce((a,x)=>a+x.cut,0), wSum=P.ms.reduce((a,m)=>a+lvW(m),0);
  return {...P,parts,full,cut,net:full-cut,on,wSum}; }
function bonusCard(M){ const c=bonusCalc(M), set=S.ot.allow.length>0;
  return `<div class="card"><h2>🎁 節金＋加給預估</h2>
    ${set?`<div class="small muted">${c.label}・<b>${fmtFull(c.pay)}</b> 發</div>
      ${c.parts.map(x=>`<div class="bs"><span>${esc(x.n)}</span><span>${money(x.full)}${x.cut?` <span style="color:var(--bad)">-${money(x.cut)}</span>`:''}</span></div>`).join('')||'<div class="small muted">這期沒有加給</div>'}
      <div class="bs"><span>這期請假（扣節金用）</span><b>${Math.round(c.wSum*10)/10} 小時</b></div>
      <div class="bs"><span>依請假扣</span><b style="color:var(--bad)">${c.on?(c.cut?'-'+money(c.cut):'$0'):'這期不扣'}</b></div>
      <div class="bs sum"><span>預估實拿</span><b>${money(c.net)}</b></div>
      ${c.on?'':`<div class="small muted">${S.ot.bonusFrom?`${ymLabel(S.ot.bonusFrom)}發的那期開始才依請假扣。`:'還沒設定從哪期開始扣。'}</div>`}`:'<div class="small muted">還沒設定加給，在下面新增就會自動算。</div>'}
    <details style="margin-top:8px" ${set?'':'open'}><summary class="small"><b>設定加給（金額改了就新增一筆）</b></summary>
      ${S.ot.allow.slice().sort((x,y)=>x.name.localeCompare(y.name)||x.from.localeCompare(y.from)).map(a=>`<div class="bs small"><span>${esc(a.name)}・${a.per==='p'?'每 4 個月':'每月'} ${money(a.amt)}</span><span>${ymLabel(a.from)}起 <a href="#" onclick="allowDel('${a.id}');return false" style="color:var(--bad)" aria-label="刪除">✕</a></span></div>`).join('')}
      <datalist id="alNames"><option value="畢業證書"><option value="HACCP證書"><option value="節金"></datalist>
      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:6px"><div><label class="f">名稱</label><input type="text" id="alName" list="alNames" maxlength="20" placeholder="例：節金"></div>

      <button style="margin-top:8px" onclick="allowAdd()">新增一筆加給</button>
      <div style="margin-top:10px"><label class="f">從哪次發放開始依請假扣</label><div class="row" style="flex-wrap:nowrap"><input type="month" id="bnFrom" value="${S.ot.bonusFrom}"><button onclick="bonusFromSave()">儲存</button></div></div>
      <ul class="small muted" style="padding-left:18px;margin:8px 0 0"><li>每 4 個月一期：1～4 月在 5/20 發、5～8 月在 9/20、9～12 月在隔年 1/20。</li>
        <li>金額中途改了（例：節金從 11 月起變多）就再新增一筆「從 11 月起」，會按月份比例算。</li>

/* 收入提醒自動帶入預估金額：薪水扣上個月請假、節金用預估實拿 */
function recurHint(x,ym){ if(x.kind!=='income') return null; const prev=ymAdd(ym,-1);
  if(/薪水|薪資|月薪/.test(x.name)){ const cut=lvPayCut(prev); return cut?{amt:Math.max(0,x.amount-cut),note:`已預扣 ${ymShort(prev)}請假 ${money(cut)}`}:null; }
  if(/節金|加給|證書/.test(x.name)&&S.ot.allow.length){ const c=bonusCalc(prev); if(c.pay.slice(0,7)!==ym||!c.full) return null; return {amt:c.net,note:`加班頁預估（${c.label}）${c.cut?`，已扣請假 ${money(c.cut)}`:''}`}; }
  return null; }

   `<p>點常用語${gN(2)}會放進輸入框，<b>接著打金額或時數</b>（點「吃飯」再打 120；點「平日加班」再打 2），按「記」。</p><p>常打的字先打好，按「⭐ 加入常用」${gN(1)}；按 × 刪除；改字、排順序到「⭐ 常用選項」。</p>`),
  gStep(4,'🍙 本月生活費',gC(gR(`<span style="flex:1">已花費</span><b>$1,000 / $5,000</b>`)+gR(`<span style="flex:1">👛 身上現金</span><b>$1,000</b>`)+gR(`<b style="flex:1">✨ 本月還可以用</b><b style="color:#b45309">$1,000</b>`)+`<div class="gx-s" style="color:#8a5a00">預算還剩 $4,000，但身上只有 $1,000</div>`),
   `<ul><li><b>分類預算</b>：按「改預算」可以另外設餐飲、交通…的上限；用到 <b>70% 黃色提醒、90% 橘色注意、100% 紅色超支</b>，記帳當下也會跳提醒。</li><li><b>已花費</b>：這個月吃飯、交通、生活用品等花了多少（房租、帳單、還款不算）。</li><li><b>本月還可以用</b>：預算還剩多少；<b>身上的錢比較少時，以身上的錢為準</b>。</li><li>需要用到完整預算，從帳戶領出來（打「薪資帳戶領3000」），「還可以用」就會變回預算的數字。</li></ul><p>按「改預算」可以改每個月的生活費。</p>`),
  gStep(5,'👛 我的錢：總共有多少',gC(`<div class="gx-s">現在總共有（身上＋銀行＋電子支付）</div><div style="font-size:18px;font-weight:800">$23,050</div>`+gR(`<span class="gx-chip">💵 身上 $4,700</span><span class="gx-chip">🏦 銀行 $18,000</span>`)+gR(`<span class="gx-s">本月現金流：進 +$49,900・出 -$45,000</span>`)),
   `<ul><li><b>大字</b>：身上、銀行、電子支付全部加起來；有信用卡欠款會另外寫。</li><li><b>本月現金流</b>：這個月進來多少（薪水、加班費）、出去多少（花費、還款），淨多少。</li><li>點「看每個帳戶」看每一個帳戶；跟實際不一樣就按「填／校正」。</li></ul>`),
  gStep(6,'看懂上面四張卡',gR(`${gK('本月收入','$52,000','var(--ok)')}${gK('本月支出','$18,300','var(--bad)')}`)+gR(`${gK('還沒繳','$5,838','#e0a100')}${gK('淨資產','$12萬','var(--info)')}`),
   `<ul><li><b>本月收入／支出</b>：這個月進來、花掉多少。</li><li><b>還沒繳</b>：到期還沒按「完成」的錢。</li><li><b>淨資產</b>：所有的錢 − 還欠的錢。</li></ul><p><b>每張卡都可以點</b>，會列出是哪些項目；「處理狀態」的已繳、逾期也可以點。</p>`),
  gStep(7,'到期的錢：完成或延後',gC(gR(`<b style="flex:1">零卡</b>${gTag('逾期','late')}${gB('完成',{dk:1,hl:1,n:1})}${gB('延後',{rd:1,n:2})}`)),
   `<p>繳好了按「完成」${gN(1)}；這個月繳不出來按「延後」${gN(2)}，會挪到下個月。全部的到「🧾 繳費狀態」或「📅 行事曆」看。</p>`),
  gStep(8,'薪水、節金到了按「記好」',gC(gR(`<b style="flex:1">薪水</b>${gIn('48,237')}${gB('記好',{pr:1,hl:1,n:1})}`)+`<div class="gx-s" style="color:var(--brand-d);font-weight:700">已預扣 11月請假 $1,663</div>`,'💰 收入到期'),
   `<p>發薪日會出現提醒，<b>金額已經扣好上個月請假</b>（節金照加班頁的預估）。跟薪資條一樣就按「記好」${gN(1)}，不一樣先改數字。</p>`),
  gStep(9,'備份、匯入、換手機',gR(`${gB('⬇️ 下載備份',{pr:1,hl:1,n:1})}`)+gR(`${gB('📥 匯入（Excel 或備份檔）',{n:2})}`),
   `<ul><li><b>下載備份</b>${gN(1)}：帳、設定、薪資條圖片存成一個檔，放雲端或寄給自己。超過 14 天沒備份會紅字提醒。</li><li><b>📥 匯入</b>${gN(2)}：可以選 Excel（照範本）或備份檔（.json）。</li><li><b>換手機</b>：電腦下載備份 → LINE「傳給自己」到手機並下載 → 手機打開網站按「📥 匯入」選那個檔。</li></ul><p class="small muted">電腦和手機的資料不會自動同步，建議固定在一台記帳。</p>`),
  gStep(10,'📋 本月收支表：打勾就完成',gC(`<table style="width:100%;font-size:11px;border-collapse:collapse"><tr style="background:#e6f6ec"><td><span class="gx-n" style="background:var(--ok)">✓</span></td><td>11/10</td><td><b>薪水</b></td><td style="text-align:right">+$49,900</td></tr><tr style="background:#fdeceb"><td><span class="gx-n">1</span></td><td>11/1</td><td><b>零卡</b></td><td style="text-align:right">-$2,875</td></tr></table>`),
   `<p>這個月要收、要繳的全部列成一張表，像 Excel 一樣。</p><ul><li><b>按左邊的方框</b>${gN(1)}：繳了／收到了，會記一筆帳，整列變<b>綠色＋打勾</b>。</li><li>再按一次可以改回未完成。</li><li>紅色＝逾期；最下面有收入、要繳、生活費、預計結餘的合計。</li></ul><p>按「放大看 →」到行事曆看完整的表；按「📒 月結表」看<b>每個月一欄</b>的總表（餘額、存款、現金、銀行）。</p>`),
  gStep(11,'☑ 多選一次刪除',gC(gR(`${gB('☑ 多選',{hl:1,n:1})}`)+gR(`<span class="gx-n" style="background:var(--brand)">✓</span><b style="flex:1">午餐</b><b>-$120</b>`)+gR(`${gB('🗑 刪除選取的 2 筆',{rd:1,n:2})}`)),
   `<p>「最近記帳紀錄」右上按「☑ 多選」${gN(1)}，點每一筆前面的方框打勾，再按「🗑 刪除選取的」${gN(2)}。</p><p>刪掉的會放在「最近刪除」，<b>30 天內可以救回來</b>。帳務管理頁也可以多選刪除。</p>`),
  gStep(12,'🧮 試算，覺得可以就照計畫',gC(gR(`<span class="gx-s" style="flex:1">手上有</span>${gIn('2000')}`)+gR(`${gIn('飯錢')}${gIn('150*7')}<b>$1,050</b>`)+gR(`${gIn('油錢')}${gIn('200')}<b>$200</b>`)+gR(`<span class="gx-s" style="flex:1">會剩</span><b style="color:var(--ok)">$750</b>`)+gR(gB('✅ 照計畫執行',{pr:1,hl:1,n:1}))),
   `<p>填手上有多少、每一項的算式（可以用 + − × ÷ 和括號，例如 150*7），馬上算出<b>會剩多少</b>。</p><p>覺得可以就按「✅ 照計畫執行」${gN(1)}，首頁會追蹤這幾天<b>實際花了多少</b>、還能花多少。試算本身不會記帳。</p>`)]},
 cal:{t:'行事曆使用說明',steps:()=>[
  gStep(1,'五種看法',gR(`<span class="seg" style="display:inline-flex"><button class="on" style="padding:3px 10px;font-size:11px">月檢視</button><button style="padding:3px 10px;font-size:11px">週檢視</button><button style="padding:3px 10px;font-size:11px">清單檢視</button></span>${gN(1)}`),
   `<p>上面切換${gN(1)}：<b>月檢視</b>像月曆、<b>週檢視</b>看一週每天的事、<b>清單檢視</b>照日期一條一條列出來（<b>點一行就能改金額、標已繳、取消延後</b>）、<b>📋 收支表</b>像 Excel 一張表，按方框打勾就是已繳／已收到（整列變綠）、<b>📒 月結表</b>每個月一欄：收入、支出、餘額、存款，還有現金和銀行各有多少。</p>`),
  gStep(2,'顏色代表什麼',gR(`<span class="pill ev-wait">待繳</span><span class="pill ev-today">今天／延後</span><span class="pill ev-done">已繳</span>`)+gR(`<span class="pill ev-late">逾期</span><span class="pill ev-income">收入</span><span class="pill ev-goal">目標</span>`),
   `<ul><li><b>灰</b>：還沒到期　<b>黃</b>：今天到期或延後</li><li><b>綠</b>：已繳／已入帳　<b>紅</b>：逾期</li><li><b>藍</b>：薪水、節金等收入　<b>紫</b>：存錢目標的截止日</li></ul>`),
  gStep(3,'點一下就能處理',gC(gR(`<b style="flex:1">零卡</b><span class="pill ev-late">逾期</span>`)+gR(`${gB('完成',{dk:1,hl:1,n:1})}${gB('延後到下個月',{rd:1,n:2})}`)),
   `<p>點月曆上的任何一筆，會跳出詳細資料。要繳的可以直接按「完成」${gN(1)}或「延後」${gN(2)}；點日期數字會切到那一週。</p><p>在<b>清單檢視</b>和<b>月結表</b>點一下可以改金額，按錯延後可以「取消延後」。</p>`),
  gStep(4,'這個月能存多少',gR(`${gK('預計收入','$49,900','var(--ok)')}${gK('要繳的錢','$45,000','var(--bad)')}`)+gR(`${gK('生活費','$5,000','#e0a100')}${gK('可以存','-$100','var(--bad)')}`),
   `<p>最上面四張卡會算：<b>預計收入 − 要繳的錢 − 生活費 = 這個月預計可以存</b>，跟📒月結表的「餘額」是同一個數字（已經記的加班費、其他收入和支出也算進去）。</p><p>變成<b>紅色負數</b>代表這個月會不夠用，可以早點想辦法（延後、少花一點）。換月份就能看之後每個月。</p>`),
  gStep(5,'📒 月結表：像 Excel 一樣看每個月',gC(`<table style="width:100%;font-size:11px;border-collapse:collapse"><tr style="background:var(--brand-soft)"><td><b>項目</b></td><td style="text-align:right"><b>115.12</b></td><td style="text-align:right"><b>116.1</b></td></tr><tr><td>薪水</td><td style="text-align:right;color:var(--ok)">49,900</td><td style="text-align:right;color:var(--ok)">49,900</td></tr><tr><td>房租</td><td style="text-align:right;color:var(--bad)">-3,900</td><td style="text-align:right;color:var(--bad)">-3,900</td></tr><tr style="border-top:2px solid var(--ink)"><td><b>餘額</b></td><td style="text-align:right"><b>5,500</b></td><td style="text-align:right"><b>6,777</b></td></tr><tr style="background:#fff8d6"><td><b>存款</b></td><td style="text-align:right"><b>22,471</b></td><td style="text-align:right"><b>29,248</b></td></tr><tr><td>　💵 現金</td><td style="text-align:right">4,400</td><td></td></tr><tr><td>　🏦 銀行</td><td style="text-align:right">18,000</td><td></td></tr></table>`)+gR(gB('📒 月結表',{pr:1,hl:1,n:1})),
   `<p>切到「📒 月結表」${gN(1)}（首頁收支表右上角也有連結）。左邊是項目，<b>每個月一欄</b>，可以選看 3、6、12 個月；手機往右滑看其他月份。</p><ul><li><b>餘額</b>：這個月收入 − 支出。</li><li><b>⬇️ 匯出 Excel</b>：把畫面上這幾個月的月結表（含總計）存成 Excel 檔（檔名 xiaozhang_monthly_月份.xlsx），數字可以在 Excel 裡直接加總、列印。<b>顏色跟畫面一樣</b>：已繳的有底色、收入綠色、支出紅色、預計是灰色斜體、總計和存款有黃底，主色跟著你選的色調（需要網路）。</li><li><b>總計</b>（最右邊一欄）：畫面上這幾個月加起來，例如 6 個月總共繳多少房租、總共存下多少；存款那格是最後一個月的期末金額。</li><li><b>存款</b>：這個月結束時大概有多少錢（過去＝月底實際、本月＝現在＋還沒發生的、之後＝預估）。</li><li><b>現金／銀行</b>：存款分成身上和銀行各多少（過去和本月）。</li><li><b>點一下格子</b>可以改數字，<b>空的「—」格子也可以點</b>，直接填那個月的金額（例：下個月水電已經知道多少）；固定項目可選「只改這個月」或「這個月起之後都改」；生活費、加班費只改那個月。</li><li><b>打錯、多打一格</b>：點那一格 →「🗑 刪除」，選「只刪這一格」或「從這個月起整列都刪掉」。</li><li><b>＋ 新增一列</b>（表格下面）：加新的分期、固定支出或收入，可以選只有一個月或每月、每幾個月。</li><li><b>點兩下</b>切換已繳／未繳，已繳的格子會<b>填滿顏色</b>（跟著你選的色調）。</li><li><b>全部聯動</b>：在這裡改的金額，繳費狀態、清單、收支表、首頁提醒都會一起變；行事曆上方的「預計可以存」、收支表的「預計結餘」和這裡的「餘額」是同一個數字。</li><li>淡色斜體＝預計。</li></ul>`)]},
 bills:{t:'繳費狀態使用說明',steps:()=>[
  gStep(1,'選月份、選分頁',gR(`${gB('◀')}<b>2026年11月</b>${gB('▶')}`)+gR(`${gN(1)}${gB('未繳（2）',{dk:1})}${gB('逾期（1）')}${gB('已繳（8）')}${gB('已延後')}${gB('全部')}`),
   `<p>用 ◀ ▶ 換月份。分頁${gN(1)}可以只看未繳、逾期、已繳、已延後。</p><p>狀態：${gTag('待繳')} 還沒到期、${gTag('今天到期','today')}、${gTag('逾期','late')} 過了期限還沒按完成、${gTag('已繳','done')}、${gTag('已延後 → 12月','moved')}。</p>`),
  gStep(2,'繳好了按「完成」',gC(gR(`<b style="flex:1">房租</b>${gTag('逾期','late')}${gB('完成',{dk:1,hl:1,n:1})}`))+gC(gR(`${gIn('實際繳了 8000')}${gIn('2026/11/21')}`)+gR(`${gIn('從哪個帳戶 ▾')}${gB('確定，記好這筆',{pr:1,n:2})}`)),
   `<p>按「完成」${gN(1)}會跳出小視窗，金額、日期、帳戶都可以改，按「確定」${gN(2)}才會記帳。</p><p>還款會記成「還某某」，<b>負債餘額自動減少</b>。</p>`),
  gStep(3,'繳不出來按「延後」',gC(gR(`<b style="flex:1">電腦</b>${gTag('已延後 → 12月','moved')}`))+gC(gR(`<b style="flex:1">電腦</b><span class="gx-s">11月延後過來</span>${gTag('待繳')}`),'12 月的清單'),
   `<p>按「延後」會把這筆挪到下個月：這個月顯示「已延後」，<b>下個月的清單多出這一筆</b>。不會記帳、不會扣負債。</p><p>下個月還是不行，可以再延後一次。</p>`),
  gStep(4,'貼繳費截圖',gC(gR(`<b style="flex:1">零卡</b><span class="gx-ph"></span>${gB('＋ 截圖',{hl:1,n:1})}`))+`<div class="gx-dash">按 Ctrl+V 貼上截圖</div>`,
   `<p>附件欄按「＋ 截圖」${gN(1)}，再按 <b>Ctrl+V</b> 貼上；手機按「選擇圖片」。點小圖可以看大圖或刪除。</p><p>截圖存在這台電腦的大容量空間，不會上傳。</p>`),
  gStep(5,'按錯了怎麼辦',gC(gR(`<b style="flex:1">房租</b>${gTag('已繳','done')}${gB('改回未繳',{hl:1,n:1})}`)+gR(`<b style="flex:1">電腦</b>${gTag('已延後 → 12月','moved')}${gB('取消延後',{n:2})}`)),
   `<p>「改回未繳」${gN(1)}：當時記的那筆帳移到「最近刪除」，30 天內可以救回來。</p><p>「取消延後」${gN(2)}：改回原本的月份繳。</p>`),
  gStep(6,'新增或修改項目',gR(`${gB('⚙️ 設定')}<span>→</span>${gB('📅 每月固定收支',{hl:1,n:1})}`),
   `<p>每月要繳的項目在「設定 → 每月固定收支」${gN(1)}新增、修改；「多久一次」可以選每月、每 2 個月、每 4 個月…。還負債的會<b>還清就自動停止</b>。</p>`)]},
 payslip:{t:'薪資條使用說明',steps:()=>[
  gStep(1,'點要放的月份',`<div class="gx-c" style="box-shadow:0 0 0 3px var(--brand-soft);border-color:var(--brand)">${gR(`<b>11 月</b>${gN(1)}<span class="gx-s" style="color:var(--brand-d)">Ctrl+V 會貼到這裡</span>`)}<div class="gx-dash">點這格，再按 Ctrl+V 貼上</div></div>`,
   `<p>先點一下要放的月份${gN(1)}，那一格會被框起來。</p>`),
  gStep(2,'Ctrl+V 貼上',gR(`<span class="gx-key">Ctrl</span>＋<span class="gx-key">V</span>`)+gC(gR(`<span class="gx-ph"></span><span class="gx-ph"></span>${gB('選擇圖片',{n:1})}`)),
   `<p>在 LINE 或別的地方截好圖，回到這頁按 <b>Ctrl+V</b>，就放進框起來的月份。</p><p>手機或要放檔案時，按「選擇圖片」${gN(1)}。一個月可以放好幾張。</p>`),
  gStep(3,'備註寫加班費，自動對帳',gC(gR(`<b>11 月</b>${gIn('5111',1)}${gN(1)}`))+gC(gR(`<span class="gx-s">⏱️ 加班頁・10 月</span>`)+gR(`<span style="flex:1">薪資條上的加班費</span><b>$5,111</b>`)+gR(`<span style="flex:1">差額</span><b style="color:var(--ok)">+$2</b>`)),
   `<p>在<b>那張薪資條月份</b>的備註${gN(1)}只寫數字（例：10 月薪資條寫 5111）或「加班費5111」，加班頁的 10 月就會自動帶入、算出差額；行事曆和月結表 11 月（發薪那個月）的加班費也會改成 5111。</p><p>寫「加班 34 小時」這種時數不會被當成金額。點圖片可以看大圖或刪除。</p>`),
  gStep(4,'記得備份',gR(`${gB('⚙️ 設定')}<span>→</span>${gB('下載備份',{hl:1,n:1})}`),
   `<p>薪資條只存在<b>這台電腦、這個瀏覽器</b>。請定期到「設定 → 下載備份」${gN(1)}，圖片會一起放進備份檔。</p><p><b>備份檔裡有薪資條，不要傳給別人。</b></p>`)]},
 ot:{t:'加班與請假使用說明',steps:()=>[
  gStep(1,'最快：在首頁打一句話',gC(gR(`${gIn('平日加班2H',1)}${gB('記',{pr:1,n:1})}`)+gR(`<span class="gx-chip">事假4H</span><span class="gx-chip">病假1天</span><span class="gx-chip">11/20 加班1.5H</span>`)),
   `<p>在首頁快速記帳打「平日加班2H」按「記」${gN(1)}，就記到這頁了。</p><p>沒寫平日／休息日會看星期幾自動判斷；前面加日期（11/20）可以補記。</p>`),
  gStep(2,'或在這頁新增一天',gC(gR(`${gIn('2026/11/20')}${gIn('平日加班 ▾')}`)+gR(`${gIn('申報 2',1)}${gIn('核准（被扣才填）')}`)+gR(`${gB('新增',{pr:1,n:1})}`),'➕ 新增一天'),
   `<p>填<b>實際時數</b>（0.5 小時為單位），不用自己分段，按「新增」${gN(1)}。</p><p><b>被人資扣時數</b>：申報填原本的，核准填實際給的，上面會顯示「被扣幾小時」。</p>`),
  gStep(3,'程式自動算加班費',gC(gR(`<b>11/20（五）</b><span class="gx-s">平日</span><span class="gx-s" style="margin-left:auto">2h×4/3</span>`)+gR(`<b>11/21（六）</b><span class="gx-s">休息日</span><span class="gx-s" style="margin-left:auto">2h×4/3 + 6h×5/3</span>`)),
   `<ul><li><b>平日</b>：前 2 小時 × 4/3，第 3～4 小時 × 5/3（每天分開算）</li><li><b>休息日</b>：前 2 小時 × 4/3，第 3～8 小時 × 5/3</li><li><b>國定假日</b>：8 小時內多給 1 天薪水</li></ul><p class="small muted">時薪＝月薪 ÷ 30 ÷ 8，用這頁的「月薪紀錄」；轉正或調薪就新增一筆。</p>`),
  gStep(4,'月底對薪資條',gR(`${gK('我算的','$3,000','var(--info)')}${gK('薪資條上','$2,900','var(--ok)')}`)+gR(`${gK('差額','-$100','var(--bad)')}<span class="gx-s" style="color:var(--bad)">公司少給你 $100</span>`),
   `<p><b>10 月加班 → 10 月薪資條</b>：在「📄 薪資條」10 月那張的備註寫加班費（例：5111），切到這頁的 10 月就會自動帶入（寫在 11 月那張也可以）；也可以直接在「對薪資條」填。</p><p><b>差額＝公司給的 − 我算的</b>：</p><ul><li><b>負的</b>：公司少給你，可以拿去問人資</li><li><b>0</b>：沒算錯</li><li><b>正的</b>：公司多給</li></ul>`),
  gStep(5,'請假會自動扣薪水',gC(gR(`<span>11/27 事假</span><b style="margin-left:auto">8 小時</b>`)+gR(`<span>這個月請假扣薪預估</span><b style="margin-left:auto;color:var(--bad)">-$1,663</b>`)),
   `<p>照政府規定算（時薪 × 請假時數）：</p><ul><li><b>事假、颱風假</b>：全扣</li><li><b>病假、生理假</b>：扣一半</li><li><b>公傷假</b>：不扣</li></ul><p>可以只請幾小時，例如打「事假2H」。這個月請的假，會從<b>下個月 10 號</b>的薪水扣；首頁薪水提醒的金額會自動扣好。</p><p>📎 病假記得交收據或醫生證明（宜休養），公傷假要附診斷證明。</p>`),
  gStep(6,'節金＋加給預估',gC(gR(`<span>畢業證書</span><b style="margin-left:auto">$8,000</b>`)+gR(`<span>節金</span><b style="margin-left:auto">$9,000</b>`)+gR(`<span>預估實拿</span><b style="margin-left:auto">$25,000</b>`),'🎁 節金＋加給預估'),
   `<p>每 4 個月一期（5/20、9/20、1/20 發）。在「設定加給」填每一項的金額和從哪個月起；<b>金額中途改了就再新增一筆</b>，會按月份比例算。</p><p>設定好「從哪次發放開始依請假扣」，那期起會照請假時數扣（生理假算一半）。</p>`)]},
 accounts:{t:'帳戶使用說明',steps:()=>[
  gStep(1,'先填每個帳戶現在有多少錢',gC(gR(`<span>🏦</span><b style="flex:1">薪轉帳戶</b><b>$12,000</b>`)+gR(`${gB('修改',{hl:1,n:1})}${gB('校正餘額')}${gB('異動紀錄')}`),'👛 我的帳戶'),
   `<p>最快：按「💰 一次填好全部餘額」（首頁「👛 我的錢」的「填／校正」也一樣），每個帳戶填<b>現在實際有多少錢</b>。也可以按個別帳戶的「修改」${gN(1)}。之後記帳就會自動加減。</p><p>從銀行領錢放身上，打「薪資帳戶領1000」，算轉帳、不算花掉。</p><p class="small muted">名稱只寫暱稱（例：台新），不要寫帳號、卡號。</p>`),
  gStep(2,'新增帳戶',gC(gR(`${gIn('名稱：台新')}${gIn('類型：銀行 ▾')}`)+gR(`${gIn('起始餘額 5000')}${gB('新增',{pr:1,hl:1,n:1})}`)),
   `<p>在「新增帳戶」填名稱、類型、起始餘額，按「新增」${gN(1)}。</p><p><b>信用卡</b>：起始餘額填負數（欠 8000 就填 -8000），再按「修改」填每月繳款日。</p>`),
  gStep(3,'跟銀行對不上：校正餘額',gC(gR(`<b style="flex:1">薪轉帳戶</b><span class="gx-s">算出來 $12,000</span>`)+gR(`${gIn('銀行實際 11,800',1)}${gB('校正餘額',{pr:1,n:1})}`)),
   `<p>忘了記某幾筆、跟銀行 App 不一樣時，按「校正餘額」${gN(1)}，填實際金額。會記一筆「校正」，<b>不算收入或支出</b>。</p>`),
  gStep(4,'資產負債表',gC(gR(`<span style="flex:1">總資產</span><b style="color:var(--ok)">$12,000</b>`)+gR(`<span style="flex:1">總負債</span><b style="color:var(--bad)">$158萬</b>`)+gR(`<b style="flex:1">淨資產</b><b>-$157萬</b>`),'📊 資產負債表'),
   `<p><b>淨資產＝所有帳戶的錢 − 還欠的錢</b>。下面的長條圖是每個月底的淨資產，每還一期，紅色會慢慢變短。</p>`)]},
 debts:{t:'負債使用說明',steps:()=>[
  gStep(1,'看還剩多少',gC(gR(`<span>🏦</span><b style="flex:1">元大</b><b style="color:var(--bad)">還欠 $644,754</b>`)+gR(`<span class="gx-s" style="flex:1">每月 $9,769・剩約 66 期</span>`)+`<div class="prog" style="margin:0"><i style="width:21%"></i></div>`),
   `<p>每筆貸款、分期會顯示：還欠多少、每月繳多少、還剩幾期、下次繳款日。綠色長條是已還的比例。</p>`),
  gStep(2,'還款怎麼記',gR(`${gB('🧾 繳費狀態')}<span>→</span>${gB('完成',{dk:1,hl:1,n:1})}`)+gC(gR(`${gIn('還元大9769',1)}${gB('記',{pr:1,n:2})}`)),
   `<p>設了每月固定還款的，到「繳費狀態」按「完成」${gN(1)}就好。</p><p>臨時多還，在首頁打「還元大9769」${gN(2)}。還款<b>算支出</b>，負債會自動減少。</p>`),
  gStep(3,'新增、修改、看明細',gR(`${gB('明細',{n:1})}${gB('修改',{n:2})}${gB('刪除',{rd:1})}`)+gR(gB('➕ 新增貸款／分期',{hl:1,n:3})),
   `<p>「明細」${gN(1)}看每一次還款；「修改」${gN(2)}改金額、繳款日、到期日；「➕ 新增」${gN(3)}加新的貸款或分期。</p>`),
  gStep(4,'跟朋友借還',gC(gR(`<span>📤</span><span style="flex:1">欠俊佑</span><b>$400,000</b>`),'👥 跟朋友借還')+gC(gR(`${gIn('還俊佑5000',1)}${gB('記',{pr:1})}`)),
   `<p>不用先建立，直接在首頁打：「跟小明借錢1500」「還小明1000」「小明還800」。</p><p>跟朋友借還<b>不算收入或支出</b>，只會改帳戶餘額和這裡的金額。</p>`),
  gStep(6,'📄 攤還表、提前還款試算',gR(gB('📄 攤還表／提前還',{pr:1,n:1}))+gC(gR(`<span style="flex:1">剩餘本金</span><b>$540,186</b>`)+gR(`<span style="flex:1">年利率</span><b>6.55%</b>`)),
   `<ul><li>先按「修改」填<b>年利率</b>。不知道的話展開「用繳款明細反推」，填銀行明細上任一期的<b>第幾期、本金、利息</b>和總期數，按「算利率」就會自動填好。</li><li>按「📄 攤還表／提前還」${gN(1)}看每一期的本金、利息、剩餘本金（灰色是已經繳過的）。</li><li>下面「提前清償模擬」填哪個月、多還多少，就知道會<b>提早幾個月還清、省多少利息</b>。</li><li class="small muted">只是試算，不會記帳；每月繳的錢還是整筆算支出。實際金額以銀行為準。</li></ul>`),
  gStep(5,'💳 信用卡：刷卡算支出，繳卡費不算',gC(gR(`${gIn('晚餐3000 中信卡',1)}<span class="gx-s">→ 支出</span>`)+gR(`${gIn('繳中信卡3000',1)}<span class="gx-s">→ 轉帳</span>`))+gR(gB('💳 繳卡費',{pr:1,hl:1,n:1})),
   `<ul><li><b>刷卡</b>：打「晚餐3000 中信卡」，記成支出，卡片欠款增加。</li><li><b>繳卡費</b>：打「繳中信卡3000」或「台新繳中信卡3000」，或按卡片旁的「💳 繳卡費」${gN(1)}。記成<b>轉帳</b>：銀行減少、卡片欠款減少，<b>本月支出不會再加一次</b>。</li><li>信用卡有設繳款日的話，繳費狀態和收支表會出現「卡費」，打勾就是繳卡費。</li></ul><p class="small muted">信用卡在「帳戶」新增時類型選「信用卡」，欠款填負數。</p>`)]},
 savings:{t:'儲蓄使用說明',steps:()=>[
  gStep(1,'新增目標',gC(gR(`${gIn('名稱：旅遊基金')}${gIn('目標 30000')}`)+gR(`${gIn('期限 2027/6/30')}${gB('新增',{pr:1,hl:1,n:1})}`),'➕ 新增目標'),
   `<p>按「➕ 新增目標」填名稱、目標金額、期限（可不填），按「新增」${gN(1)}。名稱可以有數字，例如「存滿13000」。</p>`),
  gStep(2,'自己標記：存了就打一句',gC(gR(`${gIn('旅遊基金存5000',1)}${gB('記',{pr:1,n:1})}`)),
   `<p>在首頁打「旅遊基金存5000」${gN(1)}，進度就會增加。</p><p>這種方式<b>帳戶餘額不變、不算支出</b>，只是幫你記「這些錢是要存的」。</p>`),
  gStep(3,'綁定帳戶：有專門的存錢帳戶',gC(gR(`${gIn('台新轉儲蓄專戶5000',1)}${gB('記',{pr:1,n:1})}`)),
   `<p>目標選「綁定帳戶」時，那個帳戶的餘額就是存了多少。用轉帳存錢${gN(1)}，例如「台新轉儲蓄專戶5000」。</p>`),
  gStep(4,'看進度',gC(gR(`<b style="flex:1">旅遊基金</b><b>$12,000 / $30,000</b>`)+`<div class="prog" style="margin:0"><i style="width:40%"></i></div>`+gR(`<span class="gx-s">還要 $18,000・每月約 $2,571</span>`)),
   `<p>會顯示存了多少、還差多少、照期限每個月要存多少。達成後可以按「完成」收起來。</p>`)]},
 sim:{t:'情境模擬使用說明',steps:()=>[
  gStep(1,'設定情境',gC(gR(`<span class="gx-s" style="flex:1">每月多存</span>${gIn('2000',1)}`)+gR(`<span class="gx-s" style="flex:1">提前還</span>${gIn('元大 ▾')}${gIn('30000')}`)+gR(`<span class="gx-s" style="flex:1">🛵 買機車</span>${gIn('2027-05')}${gIn('70000')}`)),
   `<ul><li><b>每月多存（少花）</b>、<b>每月加班費預估</b>：從下個月起每月加上去。</li><li><b>提前還一筆</b>：選負債、哪個月、多還多少。有填年利率的會用攤還算，還清後就不用再繳月付。</li><li><b>買東西</b>：勾「要模擬」，填哪個月、一次付多少、分期、每月養車費。</li></ul><p class="small muted">改了馬上重算，只是試算，不會記帳。基準就是你的月結表。</p>`),
  gStep(2,'看結果',gR(`${gB('12 個月')}${gB('24 個月',{pr:1,n:1})}${gB('36 個月')}`)+gR(`${gK('12 個月後','$86,400','var(--brand)')}${gK('24 個月後','$152,000','var(--brand)')}`),
   `<ul><li>按 12／24／36 個月${gN(1)}切換長度。</li><li><b>實線</b>是模擬後，<b>虛線</b>是照目前計畫；手指點圓點看那個月的數字。</li><li>存款如果會變成負的，會出現⚠️提醒是哪個月。</li><li>「逐月明細」可以展開看每個月。</li></ul>`)]},
 manage:{t:'帳務管理使用說明',steps:()=>[
  gStep(1,'選要看什麼',gR(`${gB('📊 月報表',{pr:1,n:1})}${gB('📈 年報表')}${gB('每日')}${gB('每月')}`)+gR(`${gB('依分類看支出')}${gB('依帳戶看支出')}${gB('🔍 搜尋',{n:2})}`),
   `<p>上面一排${gN(1)}切換：月報表、年報表、每日、每月、依分類、依帳戶。要找某一筆用「🔍 搜尋」${gN(2)}。</p>`),
  gStep(2,'月報表',gR(`${gK('當月收入','$52,000','var(--ok)')}${gK('當月支出','$18,300','var(--bad)')}`)+gC(`<div class="gx-s">📉 每日支出趨勢</div><div class="prog" style="margin:0"><i style="width:60%;background:var(--accent)"></i></div>`),
   `<p>選年、月，看這個月收入、支出、結餘，跟上個月比多少；下面有每天花多少、花在哪些分類。</p><p class="small muted">轉帳、存進儲蓄、跟朋友借還不算收支；還貸款算支出。</p>`),
  gStep(3,'年報表',gC(gR(`<span style="flex:1">1月</span><span class="gx-s">收 $52,000・支 $40,100</span>`)+gR(`<span style="flex:1">2月</span><span class="gx-s">收 $52,000・支 $38,900</span>`)),
   `<p>一年 12 個月並排，看每月結餘和儲蓄率，也能跟去年比。</p>`),
  gStep(5,'🔍 消費分析',gR(`${gB('月',{pr:1,n:1})}${gB('季')}${gB('年')}`)+gR(`${gK('固定支出','$12,000','#e0a100')}${gK('變動支出','$8,300','var(--info)')}`),
   `<p>上面選<b>月、季、年</b>${gN(1)}，跟上一期比。</p><ul><li><b>總支出、每日平均</b>，和上期比多還是少。</li><li><b>固定 vs 變動</b>：房租、帳單、還款、每月固定收支算固定；吃飯、購物等日常花費算變動。</li><li><b>花最多的前 10 名</b>，點一下可以修改。</li><li><b>各分類 vs 上期</b>，選「月」時還會看分類預算剩多少。</li></ul>`),
  gStep(4,'搜尋與修改',gC(gR(`${gIn('🔍 午餐',1)}${gIn('全部類型 ▾')}`)+gR(`<span>🍙</span><b style="flex:1">午餐</b><b style="color:var(--bad)">-$120</b>`)),
   `<p>打關鍵字（項目、分類、對象、帳戶都可以），也可以選類型和日期範圍。點結果就能修改或刪除。</p><p><b>一次刪很多筆</b>：右上按「☑ 多選刪除」，打勾後按「🗑 刪除選取的」，會放進「最近刪除」30 天內可救回。</p><p>要匯出給 Excel，到「設定 → 匯出 CSV」。</p>`)]},
 opts:{t:'常用選項使用說明',steps:()=>[
  gStep(1,'快速記帳常用語',gC(gR(`${gIn('平日加班2H')}${gB('↑')}${gB('↓')}${gB('儲存',{n:1})}${gB('刪除',{rd:1,n:2})}`)),
   `<p>直接改字按「儲存」${gN(1)}；↑↓ 調整在首頁出現的順序；不要的按「刪除」${gN(2)}。</p>`),
  gStep(2,'對象清單與常用詞',gC(gR(`<span class="gx-chip">A同事 ×</span><span class="gx-chip">2姊 ×</span>`),'👥 對象清單')+gC(gR(`<span>咖啡</span><span>→ 餐飲</span>${gB('刪除',{rd:1})}`),'🏷️ 常用詞'),

function otQuick(raw){ const t=String(raw||'').trim().replace(/\s+/g,'');
  const m=t.match(/^(?:(\d{1,2})[\/.月](\d{1,2})日?)?(?:(平日|休息日|休息|假日|國定假日|例假)(?:加班)?|加班)(\d+(?:\.\d+)?)(h|hr|小時)?$/i)||t.match(/^(?:(\d{1,2})[\/.月](\d{1,2})日?)?加班(平日|休息日|休息|假日|國定假日|例假)(\d+(?:\.\d+)?)(h|hr|小時)?$/i);
  const l=t.match(/^(?:(\d{1,2})[\/.月](\d{1,2})日?)?(事假|病假|生理假|颱風假|公傷假|公傷病假)(\d+(?:\.\d+)?)(h|hr|小時|天)?$/i);
  if(!m&&!l) return false; const g=m||l, y=+today().slice(0,4), date=g[1]?ymd(y,+g[1],+g[2]):today();
  if(!date){ alert('日期看起來不對，請再確認一下。'); return true; }
  let hrs=Number(g[4]); if(l&&/天/.test(g[5]||'')) hrs*=8;
  if(!(hrs>0)||hrs*2!==Math.round(hrs*2)||hrs>24){ alert('時數要以 0.5 小時為單位，例如：平日加班2H、事假4H'); return true; }
  let kind; if(l) kind={事假:'lv_personal',病假:'lv_sick',生理假:'lv_men',颱風假:'lv_typhoon',公傷假:'lv_injury',公傷病假:'lv_injury'}[g[3]];
  else if(g[3]) kind={平日:'wd',休息日:'rest',休息:'rest',假日:'hol',國定假日:'hol',例假:'hol'}[g[3]];
  else { const w=new Date(date+'T00:00').getDay(); kind=w===6?'rest':w===0?'hol':'wd'; }
  const o=JSON.stringify(S.ot); S.ot.days.push({id:newId(),date,kind,hrs,appr:null,note:''}); if(!persist()){ S.ot=JSON.parse(o); return true; }
  if(page==='home') renderHome(); flash(`已記到加班頁 ✦ ${fmtMD(date)} ${OT_KIND[kind]} ${hrs} 小時${proofTip(kind)}`); return true; }
